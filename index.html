  // ---------------------------------------------------------------- simulation / impulse queue
  const impulseQueue = [];
  function addImpulseWorld(x, z, radius, strength) {
    const uv = worldToSimUV(x, z);
    if (uv.x < 0.02 || uv.x > 0.98 || uv.y < 0.02 || uv.y > 0.98) return;
    if (impulseQueue.length > 22) impulseQueue.shift();
    impulseQueue.push({ u: uv.x, v: uv.y, r: Math.max(0.0025, radius), s: strength });
  }
  function stepSimulation() {
    if (!simRT_A) return;
    const u = simMaterial.uniforms.uImpulse.value;
    // latest 6 impulses, oldest-first
    const n = Math.min(6, impulseQueue.length);
    for (let i = 0; i < 6; i++) {
      if (i < n) {
        const imp = impulseQueue[impulseQueue.length - n + i];
        u[i].set(imp.u, imp.v, imp.r, imp.s);
      } else u[i].set(0, 0, 0, 0);
    }
    impulseQueue.length = 0;
    simMaterial.uniforms.uState.value = simRT_A.texture;
    renderer.setRenderTarget(simRT_B);
    renderer.clear();
    renderer.render(simScene, simCamera);
    renderer.setRenderTarget(null);
    const tmp = simRT_A; simRT_A = simRT_B; simRT_B = tmp;
    if (waterQuad) waterQuad.material.uniforms.tHeight.value = simRT_A.texture;
  }

  function rayOutline(spec, s) {
    const a = Math.abs(s);
    if (spec.kind === 'manta') {
      let lead = spec.leadC - 0.95 * Math.pow(a, 1.58);
      lead += 0.10 * Math.exp(-Math.pow((a - 0.17) / 0.08, 2));
      const trail = -0.85 + 0.89 * Math.pow(a, 1.58);
      return { lead, trail };
    }
    if (spec.kind === 'eagle') {
      const lead = spec.leadC - 0.88 * Math.pow(a, 1.22);
      const trail = -0.6 + 0.87 * Math.pow(a, 2.05);
      return { lead, trail };
    }
    const root = Math.sqrt(Math.max(0, 1 - a * a));
    const lead = 0.9 * root + 0.08 + 0.05 * Math.exp(-a * a * 60);
    const trail = -0.78 * root + 0.025;

  }

        }

          }

      } else {

        bg.addColorStop(0, 'rgba(255,250,234,.4)'); bg.addColorStop(.75, 'rgba(219,200,171,.2)'); bg.addColorStop(1, 'rgba(150,160,151,.45)');

  function buildRayGeometry(spec, capacity) {
    const positions = [], uvs = [], bends = [], tails = [];
    const indices = [];
    const NU = 42, NV = 18;
    const BODY_V = 0.83;
    let topIndexCount = 0;

    function addSheet(sign) {
      const startVertex = positions.length / 3;
      const startIndex = indices.length;
      const thickness = sign > 0 ? 0.028 : -0.018;
      for (let iv = 0; iv <= NV; iv++) {
        const t = iv / NV;
        for (let iu = 0; iu <= NU; iu++) {
          const s = -1 + 2 * iu / NU;
          const a = Math.abs(s);
          const shape = rayOutline(spec, s);
          const z = lerp(shape.lead, shape.trail, t);
          let y = thickness + Math.sin(t * Math.PI) * (1 - a * a) * (sign > 0 ? 0.055 : 0.008);
          if (sign > 0) y += (1 - a) * 0.018;
          positions.push(s * spec.halfSpan, y, z);
          uvs.push((s + 1) * 0.5, t * BODY_V);
          bends.push(Math.abs(s));
          tails.push(0);
        }
      }
      for (let iv = 0; iv < NV; iv++) {
        for (let iu = 0; iu < NU; iu++) {
          const a = startVertex + iv * (NU + 1) + iu;
          const b = a + 1;
          const c = a + NU + 1;
          const d = c + 1;
          if (sign > 0) indices.push(a, c, b, b, c, d);
          else indices.push(a, b, c, b, d, c);
        }
      }
      // tail — two symmetrical ribbons, added to each sheet
      const NT = 18, NW = 3;
      const tailBaseZ = rayOutline(spec, 0).trail - 0.01;
      const tailStartVertex = positions.length / 3;
      for (let iv = 0; iv <= NT; iv++) {
        const t = iv / NT;
        const width = lerp(0.16, 0.012, Math.pow(t, 0.55)) * (spec.kind === 'manta' ? .8 : 1);
        for (let iw = 0; iw <= NW; iw++) {
          const s = -1 + 2 * iw / NW;
          positions.push(s * width, thickness * 0.7 + (sign > 0 ? 0.003 : -0.002), tailBaseZ - spec.tailLen * t);
          uvs.push(iw / NW, 0.858 + t * 0.126);
          bends.push(0);
          tails.push(t);
        }
      }
      for (let iv = 0; iv < NT; iv++) {
        for (let iw = 0; iw < NW; iw++) {
          const a = tailStartVertex + iv * (NW + 1) + iw;
          const b = a + 1, c = a + NW + 1, d = c + 1;
          if (sign > 0) indices.push(a, c, b, b, c, d);
          else indices.push(a, b, c, b, d, c);
        }
      }
      return indices.length - startIndex;
    }

    topIndexCount = addSheet(1);
    addSheet(-1);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setAttribute('aBend', new THREE.Float32BufferAttribute(bends, 1));
    geo.setAttribute('aTail', new THREE.Float32BufferAttribute(tails, 1));
    geo.setIndex(indices);
    geo.addGroup(0, topIndexCount, 0);
    geo.addGroup(topIndexCount, indices.length - topIndexCount, 1);
    geo.computeVertexNormals();
    geo.computeBoundingSphere();
    geo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(new Float32Array(capacity), 1));
    geo.setAttribute('aExcite', new THREE.InstancedBufferAttribute(new Float32Array(capacity), 1));
    return geo;
  }

  class RaySystem {
    constructor(spec) {
      this.spec = spec;
      this.capacity = 48;
      this.creatures = [];
      this.uniforms = {
        uTime: { value: 0 },
        uFlapSpeed: { value: spec.flapSpeed },
        uFlapAmp: { value: spec.flapAmp },
        uUndulate: { value: spec.undulate },
        uTailSway: { value: spec.tailSway }
      };
      this.geometry = buildRayGeometry(spec, this.capacity);
      this.topTex = makeRayTexture(spec, 'top');
      this.bottomTex = makeRayTexture(spec, 'bottom');
      const common = {
        roughness: 0.52, metalness: 0.02, envMapIntensity: 0.42, side: THREE.DoubleSide,
        emissive: new THREE.Color(0x0a1818), emissiveIntensity: 0.55
      };
      this.topMat = new THREE.MeshStandardMaterial(Object.assign({ map: this.topTex, color: 0xffffff }, common));
      this.bottomMat = new THREE.MeshStandardMaterial(Object.assign({ map: this.bottomTex, color: 0xffffff }, common));
      if (spec.key === 'stingray') {
        this.topMat.emissive = new THREE.Color(0x221305);
        this.topMat.emissiveIntensity = 1.0;
      }
      [this.topMat, this.bottomMat].forEach((m) => this.bindMaterial(m));
      this.mesh = new THREE.InstancedMesh(this.geometry, [this.topMat, this.bottomMat], this.capacity);
      this.mesh.count = 0;
      this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      this.mesh.frustumCulled = false;
      this.mesh.castShadow = true;
      this.mesh.receiveShadow = false;
      this.mesh.name = 'rays-' + spec.key;
      scene.add(this.mesh);
      this.dummy = new THREE.Object3D();
      this.aPhase = this.geometry.attributes.aPhase;
      this.aExcite = this.geometry.attributes.aExcite;
    }
    bindMaterial(mat) {
      const uniforms = this.uniforms;
      mat.onBeforeCompile = (shader) => {
        Object.assign(shader.uniforms, uniforms);
        shader.fragmentShader = shader.fragmentShader.replace('#include <map_fragment>', `
          #include <map_fragment>
          diffuseColor.rgb = diffuseColor.rgb * 1.14 + vec3(0.009,0.016,0.017);
        `);
        shader.vertexShader = `
          attribute float aBend;
          attribute float aTail;
          attribute float aPhase;
          attribute float aExcite;
          uniform float uTime;
          uniform float uFlapSpeed;
          uniform float uFlapAmp;
          uniform float uUndulate;
          uniform float uTailSway;
          ${shader.vertexShader}
        `.replace('#include <begin_vertex>', `
          #include <begin_vertex>
          float oceanBend = abs(aBend);
          float oceanPhase = uTime * uFlapSpeed + aPhase;
          float oceanWing = pow(oceanBend, 1.52);
          float oceanExc = aExcite;
          if(uUndulate > 0.5){
            transformed.y += sin(oceanPhase*1.32 - oceanBend*3.4) * uFlapAmp * (0.35 + oceanBend) * (1.0 + oceanExc);
            transformed.y += sin(oceanPhase*0.7 + 1.4) * uFlapAmp * 0.26;
          } else {
            transformed.y += sin(oceanPhase) * uFlapAmp * oceanWing * (1.0 + oceanExc*1.35);
            transformed.y += cos(oceanPhase + 0.5) * uFlapAmp * 0.12 * oceanWing;
            transformed.z += cos(oceanPhase) * uFlapAmp * 0.085 * oceanBend;
          }
          float oceanTw = aTail;
          transformed.x += sin(uTime*2.15 + aPhase*1.31 - oceanTw*5.1) * uTailSway * oceanTw * oceanTw * (1.0 + oceanExc*.5);
          transformed.y += cos(uTime*1.94 + aPhase - oceanTw*4.7) * uTailSway * 0.28 * oceanTw;
        `);
      };
      mat.customProgramCacheKey = () => 'ocean-ray-' + this.spec.key;
    }
    add(x, z, opts = {}) {
      if (this.creatures.length >= this.capacity) return null;
      const index = this.creatures.length;
      const spec = this.spec;
      const q = shoreQ(x, z);
      const y = opts.y !== undefined ? opts.y : -Math.max(0.9, Math.min(3.3, 1.2 + q * 0.08));
      const r = {
        system: this, index, key: spec.key, spec,
        pos: new THREE.Vector3(x, y, z),
        heading: opts.heading !== undefined ? opts.heading : sr(0, TAU),
        speed: spec.speed * sr(0.8, 1.15),
        targetSpeed: spec.speed,
        scale: spec.scale * (opts.scale || sr(0.86, 1.1)),
        phase: sr(0, TAU),
        excite: 0,
        bank: 0,
        pitch: 0,
        flip: 0,
        mode: opts.mode || 'swim',
        modeTime: 0,
        wanderTimer: sr(2, 6),
        wanderAngle: sr(0, TAU),
        breachTimer: sr(12, 28),
        wakeTimer: sr(0.2, 0.9),
        restTimer: sr(16, 25),
        age: 0,
        lastY: y,
        restDepth: opts.rest ? terrainHeight(x, z) + 0.13 : null,
        homeDepth: y
      };
      if (opts.rest) {
        r.mode = 'rest';
        r.pos.y = terrainHeight(x, z) + 0.13;
        r.targetSpeed = 0;
      }
      this.aPhase.array[index] = r.phase;
      this.aExcite.array[index] = 0;
      this.aPhase.needsUpdate = true; this.aExcite.needsUpdate = true;
      this.creatures.push(r);
      allRays.push(r);
      this.mesh.count = this.creatures.length;
      return r;
    }
    steerAway(r, x, z) {
      const dx = x - beach.cx, dz = z - beach.cz;
      const outward = Math.atan2(dx, dz);
      let diff = ((outward - r.heading + Math.PI * 3) % TAU) - Math.PI;
      r.heading += diff * 0.08;
    }
    update(dt, t) {
      this.uniforms.uTime.value = t;
      const active = this.creatures;
      for (let i = 0; i < active.length; i++) {
        const r = active[i];
        r.age += dt; r.modeTime += dt;
        let excitation = 0;
        const nearSurface = r.pos.y > -1.35;

        if (r.mode === 'swim' || r.mode === 'flee') {
          if (r.mode === 'flee' && r.modeTime > 2.4) { r.mode = 'swim'; r.modeTime = 0; }
          r.wanderTimer -= dt;
          if (r.wanderTimer < 0) {
            r.wanderTimer = sr(2.2, 6.2);
            r.wanderAngle = sr(0, TAU);
          }
          const q = shoreQ(r.pos.x, r.pos.z);
          let steer = Math.sin(t * 0.21 + r.phase) * 0.13;
          if (q < 2.1) {
            const outward = Math.atan2(r.pos.x - beach.cx, r.pos.z - beach.cz);
            steer = ((outward - r.heading + Math.PI * 3) % TAU) - Math.PI;
            if (r.mode === 'swim') steer *= 0.7;
          } else if (!insideView(r.pos.x, r.pos.z, 2.1)) {
            const toward = Math.atan2(-r.pos.x, -r.pos.z);
            steer = ((toward - r.heading + Math.PI * 3) % TAU) - Math.PI;
          }
          if (r.mode === 'flee') steer += Math.sin(t * 1.4 + r.phase) * 0.2;
          if (whirl.strength > 0.02) {
            const dx = whirl.center.x - r.pos.x, dz = whirl.center.z - r.pos.z;
            const dist = Math.hypot(dx, dz);
            if (dist < 12) {
              const swirl = Math.atan2(dx, dz) + Math.PI * 0.45;
              steer += (((swirl - r.heading + Math.PI * 3) % TAU) - Math.PI) * whirl.strength * (1 - dist / 12) * 0.7;
              r.pos.x += (dx / Math.max(0.1, dist)) * dt * 0.24 * whirl.strength;
              r.pos.z += (dz / Math.max(0.1, dist)) * dt * 0.24 * whirl.strength;

          const turn = clamp(steer, -1.2, 1.2) * (r.mode === 'flee' ? 2.4 : 1.1);
          r.heading += turn * dt;
          r.bank = lerp(r.bank, clamp(-turn * 0.56, -0.65, 0.65), dt * 2.6);
          const sp = r.mode === 'flee' ? r.spec.speed * 2.0 : r.speed;
          r.pos.x += Math.sin(r.heading) * sp * dt;
          r.pos.z += Math.cos(r.heading) * sp * dt;
          const targetY = r.mode === 'flee' ? r.homeDepth - 0.25 : r.homeDepth + Math.sin(t * 0.42 + r.phase) * 0.3;
          r.pos.y = lerp(r.pos.y, clamp(targetY, -3.8, -0.72), dt * 0.8);
          excitation = r.mode === 'flee' ? 1.1 : (nearSurface ? 0.2 : 0.06);
          if (r.mode === 'swim') {
            r.breachTimer -= dt;
            if (r.breachTimer < 0 && (r.spec.kind === 'manta' || r.spec.kind === 'eagle')) {
              r.breachTimer = sr(20, 40);
              if (r.pos.y > -2.1 && q > 3.5) {
                r.mode = 'breach'; r.modeTime = 0;
                r.velY = sr(3.3, 4.2); r.flipSpeed = sr(4.6, 6.4);
                r.flip = 0; r.breachSplashExit = false;
              }
            }
          }
          if (r.mode === 'flee' && r.key === 'stingray' && r.modeTime < 0.12) {
            fx.silt(r.pos.x, r.pos.z, 1.0);
          }
        } else if (r.mode === 'breach') {
          const gravity = 7.4;
          r.pos.x += Math.sin(r.heading) * r.speed * dt * 1.25;
          r.pos.z += Math.cos(r.heading) * r.speed * dt * 1.25;
          r.velY -= gravity * dt;
          r.pos.y += r.velY * dt;
          r.flip += r.flipSpeed * dt;
          r.bank = lerp(r.bank, 0, dt);
          excitation = 1.6;
          if (r.pos.y > 0 && r.lastY <= 0) fx.splash(r.pos.x, r.pos.z, 1.2, 0.45);
          if (r.pos.y > 0.3) {
            r.lastY = r.pos.y;
          }
          if (r.pos.y < -0.2 && r.lastY > 0) {
            fx.splash(r.pos.x, r.pos.z, 2.0, 0.85);
            fx.ripple(r.pos.x, r.pos.z, 1.0, 0.8);
            r.mode = 'swim'; r.modeTime = 0; r.pos.y = -0.8; r.velY = 0; r.lastY = r.pos.y;
            r.speed = r.spec.speed * 1.3;
            r.breachTimer = sr(22, 42);
          }
          r.lastY = r.pos.y;
        } else if (r.mode === 'rest') {
          const ground = terrainHeight(r.pos.x, r.pos.z);
          r.pos.y = ground + 0.12 + Math.sin(t * 1.3 + r.phase) * 0.015;
          r.bank = lerp(r.bank, 0, dt);
          r.pitch = lerp(r.pitch, 0, dt);
          r.restTimer -= dt;
          if (r.restTimer < 0) {
            r.mode = 'swim'; r.modeTime = 0; r.homeDepth = -1.8; r.restTimer = sr(18, 30);
            fx.silt(r.pos.x, r.pos.z, .35);
          }
          // stingray's disc barely undulates while resting
          excitation = 0.06;
        } else if (r.mode === 'held') {
          excitation = 1.3;
          r.pos.lerp(r.heldTarget, 1 - Math.exp(-dt * 9));
          r.bank = Math.sin(t * 2.0 + r.phase) * 0.2;
          r.pitch = Math.sin(t * 1.6 + r.phase) * 0.12;
        } else if (r.mode === 'falling') {
          r.velY -= 8.6 * dt;
          r.pos.y += r.velY * dt;
          excitation = 1.4;
          r.flip += dt * 2.2;
          const waterHit = r.pos.y <= 0 && r.lastY > 0;
          const ground = terrainHeight(r.pos.x, r.pos.z);
          if (waterHit) {
            fx.splash(r.pos.x, r.pos.z, 1.4, 0.75);
            fx.ripple(r.pos.x, r.pos.z, 1.1, 0.8);
            r.mode = 'swim'; r.pos.y = -0.8; r.velY = 0; r.modeTime = 0; r.homeDepth = -1.5; r.flip = 0;
            r.restTimer = sr(18, 30);
          } else if (r.pos.y <= ground + 0.15) {
            r.pos.y = ground + 0.14; r.mode = 'stranded'; r.modeTime = 0; r.velY = 0; r.flip = 0;
            fx.silt(r.pos.x, r.pos.z, 0.8);
          }
          r.lastY = r.pos.y;
        } else if (r.mode === 'stranded') {
          r.pos.y = terrainHeight(r.pos.x, r.pos.z) + 0.14 + Math.max(0, Math.sin(r.modeTime * 7.5)) * 0.13;
          r.bank = Math.sin(r.modeTime * 5.2) * 0.18;
          excitation = 1.5;
          if (r.modeTime > 1.5) {
            const outward = Math.atan2(r.pos.x - beach.cx, r.pos.z - beach.cz);
            const rr = shoreRadiusAt(r.pos.x, r.pos.z) + 1.7;
            r.pos.x = beach.cx + Math.sin(outward) * rr;
            r.pos.z = beach.cz + Math.cos(outward) * rr;
            r.pos.y = -0.7;
            r.heading = outward;
            r.mode = 'swim'; r.modeTime = 0; r.homeDepth = -1.4;
            fx.splash(r.pos.x, r.pos.z, 1.1, 0.5);
          }
        } else if (r.mode === 'thrown') {
          const th = r.throwState;
          th.t += dt / th.duration;
          const p = clamp(th.t, 0, 1);
          const inv = 1 - p;
          r.pos.x = inv * inv * th.start.x + 2 * inv * p * th.mid.x + p * p * th.to.x;
          r.pos.z = inv * inv * th.start.z + 2 * inv * p * th.mid.z + p * p * th.to.z;
          r.pos.y = inv * inv * th.start.y + 2 * inv * p * th.mid.y + p * p * th.to.y;
          r.heading = lerp(r.heading, Math.atan2(th.to.x - th.start.x, th.to.z - th.start.z), dt * 1.5);
          r.bank = Math.sin(p * Math.PI * 2) * 0.5;
          r.flip = Math.sin(p * Math.PI) * Math.PI;
          excitation = 1.5;
          if (r.lastY > 0 && r.pos.y <= 0) {
            fx.splash(r.pos.x, r.pos.z, 1.65, 0.85);
            fx.ripple(r.pos.x, r.pos.z, 0.9, 0.75);
          }
          r.lastY = r.pos.y;
          if (p >= 1) {
            r.mode = 'swim'; r.modeTime = 0; r.homeDepth = -1.4; r.flip = 0;
            r.lastY = r.pos.y;
            r.restTimer = sr(18, 32);
          }
        }

        if (r.mode !== 'breach' && r.mode !== 'thrown' && r.mode !== 'held' && r.mode !== 'falling' && r.mode !== 'stranded') {
          r.flip = lerp(r.flip, 0, dt * 2.5);
          const targetPitch = clamp((r.pos.y - r.homeDepth) * 0.12, -0.18, 0.18);
          r.pitch = lerp(r.pitch, targetPitch, dt * 1.5);
        }

        // surface wakes and surface splitting
        if (r.mode !== 'held' && r.mode !== 'thrown' && r.mode !== 'falling' && r.mode !== 'stranded' && r.pos.y > -1.25) {
          r.wakeTimer -= dt * (r.mode === 'flee' ? 1.8 : 1);
          if (r.wakeTimer <= 0) {
            r.wakeTimer = sr(0.15, 0.32);
            const back = 0.9 * r.scale;
            const wx = r.pos.x - Math.sin(r.heading) * back;
            const wz = r.pos.z - Math.cos(r.heading) * back;
            fx.wake(wx, wz, r.scale, r.heading, r.key);
            if (r.pos.y > -0.78) fx.ripple(r.pos.x, r.pos.z, 0.55, 0.12);
          }
        }

        this.aPhase.array[i] = r.phase;
        this.aExcite.array[i] = clamp(excitation + (r.mode === 'flee' ? 0.6 : 0), 0, 2.2);
        this.dummy.position.copy(r.pos);
        this.dummy.rotation.set(r.pitch, r.heading, r.bank + r.flip, 'YXZ');
        this.dummy.scale.setScalar(r.scale);
        this.dummy.updateMatrix();
        this.mesh.setMatrixAt(i, this.dummy.matrix);
      }
      this.mesh.count = active.length;
      this.mesh.instanceMatrix.needsUpdate = true;
      this.aPhase.needsUpdate = true;
      this.aExcite.needsUpdate = true;
      if (active.length) {
        this.mesh.visible = true;
        // rebuild bounding sphere from origin; frustumCulled is off, this is just for shadows
      }
    }
  }

  function initRaySystems() {
    Object.keys(RAY_SPECS).forEach((key) => {
      raySystems[key] = new RaySystem(RAY_SPECS[key]);
    });
  }

  function findClearSeaSpot() {
    const majors = [];
    if (reefData) {
      (reefData.rocks || []).forEach((o) => majors.push({ x: o.x, z: o.z, r: o.r + 1.3 }));
      (reefData.corals || []).forEach((o) => majors.push({ x: o.x, z: o.z, r: o.r + 1.3 }));
      (reefData.urchins || []).forEach((o) => majors.push({ x: o.x, z: o.z, r: 1.3 }));
    }
    const others = allRays.concat(allJellies);
    let best = null, bestScore = -1e9;
    for (let u = 0.17; u <= 0.43; u += 0.018) {
      for (let v = 0.35; v <= 0.64; v += 0.018) {
        const p = stageWorld(u, v);
        const q = shoreQ(p.x, p.z);
        if (q < 2.2 || q > 11) continue;
        if (!insideView(p.x, p.z, 2.4)) continue;
        let minClear = 99;
        for (const o of majors) {
          const d = Math.hypot(p.x - o.x, p.z - o.z) - o.r;
          if (d < minClear) minClear = d;
        }
        for (const o of others) {
          const d = Math.hypot(p.x - o.pos.x, p.z - o.pos.z) - 2.0;
          if (d < minClear) minClear = d;
        }
        // prefer open water a little distance out from the shore and near the left-middle
        const score = minClear * 2.0 + q * 0.18 - Math.abs(u - 0.28) * 2 - Math.abs(v - 0.48) * 1.2;
        if (score > bestScore) { bestScore = score; best = p; }
      }
    }
    if (!best) best = stageWorld(0.27, 0.47);
    return best;
  }

  function raySpawnInitial() {
    const manta1 = raySystems.manta.add(stageWorld(0.52, 0.43).x, stageWorld(0.52, 0.43).z, { heading: 2.1, y: -1.25 });
    const manta2 = raySystems.manta.add(stageWorld(0.74, 0.57).x, stageWorld(0.74, 0.57).z, { heading: 5.1, y: -1.55, scale: 0.8 });
    const eagle = raySystems.eagle.add(stageWorld(0.42, 0.58).x, stageWorld(0.42, 0.58).z, { heading: 0.9, y: -2.2 });
    const sting = findClearSeaSpot();
    const sr1 = raySystems.stingray.add(sting.x, sting.z, { heading: 0.3, rest: true, scale: 1.26 });
    if (sr1) { sr1.restTimer = 24; sr1.phase = 1.1; }
    [manta1, manta2, eagle].forEach((r, i) => { if (r) r.phase = i * 2.17 + sr(0, 1.2); });
  }

  function scareRaysAt(x, z, radius = 6.5, force = 1) {
    for (const r of allRays) {
      if (!r || r.mode === 'held' || r.mode === 'thrown' || r.mode === 'stranded') continue;
      const dx = r.pos.x - x, dz = r.pos.z - z;
      const dist = Math.hypot(dx, dz);
      if (dist > radius) continue;
      const dir = Math.atan2(dx, dz) + sr(-0.3, 0.3);
      r.heading = dir;
      r.bank = sr(-0.4, 0.4);
      r.mode = 'flee'; r.modeTime = 0; r.homeDepth = Math.min(r.homeDepth, -1.4);
      r.wakeTimer = 0;
      r.excite = 1;
      if (r.key === 'stingray' && r.pos.y < -0.2) {
        fx.silt(r.pos.x, r.pos.z, 1.2);
        fx.ripple(r.pos.x, r.pos.z, 0.65, 0.28);
      }
    }
  }

  // --------------------------------------------------------------- jellyfish
  const JELLY_SPECS = {

  const jellyShared = {};
  let jellyGlowTexture = null;
  function getJellyGlowTexture() {
    if (jellyGlowTexture) return jellyGlowTexture;
