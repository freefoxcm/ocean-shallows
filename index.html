<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';
  const loader = document.getElementById('loader');
  const loaderText = document.getElementById('loader-text');

  if (!window.THREE) {
    loader.innerHTML = '<div class="error-card"><strong>Ocean Shallows could not start.</strong><br>The Three.js library did not load. Please check your connection and refresh.</div>';
    return;
  }

  // ---------------------------------------------------------------- utility
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
  let seed = 0x51F0A7;
  function srand() {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const sr = (a = 0, b = 1) => a + srand() * (b - a);
  function hash2(x, y) {
    let h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
    return h - Math.floor(h);
  }

  // ------------------------------------------------------------- renderer
  const canvas = document.getElementById('scene');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance' });
  } catch (e) {
    loader.innerHTML = '<div class="error-card"><strong>WebGL is unavailable.</strong><br>Ocean Shallows needs a WebGL-capable browser.</div>';
    return;
  }
  renderer.setClearColor(0x072b38, 1);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.82;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.info.autoReset = true;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x07323e);

  // A very small hint of sky is useful for glossy wet sand and wet backs.
  const envTexture = makeEnvCube();
  scene.environment = envTexture;

  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 220);
  const CAM_TILT = 18 * DEG;
  const CAM_HEIGHT = 78;
  camera.position.set(0, CAM_HEIGHT, CAM_HEIGHT * Math.tan(CAM_TILT));
  camera.up.set(0, 1, 0);
  camera.lookAt(0, 0, 0);

  // --------------------------------------------------------------- lighting
  const hemi = new THREE.HemisphereLight(0xc7f1e5, 0x143b54, 0.4);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xfff1c9, 1.42);
  sun.position.set(-34, 46, -27);
  sun.target.position.set(3, 0, 3);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 150;
  sun.shadow.camera.left = -38;
  sun.shadow.camera.right = 38;
  sun.shadow.camera.top = 38;
  sun.shadow.camera.bottom = -38;
  sun.shadow.bias = -0.00035;
  sun.shadow.normalBias = 0.035;
  sun.shadow.radius = 2.4;
  scene.add(sun);
  scene.add(sun.target);

  const skyFill = new THREE.DirectionalLight(0xbdf7ff, 0.19);
  skyFill.position.set(10, 50, 18);
  scene.add(skyFill);

  const warmBounce = new THREE.DirectionalLight(0x56c8c1, 0.13);
  warmBounce.position.set(-16, 9, 30);
  scene.add(warmBounce);

  const overlayScene = new THREE.Scene();
  overlayScene.add(new THREE.HemisphereLight(0xe5fff4, 0x16414c, 0.85));
  const overlaySun = new THREE.DirectionalLight(0xfff3d8, 1.55);
  overlaySun.position.set(-8, 12, -7);
  overlayScene.add(overlaySun);
  const overlayFill = new THREE.DirectionalLight(0x9defff, 0.48);
  overlayFill.position.set(8, 6, 9);
  overlayScene.add(overlayFill);

  // --------------------------------------------------------------- camera field
  const view = { w: 32, h: 32, margin: 7, cw: 0, ch: 0, dpr: 1 };
  let beach = { cx: -16, cz: -16, r: 13, cornerX: -16, cornerZ: -16 };
  const GROUND = { minX: -20, maxX: 20, minZ: -20, maxZ: 20 };

  function updateCameraField(immediate) {
    const aspect = Math.max(0.42, window.innerWidth / Math.max(1, window.innerHeight));
    const base = 32;
    view.w = aspect >= 1 ? base * aspect : base;
    view.h = aspect >= 1 ? base : base / aspect;
    view.cw = window.innerWidth;
    view.ch = window.innerHeight;
    view.margin = Math.max(6, Math.min(12, Math.min(view.w, view.h) * 0.22));
    camera.left = -view.w / 2;
    camera.right = view.w / 2;
    camera.top = (view.h * Math.cos(CAM_TILT)) / 2;
    camera.bottom = -camera.top;
    camera.near = 0.1;
    camera.far = 230;
    camera.updateProjectionMatrix();
    const left = -view.w / 2, top = -view.h / 2;
    const R = clamp(Math.min(view.w * 0.34, view.h * 0.405), 9.8, 14.6);
    beach.r = R;
    beach.cornerX = left; beach.cornerZ = top;
    beach.cx = left + R * 0.09;
    beach.cz = top + R * 0.105;
    GROUND.minX = left - view.margin;
    GROUND.maxX = -left + view.margin;
    GROUND.minZ = top - view.margin;
    GROUND.maxZ = -top + view.margin;
    if (sun) {
      const ext = Math.max(view.w, view.h) * 0.62 + 12;
      sun.shadow.camera.left = -ext;
      sun.shadow.camera.right = ext;
      sun.shadow.camera.top = ext;
      sun.shadow.camera.bottom = -ext;
      sun.shadow.camera.updateProjectionMatrix();
    }
    if (immediate) resizeRenderTargets();
  }

  function shoreRadiusAt(x, z) {
    const a = Math.atan2(z - beach.cz, x - beach.cx);
    return beach.r * (1 + 0.046 * Math.sin(3 * a + 1.15) + 0.019 * Math.sin(7 * a - 0.65) + 0.010 * Math.sin(11 * a + 2.2));
  }
  function shoreQ(x, z) {
    const dx = x - beach.cx, dz = z - beach.cz;
    return Math.hypot(dx, dz) - shoreRadiusAt(x, z);
  }
  function seaDepth(q) {
    if (q <= 0) return 0;
    let d = 0.315 * q + 0.0068 * q * q;
    if (d > 11.5) d = 11.5 + Math.log1p(d - 11.5) * 0.62;
    return d;
  }
  function terrainHeight(x, z) {
    const q = shoreQ(x, z);
    if (q < 0) {
      const t = clamp(-q / (beach.r * 0.72), 0, 1);
      let h = 1.02 * Math.pow(t, 0.8);
      h += 0.038 * Math.sin(x * 1.7 + z * 0.85) + 0.025 * Math.sin(x * 3.8 - z * 2.1);
      h *= clamp(1 - q * 0.006, 0.9, 1.02);
      return Math.max(0, h);
    }
    let d = seaDepth(q);
    d += 0.20 * Math.sin(q * 1.16 + 1.2) * Math.exp(-q * 0.075);
    d += 0.065 * Math.sin((x - beach.cx) * 0.8 + (z - beach.cz) * 0.44 + 0.8);
    return -Math.max(0.008, d);
  }
  function stageWorld(u, v) {
    return { x: -view.w / 2 + u * view.w, z: -view.h / 2 + v * view.h };
  }
  function screenToWorld(clientX, clientY, planeY = 0, out = new THREE.Vector3()) {
    const u = clientX / Math.max(1, window.innerWidth);
    const v = clientY / Math.max(1, window.innerHeight);
    const p = new THREE.Vector3(u * 2 - 1, -(v * 2 - 1), -1).unproject(camera);
    const t = (planeY - p.y) / camera.getWorldDirection(new THREE.Vector3()).y;
    return out.copy(p).addScaledVector(camera.getWorldDirection(new THREE.Vector3()), t);
  }
  function worldToScreenUV(world, out = new THREE.Vector2()) {
    const p = world.clone().project(camera);
    out.set(p.x * 0.5 + 0.5, p.y * 0.5 + 0.5);
    return out;
  }
  function worldToSimUV(x, z, out = new THREE.Vector2()) {
    const pos = new THREE.Vector3(x, 0, z).project(camera);
    out.set(pos.x * 0.5 + 0.5, pos.y * 0.5 + 0.5);
    return out;
  }
  function insideView(x, z, pad = 0) {
    return x > -view.w / 2 + pad && x < view.w / 2 - pad && z > -view.h / 2 + pad && z < view.h / 2 - pad;
  }

  function makeEnvCube() {
    const size = 32;
    const faces = [];
    const cols = [
      ['#cdf7e8', '#66c8c1', '#0c5868'], // px
      ['#cdf7e8', '#66c8c1', '#0c5868'], // nx
      ['#eafcf4', '#b6f2e4', '#8fdfd5'], // py
      ['#0c4b61', '#0b394c', '#071f30'], // ny
      ['#bff5e7', '#6ed3cf', '#0e5367'], // pz
      ['#bff5e7', '#6ed3cf', '#0e5367'], // nz
    ];
    for (let i = 0; i < 6; i++) {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const g = c.getContext('2d');
      const gr = g.createLinearGradient(0, 0, 0, size);
      gr.addColorStop(0, cols[i][0]); gr.addColorStop(0.48, cols[i][1]); gr.addColorStop(1, cols[i][2]);
      g.fillStyle = gr; g.fillRect(0, 0, size, size);
      if (i === 2) {
        const rg = g.createRadialGradient(14, 12, 1, 16, 16, 22);
        rg.addColorStop(0, 'rgba(255,255,244,.95)'); rg.addColorStop(1, 'rgba(255,255,244,0)');
        g.fillStyle = rg; g.fillRect(0, 0, size, size);
      }
      faces.push(c);
    }
    const tex = new THREE.CubeTexture(faces);
    tex.encoding = THREE.sRGBEncoding;
    tex.needsUpdate = true;
    return tex;
  }

  // --------------------------------------------------------------- render targets / post
  let sceneRT, postRT, thicknessRT;
  let simRT_A, simRT_B, simScene, simCamera, simMaterial;
  let waterQuad, waterScene, waterCamera, fxaaQuad, fxaaScene, fxaaCamera;
  let quality = 1.0;
  let dpr = 1;
  const maxPixels = /Mobi|Android/i.test(navigator.userAgent) ? 2200000 : 3900000;

  function computeDPR() {
    let base = Math.min(window.devicePixelRatio || 1, 1.85);
    const cssPixels = view.cw * view.ch;
    if (cssPixels * base * base > maxPixels) base = Math.sqrt(maxPixels / cssPixels);
    return clamp(base * quality, 0.62, 2.0);
  }

  function makeRT(w, h, opts = {}) {
    const rt = new THREE.WebGLRenderTarget(Math.max(2, w), Math.max(2, h), Object.assign({
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat,
      type: THREE.UnsignedByteType,
      depthBuffer: false,
      stencilBuffer: false
    }, opts));
    rt.texture.generateMipmaps = false;
    return rt;
  }

  function createSim() {
    if (simRT_A) { simRT_A.dispose(); simRT_B.dispose(); }
    const size = 256;
    simRT_A = makeRT(size, size, { type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
    simRT_B = makeRT(size, size, { type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
    simRT_A.texture.wrapS = simRT_A.texture.wrapT = THREE.ClampToEdgeWrapping;
    simRT_B.texture.wrapS = simRT_B.texture.wrapT = THREE.ClampToEdgeWrapping;
    simCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    simScene = new THREE.Scene();
    simMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uState: { value: null },
        uTexel: { value: new THREE.Vector2(1 / size, 1 / size) },
        uImpulse: { value: Array.from({ length: 6 }, () => new THREE.Vector4(0, 0, 0, 0)) },
        uDamping: { value: 0.996 },
        uWave: { value: 0.33 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main(){ vUv = uv; gl_Position = vec4(position.xy,0.0,1.0); }
      `,
      fragmentShader: `
        precision highp float;
        varying vec2 vUv;
        uniform sampler2D uState;
        uniform vec2 uTexel;
        uniform vec4 uImpulse[6];
        uniform float uDamping;
        uniform float uWave;
        void main(){
          vec4 state = texture2D(uState, vUv);
          float h = state.r;
          float prev = state.g;
          float l = texture2D(uState, vUv - vec2(uTexel.x,0.0)).r;
          float r = texture2D(uState, vUv + vec2(uTexel.x,0.0)).r;
          float u = texture2D(uState, vUv + vec2(0.0,uTexel.y)).r;
          float d = texture2D(uState, vUv - vec2(0.0,uTexel.y)).r;
          float laplace = (l + r + u + d) * 0.25 - h;
          float nxt = (2.0 * h - prev + laplace * uWave) * uDamping;
          for(int i=0;i<6;i++){
            vec4 imp = uImpulse[i];
            if(imp.z > 0.0001){
              vec2 dv = vUv - imp.xy;
              float g = exp(-dot(dv,dv) / (imp.z*imp.z));
              nxt += g * imp.w;
            }
          }
          float edge = min(min(vUv.x, 1.0-vUv.x), min(vUv.y, 1.0-vUv.y));
          nxt *= mix(0.08, 1.0, smoothstep(0.0, 0.075, edge));
          nxt = clamp(nxt, -0.04, 0.04);
          gl_FragColor = vec4(nxt, h, 0.0, 1.0);
        }
      `,
      depthTest: false, depthWrite: false
    });
    const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), simMaterial);
    quad.frustumCulled = false;
    simScene.add(quad);
  }

  function createPostPipelines() {
    waterScene = new THREE.Scene();
    waterCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    waterQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
      uniforms: {
        tColor: { value: null },
        tDepth: { value: null },
        tHeight: { value: null },
        uResolution: { value: new THREE.Vector2(1, 1) },
        uTime: { value: 0 },
        uCamWorld: { value: new THREE.Matrix4() },
        uProjInv: { value: new THREE.Matrix4() },
        uViewDir: { value: new THREE.Vector3(0, -1, 0) },
        uSunDir: { value: new THREE.Vector3(-0.48, 0.78, -0.37).normalize() },
        uShoreCenter: { value: new THREE.Vector2(beach.cx, beach.cz) },
        uShoreRadius: { value: beach.r },
        uSwell: { value: 1.0 },
        uCalm: { value: 0.0 },
        uClear: { value: 0.0 },
        uRain: { value: 0.0 },
        uWhirl: { value: new THREE.Vector3(0, 0, 0) },
        uSwash: { value: 0.5 },
        uAspect: { value: 1 },
        uSimTexel: { value: new THREE.Vector2(1 / 256, 1 / 256) },
        uQuality: { value: 1 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main(){ vUv = uv; gl_Position = vec4(position.xy,0.0,1.0); }
      `,
      fragmentShader: WATER_FRAGMENT
    }));
    waterQuad.frustumCulled = false;
    waterScene.add(waterQuad);

    fxaaScene = new THREE.Scene();
    fxaaCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    fxaaQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
      uniforms: {
        tColor: { value: null },
        uResolution: { value: new THREE.Vector2(1, 1) },
        uTime: { value: 0 },
        uRain: { value: 0 }
      },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
      fragmentShader: FXAA_FRAGMENT
    }));
    fxaaQuad.frustumCulled = false;
    fxaaScene.add(fxaaQuad);
  }

  const WATER_FRAGMENT = `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D tColor, tDepth, tHeight;
    uniform vec2 uResolution, uShoreCenter, uSimTexel;
    uniform float uTime, uShoreRadius, uSwell, uCalm, uClear, uRain, uSwash, uAspect;
    uniform vec3 uWhirl;
    uniform mat4 uCamWorld, uProjInv;
    uniform vec3 uViewDir, uSunDir;

    float hash12(vec2 p){
      vec3 p3 = fract(vec3(p.xyx) * .1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }
    float hash21(vec2 p){
      return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453);
    }
    float vnoise(vec2 p){
      vec2 i=floor(p), f=fract(p);
      f=f*f*(3.0-2.0*f);
      return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x),mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x),f.y);
    }
    float fbm(vec2 p){
      float s=0.0, a=0.5;
      for(int i=0;i<4;i++){ s += a*vnoise(p); p = p*2.03 + 11.7; a*=0.5; }
      return s;
    }
    float shoreRadiusAt(vec2 p){
      vec2 d = p - uShoreCenter;
      float a = atan(d.y,d.x);
      return uShoreRadius * (1.0 + 0.046*sin(3.0*a+1.15) + 0.019*sin(7.0*a-0.65) + 0.010*sin(11.0*a+2.2));
    }
    float shoreQ(vec2 p){
      vec2 d=p-uShoreCenter;
      return length(d)-shoreRadiusAt(p);
    }
    float seaDepth(float q){
      if(q<=0.0) return 0.0;
      float d=0.315*q + 0.0068*q*q;
      if(d>11.5) d=11.5+log(1.0+d-11.5)*0.62;
      return d;
    }
    float swellHeight(vec2 p, float t){
      vec2 d=p-uShoreCenter;
      float q=length(d)-uShoreRadius;
      float ang=atan(d.y,d.x);
      float calm=mix(1.0,0.34,uCalm);
      float w1=sin(q*0.72 + t*0.93 + 0.22*sin(ang*4.0+t*0.18));
      float w2=sin(q*1.57 + t*1.37 + 1.7 + ang*3.0)*0.36;
      float w3=sin(q*3.1 - t*1.62 + 0.9)*0.09;
      float env=smoothstep(-3.5,3.0,q);
      return (w1*0.105 + w2*0.055 + w3*0.018)*calm*env*(0.8+0.2*uSwell);
    }
    float simHeight(vec2 uv){
      return texture2D(tHeight, uv).r;
    }
    vec2 hash22(vec2 p){
      float n=hash21(p);
      return vec2(n, hash21(p+n+1.7));
    }
    float caustic(vec2 p, float t){
      p = (p + vec2(t*0.045, -t*0.03)) * 1.72;
      p += vec2(sin(p.y*1.07+t*0.37), cos(p.x*0.91-t*0.31))*0.5;
      vec2 ip = floor(p), fp = fract(p);
      float d1 = 9.0, d2 = 9.0;
      for(int j=-1;j<=1;j++){
        for(int i=-1;i<=1;i++){
          vec2 g = vec2(float(i),float(j));
          float h = hash21(ip+g);
          vec2 o = vec2(h, hash21(ip+g+7.31));
          o = 0.5 + 0.44*vec2(sin(t*0.73+6.28318*o.x), cos(t*0.61+6.28318*o.y));
          vec2 r = g + o - fp;
          float dd = dot(r,r);
          if(dd < d1){ d2 = d1; d1 = dd; } else if(dd < d2){ d2 = dd; }
        }
      }
      float edge = sqrt(d2)-sqrt(d1);
      float wide = pow(clamp(1.0-edge*2.3,0.0,1.0), 5.0);
      float vein = pow(clamp(1.0-edge*8.0,0.0,1.0), 10.0);
      float flicker = 0.76 + 0.24*sin(t*1.7 + p.x*1.3 + p.y*0.9);
      float beams = smoothstep(.22,.64, fbm(p*.41 + vec2(t*.035,-t*.026)));
      return clamp((wide*0.24 + vein*0.82)*flicker*beams, 0.0, 0.68);
    }
    vec3 reconstructWorld(vec2 uv, float d){
      vec4 ndc = vec4(uv*2.0-1.0, d*2.0-1.0, 1.0);
      vec4 v = uProjInv * ndc;
      v /= v.w;
      return (uCamWorld * v).xyz;
    }
    void main(){
      vec2 uv = vUv;
      vec4 baseCol = texture2D(tColor, uv);
      vec3 base = baseCol.rgb;
      float depthRaw = texture2D(tDepth, uv).x;
      vec3 scenePos = reconstructWorld(uv, depthRaw);
      float sceneY = scenePos.y;
      float underMask = 1.0 - smoothstep(-0.015, 0.055, sceneY);
      if(underMask < 0.002){ gl_FragColor = vec4(base,1.0); return; }

      vec2 aspectFix = vec2(1.0, uResolution.x/max(1.0,uResolution.y));
      vec2 p = scenePos.xz;
      float q = shoreQ(p);
      float d = seaDepth(q);
      float shore = clamp(q/max(1.0,shoreRadiusAt(p)), -2.0, 3.0);

      // surface normal: long swell + fine simulated ripple field + capillaries
      vec2 n2 = vec2(0.0);
      vec2 simGrad = vec2(
        simHeight(uv+vec2(uSimTexel.x,0.0))-simHeight(uv-vec2(uSimTexel.x,0.0)),
        simHeight(uv+vec2(0.0,uSimTexel.y))-simHeight(uv-vec2(0.0,uSimTexel.y))
      );
      n2 += simGrad * 8.5;
      float eps=0.075;
      float hx1=swellHeight(p+vec2(eps,0.0),uTime);
      float hx0=swellHeight(p-vec2(eps,0.0),uTime);
      float hz1=swellHeight(p+vec2(0.0,eps),uTime);
      float hz0=swellHeight(p-vec2(0.0,eps),uTime);
      n2 += vec2(hx1-hx0, hz1-hz0) * 8.0;
      vec2 cap = vec2(
        fbm(p*1.7+vec2(uTime*.16,-uTime*.12))-0.5,
        fbm(p*1.7+vec2(4.3+uTime*.1,7.0-uTime*.14))-0.5
      );
      n2 += cap*0.16;
      if(uRain > 0.01){
        n2 += vec2(vnoise(uv*420.0+uTime*3.0)-0.5, vnoise(uv*435.0-uTime*2.0)-0.5)*0.045*uRain;
      }
      if(uWhirl.z > 0.01){
        vec2 wd = p-uWhirl.xy;
        float wr = length(wd);
        float infl = smoothstep(12.0,0.4,wr) * uWhirl.z;
        vec2 tang = normalize(wd+0.0001)*vec2(-1.0,1.0);
        n2 += tang*infl*0.2;
        n2 += normalize(wd+0.0001)*infl*0.07;
      }
      vec3 N = normalize(vec3(-n2.x*0.75, 1.0, -n2.y*0.75));
      if(sceneY > 0.0){ N = vec3(0.0,1.0,0.0); }

      // refraction
      float depthFactor = smoothstep(0.0, 2.2, d)*0.6 + 0.4;
      vec2 refrOff = N.xz * 0.032 * depthFactor;
      vec2 ruv = clamp(uv + refrOff, vec2(0.001), vec2(0.999));
      vec3 refr = texture2D(tColor, ruv).rgb;
      vec3 tinted = mix(base, refr, 0.68);

      // depth colour
      vec3 shallowC = vec3(0.26,0.82,0.72);
      vec3 midC = vec3(0.018,0.42,0.50);
      vec3 deepC = vec3(0.006,0.095,0.245);
      float d1 = smoothstep(0.0,2.2,d);
      float d2 = smoothstep(2.6,9.2,d);
      vec3 waterC = mix(shallowC, midC, d1);
      waterC = mix(waterC, deepC, d2);
      waterC += vec3(0.018,0.045,0.036)*pow(max(N.y,0.0),5.0);

      float clearMix = uClear*0.40;
      float objectDepth = max(0.0, -sceneY);
      float opacity = mix(0.16,0.40,smoothstep(0.0,3.2,objectDepth));
      opacity = mix(opacity,0.94,smoothstep(3.2,9.5,objectDepth));
      opacity *= (1.0 - clearMix);
      opacity = clamp(opacity,0.055,0.975);
      vec3 source = tinted * vec3(0.84,0.94,0.90);
      vec3 col = mix(source, waterC, opacity);

      // swell shading, subsurface turquoise at crests
      float waveH = swellHeight(p,uTime);
      col *= 0.91 + 0.17*smoothstep(-0.07,0.12,waveH);
      float crestBand = smoothstep(0.035,0.105,waveH) * (1.0 - smoothstep(0.12,0.19,waveH));
      col += vec3(0.055,0.165,0.14) * crestBand * (0.45 + 0.55*uSwell);
      float whiteCrest = crestBand * smoothstep(0.65,0.84, fbm(p*3.4+vec2(uTime*.055,-uTime*.04)));
      whiteCrest *= smoothstep(11.5,2.0,q) * (0.36 + 0.64*uSwell);
      col = mix(col, vec3(0.85,0.96,0.91), whiteCrest*0.24);

      // moving caustics on the bed
      float c = caustic(p*1.0 + N.xz*0.35, uTime*0.58);
      float causMask = smoothstep(0.18,1.35,d) * (1.0 - smoothstep(4.4,9.5,d));
      float caus = c * causMask;
      col += vec3(0.34,0.72,0.56) * caus * (0.13 + 0.13*uClear);
      col += vec3(0.04,0.13,0.10)*causMask*0.14;
      float simH = simHeight(uv);
      col += vec3(0.03,0.055,0.05) * smoothstep(0.002,0.03,abs(simH)) * 0.16;

      // sun glitter
      vec3 V = normalize(-uViewDir);
      vec3 H = normalize(uSunDir+V);
      vec2 jitter = vec2(
        fbm(p*9.5 + vec2(uTime*.31, 8.0))-.5,
        fbm(p*9.5 + vec2(21.0, -uTime*.27))-.5
      ) * 0.075;
      vec3 Ng = normalize(N + vec3(jitter.x, 0.0, jitter.y));
      float spec = pow(max(dot(Ng,H),0.0), 270.0) * 1.6;
      float sparkleN = fbm(p*17.0 + vec2(-uTime*0.55,uTime*0.32));
      float glit = spec * (0.15 + 0.85*smoothstep(0.52,0.73,sparkleN));
      glit *= smoothstep(0.2,1.5,d);
      col += vec3(1.0,0.90,0.65)*glit;
      // tiny twinkling glints
      vec2 gp = floor(vec2(p.x*17.0, p.y*17.0) + vec2(uTime*.38, -uTime*.21));
      float gh = hash21(gp + floor(uTime*0.8));
      col += vec3(0.92,0.97,0.82) * step(0.9975, gh) * 0.26 * smoothstep(0.4,2.2,d) * (0.25+0.75*causMask);

      // swash/foam along the shore
      float shoreFoam = 0.0;
      float ang = atan(p.y-uShoreCenter.y, p.x-uShoreCenter.x);
      float fuzz = fbm(p*6.0 + vec2(uTime*0.18,-uTime*0.27));
      float fuzz2 = fbm(p*17.0 + vec2(-uTime*0.42,uTime*0.35));
      float shoreBand = exp(-max(q,0.0)*2.25) * smoothstep(0.0,0.52,q);
      float laceA = smoothstep(0.44,0.66,fuzz*0.72+fuzz2*0.5);
      float laceB = smoothstep(0.18,0.5,fbm(p*45.0 + vec2(-uTime*.44,uTime*.31)));
      shoreFoam += shoreBand * laceA * (0.45 + 0.55*laceB) * 0.9;
      // advancing breakers
      for(int i=0;i<2;i++){
        float ci=float(i);
        float ph = fract(uTime*0.105 + ci*0.43 + ang*0.006);
        float crestQ = (1.0-ph)*9.5;
        float dist = abs(q-crestQ);
        float band = exp(-pow(dist/1.15,2.0));
        float br = smoothstep(0.48,0.7, fbm(p*2.1+vec2(uTime*.13+ci*5.0,0.0)) );
        shoreFoam += band*br*0.36*smoothstep(0.0,0.9,q)*smoothstep(7.0,2.0,crestQ);
      }
      shoreFoam *= 1.0 - smoothstep(8.0,14.0,q);
      shoreFoam *= (0.45 + 0.55*smoothstep(0.0,0.25,fbm(p*31.0+uTime*0.2)));
      shoreFoam = clamp(shoreFoam,0.0,1.0);
      col = mix(col, vec3(0.94,0.99,0.95), shoreFoam*0.86);
      col += vec3(0.05,0.08,0.055)*shoreFoam;

      // whirlpool spiral
      if(uWhirl.z > 0.01){
        vec2 wd = p-uWhirl.xy;
        float wr = length(wd);
        float wa = atan(wd.y,wd.x);
        float mask = smoothstep(11.0,1.2,wr) * uWhirl.z;
        float center = smoothstep(4.0,0.35,wr) * uWhirl.z;
        float knot = fbm(p*1.65 + vec2(uTime*.18,-uTime*.14));
        float armA = pow(0.5+0.5*sin(wa*2.0 - wr*0.82 - uTime*2.15 + knot*4.0), 8.0);
        float armB = pow(0.5+0.5*sin(wa*3.0 - wr*1.15 - uTime*2.7 + knot*6.0 + 2.0), 14.0);
        float rim = smoothstep(9.0,5.6,wr) * smoothstep(5.0,8.2,wr);
        float churn = (armA*.7 + armB*.42) * mask * (0.4 + 0.6*smoothstep(0.24,0.5,knot));
        col = mix(col, vec3(0.018,0.155,0.20), mask*.38);
        col = mix(col, vec3(0.006,0.06,0.09), center*.5);
        col += vec3(0.78,0.98,0.91)*churn*.32;
        col += vec3(0.53,0.83,0.78)*rim*.08;
        N = normalize(N + vec3(-wd.y,0.0,wd.x)*mask*0.16 + vec3(normalize(wd+0.0001),0.0)*center*0.03);
      }

      // rain haze + subtle screen glints
      if(uRain > 0.01){
        float rv = fbm(uv*vec2(24.0,10.0)+vec2(uTime*.02,uTime*.8));
        col += vec3(0.055,0.08,0.075)*uRain*(rv-0.3);
      }

      // vignette and gentle colour shape
      vec2 vuv = uv-0.5;
      float vig = smoothstep(0.86,0.22,length(vuv*vec2(0.92,0.72)));
      col *= mix(0.9,1.03,vig);
      col = mix(col, col*vec3(0.96,1.02,0.98), 0.35);
      gl_FragColor = vec4(mix(base,col,underMask), 1.0);
    }
  `;

  const FXAA_FRAGMENT = `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D tColor;
    uniform vec2 uResolution;
    uniform float uTime, uRain;
    float luma(vec3 c){ return dot(c, vec3(0.299,0.587,0.114)); }
    float hash(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
    float rainStreak(vec2 uv, float t, float seed){
      float aspect = uResolution.x/max(1.0,uResolution.y);
      // Work in a screen-down coordinate so the streaks visibly travel downward
      // and lean in the direction of the wind.
      float screenDown = 1.0 - uv.y;
      vec2 p = vec2(uv.x*aspect*58.0 - screenDown*10.0, screenDown*19.0 - t*14.0);
      vec2 id = floor(p + seed*19.0);
      vec2 f = fract(p + seed*19.0);
      float h = hash(id);
      if(h < 0.61) return 0.0;
      float xPos = 0.14 + 0.72*hash(id+8.2);
      float line = smoothstep(0.060,0.0,abs(f.x-xPos));
      float tail = smoothstep(0.66,0.10,abs(f.y-0.5)) * (0.42+0.58*hash(id+3.1));
      return line*tail;
    }
    void main(){
      vec2 rcp = 1.0/uResolution;
      vec3 m = texture2D(tColor,vUv).rgb;
      vec3 nw = texture2D(tColor,vUv+vec2(-1.0,-1.0)*rcp).rgb;
      vec3 ne = texture2D(tColor,vUv+vec2( 1.0,-1.0)*rcp).rgb;
      vec3 sw = texture2D(tColor,vUv+vec2(-1.0, 1.0)*rcp).rgb;
      vec3 se = texture2D(tColor,vUv+vec2( 1.0, 1.0)*rcp).rgb;
      float lm=luma(m), l1=luma(nw), l2=luma(ne), l3=luma(sw), l4=luma(se);
      float lmin=min(lm,min(min(l1,l2),min(l3,l4)));
      float lmax=max(lm,max(max(l1,l2),max(l3,l4)));
      vec3 col = m;
      if(lmax-lmin > 0.055){
        vec2 dir = normalize(vec2(-(l1+l2)+(l3+l4), (l1+l3)-(l2+l4)) + 0.0001);
        vec3 a = texture2D(tColor,vUv+dir*rcp*0.72).rgb;
        vec3 b = texture2D(tColor,vUv-dir*rcp*0.72).rgb;
        col = mix(m,(a+b)*0.5,0.42);
      }
      col = mix(col, col*vec3(.88,.93,.96) + vec3(.012,.018,.02), uRain*.42);
      if(uRain > .01){
        float streak = rainStreak(vUv,uTime,1.0)*1.0 + rainStreak(vUv+vec2(.17,-.11),uTime*.91,5.3)*0.72;
        col += vec3(.74,.87,.85)*streak*uRain*.50;
        col *= 1.0 - uRain*.035;
        float spark = step(.997, hash(floor(vUv*uResolution*.28)+floor(uTime*12.0)));
        col += vec3(.8,.9,.84)*spark*uRain*.07;
      }
      float grain = hash(vUv*uResolution + floor(uTime*18.0))-0.5;
      col += grain*0.012;
      // a restrained vibrance pass: tropical water should keep its colour
      float lum = luma(col);
      col = mix(vec3(lum), col, 1.12);
      col = clamp((col - 0.46) * 1.035 + 0.46, 0.0, 1.0);
      vec2 vv=vUv-0.5;
      col *= 1.0 - dot(vv,vv)*0.13;
      gl_FragColor = vec4(col,1.0);
    }
  `;

  function resizeRenderTargets() {
    const w = Math.max(2, Math.floor(view.cw * dpr));
    const h = Math.max(2, Math.floor(view.ch * dpr));
    renderer.setPixelRatio(dpr);
    renderer.setSize(view.cw, view.ch, false);
    if (sceneRT) { sceneRT.dispose(); sceneRT = null; }
    if (postRT) { postRT.dispose(); postRT = null; }
    if (thicknessRT) { thicknessRT.dispose(); thicknessRT = null; }
    sceneRT = new THREE.WebGLRenderTarget(w, h, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat, type: THREE.UnsignedByteType,
      depthBuffer: true, stencilBuffer: false
    });
    sceneRT.texture.generateMipmaps = false;
    sceneRT.texture.encoding = THREE.sRGBEncoding;
    const depthTex = new THREE.DepthTexture(w, h);
    depthTex.type = THREE.UnsignedIntType;
    depthTex.minFilter = THREE.NearestFilter;
    depthTex.magFilter = THREE.NearestFilter;
    sceneRT.depthTexture = depthTex;
    postRT = new THREE.WebGLRenderTarget(w, h, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat, type: THREE.UnsignedByteType,
      depthBuffer: false, stencilBuffer: false
    });
    postRT.texture.generateMipmaps = false;
    if (waterQuad) {
      waterQuad.material.uniforms.tColor.value = sceneRT.texture;
      waterQuad.material.uniforms.tDepth.value = sceneRT.depthTexture;
      if (simRT_A) waterQuad.material.uniforms.tHeight.value = simRT_A.texture;
      waterQuad.material.uniforms.uResolution.value.set(w, h);
    }
    if (fxaaQuad) {
      fxaaQuad.material.uniforms.tColor.value = postRT.texture;
      fxaaQuad.material.uniforms.uResolution.value.set(w, h);
    }
    if (fx && fx.setPixelScale) fx.setPixelScale(h / Math.max(0.01, camera.top - camera.bottom));
    if (typeof overlayDrips !== 'undefined' && overlayDrips) overlayDrips.setPixelScale(h / Math.max(0.01, camera.top - camera.bottom));
  }

  function setQuality(q) {
    quality = clamp(q, 0.55, 1.25);
    dpr = computeDPR();
    resizeRenderTargets();
  }

  function initPipeline() {
    dpr = computeDPR();
    createSim();
    createPostPipelines();
    resizeRenderTargets();
    waterQuad.material.uniforms.tHeight.value = simRT_A.texture;
  }

  // --------------------------------------------------------------- terrain construction
  let terrain = null, palm = null, staticGroup = null, reefData = null;
  let terrainUniforms = null;
  let palmSway = null, palmCrown = null, palmFronds = [];
  let grassMaterial = null;
  let sceneTimeUniform = { value: 0 };
  let bakedCanvas = null, bakedTexture = null, bakedBumpTexture = null;

  function makeCanvas(w, h) {
    const c = document.createElement('canvas');
    c.width = Math.max(2, Math.round(w)); c.height = Math.max(2, Math.round(h));
    return c;
  }

  function generateLayout() {
    seed = 0x0CEA4F1;
    const data = { corals: [], rocks: [], urchins: [], stars: [], shells: [], grass: [], rubble: [], seaProps: [] };
    const taken = [];
    function spotOK(x, z, minDist) {
      if (!insideView(x, z, 0.6)) return false;
      for (let i = 0; i < taken.length; i++) {
        const dx = taken[i].x - x, dz = taken[i].z - z;
        if (dx * dx + dz * dz < minDist * minDist) return false;
      }
      return true;
    }
    function sampleWater(qMin, qMax, pad = 0, minDist = 1.1) {
      for (let k = 0; k < 90; k++) {
        const u = sr(0.055, 0.955), v = sr(0.075, 0.72);
        const p = stageWorld(u, v);
        const q = shoreQ(p.x, p.z);
        if (q < qMin || q > qMax) continue;
        if (pad && !insideView(p.x, p.z, pad)) continue;
        if (!spotOK(p.x, p.z, minDist)) continue;
        taken.push({ x: p.x, z: p.z });
        return p;
      }
      return null;
    }
    // Reef architecture: clusters of coral, boulder and rubble in the clear shallows.
    for (let i = 0; i < 12; i++) {
      const p = sampleWater(i < 4 ? 1.2 : 2.1, i < 4 ? 5.6 : 11.5, 1.0, i < 4 ? 1.4 : 2.1);
      if (!p) continue;
      const type = i % 4;
      data.corals.push({ x: p.x, z: p.z, r: sr(0.45, type === 0 ? 1.55 : 1.05), type, tone: sr(0, 1), rot: sr(0, TAU) });
    }
    for (let i = 0; i < 9; i++) {
      const p = sampleWater(0.7, 10.5, 0.8, 1.3);
      if (!p) continue;
      data.rocks.push({ x: p.x, z: p.z, r: sr(0.38, 1.35), rot: sr(0, TAU), tone: sr(0, 1) });
    }
    for (let i = 0; i < 12; i++) {
      const p = sampleWater(2.8, 17, 1.0, 3.0);
      if (!p) continue;
      data.grass.push({ x: p.x, z: p.z, r: sr(1.4, 4.3), amount: Math.round(sr(120, 330)), tone: sr(0, 1) });
    }
    for (let i = 0; i < 8; i++) {
      const p = sampleWater(2.2, 12, 0.8, 1.2);
      if (!p) continue;
      data.stars.push({ x: p.x, z: p.z, r: sr(0.24, 0.52), rot: sr(0, TAU), tone: sr(0, 1) });
    }
    for (let i = 0; i < 20; i++) {
      const p = sampleWater(0.8, 14, 0.6, 0.55);
      if (!p) continue;
      data.shells.push({ x: p.x, z: p.z, r: sr(0.12, 0.34), rot: sr(0, TAU), tone: sr(0, 1) });
    }
    for (let i = 0; i < 6; i++) {
      const p = sampleWater(2.3, 10, 0.8, 1.4);
      if (!p) continue;
      data.urchins.push({ x: p.x, z: p.z, r: sr(0.20, 0.36), rot: sr(0, TAU), tone: sr(0, 1) });
    }
    for (let i = 0; i < 100; i++) {
      const p = sampleWater(0.3, 20, 0.4, 0.18);
      if (!p) continue;
      data.rubble.push({ x: p.x, z: p.z, r: sr(0.04, 0.23), rot: sr(0, TAU), tone: sr(0, 1) });
    }
    // A couple of dry-beach details and a warm sun-bleached shell line.
    const dryStar = stageWorld(0.145, 0.175);
    data.stars.push({ x: dryStar.x, z: dryStar.z, r: 0.38, rot: sr(0, TAU), tone: 0.12, dry: true });
    for (let i = 0; i < 9; i++) {
      const u = sr(0.04, 0.25), v = sr(0.03, 0.24);
      const p = stageWorld(u, v);
      if (shoreQ(p.x, p.z) < -0.55) {
        data.shells.push({ x: p.x, z: p.z, r: sr(0.10, 0.24), rot: sr(0, TAU), tone: sr(0, 1), dry: true });
      }
    }
    return data;
  }

  function buildTerrainCanvas() {
    const worldW = GROUND.maxX - GROUND.minX;
    const worldH = GROUND.maxZ - GROUND.minZ;
    const scale = Math.min(2048 / worldW, 2048 / worldH, 50);
    const W = Math.max(900, Math.round(worldW * scale));
    const H = Math.max(700, Math.round(worldH * scale));
    const canvas = makeCanvas(W, H);
    const ctx = canvas.getContext('2d', { alpha: false });
    const px = (x) => (x - GROUND.minX) / worldW * W;
    const pz = (z) => (z - GROUND.minZ) / worldH * H;
    const unit = Math.min(W / worldW, H / worldH);
    const cx = px(beach.cx), cz = pz(beach.cz);
    const rpx = beach.r * unit;
    const data = reefData;

    ctx.fillStyle = '#c5ae7c';
    ctx.fillRect(0, 0, W, H);

    // broad tonal pools: clear sand, olive seagrass beds, warm dry dune
    for (let i = 0; i < 54; i++) {
      const x = (sr(0.06, 0.96)) * W;
      const y = (sr(0.02, 0.95)) * H;
      const rr = sr(0.025, 0.13) * W;
      const g = ctx.createRadialGradient(x, y, 0, x, y, rr);
      if (srand() < 0.52) {
        g.addColorStop(0, 'rgba(80,102,66,0.24)');
        g.addColorStop(0.6, 'rgba(113,118,81,0.10)');
        g.addColorStop(1, 'rgba(135,139,98,0)');
      } else {
        g.addColorStop(0, 'rgba(255,247,216,0.16)');
        g.addColorStop(1, 'rgba(255,247,216,0)');
      }
      ctx.fillStyle = g;
      ctx.fillRect(x - rr, y - rr, rr * 2, rr * 2);
    }

    // fine grain — a repeated, soft noise tile keeps the sand from feeling painted
    const noise = makeCanvas(220, 220);
    const nctx = noise.getContext('2d');
    const nd = nctx.createImageData(220, 220);
    for (let i = 0; i < nd.data.length; i += 4) {
      const n = 128 + ((Math.random() - 0.5) * 48);
      nd.data[i] = nd.data[i + 1] = nd.data[i + 2] = n;
      nd.data[i + 3] = 38;
    }
    nctx.putImageData(nd, 0, 0);
    ctx.save();
    ctx.globalAlpha = 0.32;
    ctx.globalCompositeOperation = 'soft-light';
    ctx.fillStyle = ctx.createPattern(noise, 'repeat');
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    function landPath() {
      ctx.beginPath();
      ctx.arc(cx, cz, rpx * 1.012, 0, TAU);
    }
    function waterClip() {
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, W, H);
      ctx.arc(cx, cz, rpx * 1.012, 0, TAU, false);
      ctx.clip('evenodd');
    }

    // ---- water half of the seabed -----------------------------------------
    waterClip();

    // shallow lagoon glow just off the sand
    {
      const g = ctx.createRadialGradient(cx, cz, rpx * 0.92, cx, cz, rpx * 2.35);
      g.addColorStop(0, 'rgba(227,240,207,0.33)');
      g.addColorStop(0.25, 'rgba(191,213,176,0.12)');
      g.addColorStop(1, 'rgba(71,105,95,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    // radial ripples on the sand, drawn as paired light and shadow curves
    const maxRad = Math.hypot(Math.max(cx, W - cx), Math.max(cz, H - cz)) + 2;
    for (let ring = 0; ring < 56; ring++) {
      const offset = 0.65 + ring * 0.47 + sr(-0.08, 0.08);
      const shade = 0.055 + 0.03 * Math.sin(ring * 1.3);
      const wobA = sr(2.4, 5.6), wobB = sr(0.018, 0.05), phase = sr(0, TAU);
      for (let side = 0; side < 2; side++) {
        ctx.beginPath();
        let first = true;
        for (let a = 0; a <= TAU + 0.02; a += 0.043) {
          const R = shoreRadiusAt(beach.cx + Math.cos(a) * (beach.r + offset), beach.cz + Math.sin(a) * (beach.r + offset));
          const rr = R + offset + Math.sin(a * wobA + phase) * (0.07 + offset * wobB);
          const xx = px(beach.cx + Math.cos(a) * rr);
          const yy = pz(beach.cz + Math.sin(a) * rr);
          if (first) { ctx.moveTo(xx, yy); first = false; } else ctx.lineTo(xx, yy);
        }
        ctx.strokeStyle = side ? `rgba(84,78,57,${shade})` : `rgba(255,247,216,${shade * 1.25})`;
        ctx.lineWidth = side ? Math.max(0.7, unit * 0.026) : Math.max(1.0, unit * 0.036);
        ctx.stroke();
      }
    }

    // sandbar streaks and tide-combed darker ribbons
    ctx.lineCap = 'round';
    for (let i = 0; i < 30; i++) {
      const q = sr(1, 16);
      const a0 = sr(-0.2, Math.PI * 0.9);
      const span = sr(0.15, 0.7);
      const rad = beach.r + q;
      ctx.beginPath();
      for (let k = 0; k <= 22; k++) {
        const a = a0 + span * (k / 22);
        const rr = rad + Math.sin(a * 8 + i) * 0.28;
        const x = px(beach.cx + Math.cos(a) * rr);
        const y = pz(beach.cz + Math.sin(a) * rr);
        if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = i % 2 ? 'rgba(92,107,78,0.06)' : 'rgba(244,234,194,0.10)';
      ctx.lineWidth = sr(1, 5);
      ctx.stroke();
    }

    // seagrass meadows, painted as dense blades with a soft darker root mat
    data.grass.forEach((patch, pi) => {
      const pxg = px(patch.x), pzg = pz(patch.z), rr = patch.r * unit;
      const g = ctx.createRadialGradient(pxg, pzg, 0, pxg, pzg, rr * 1.15);
      g.addColorStop(0, 'rgba(38,77,50,0.52)');
      g.addColorStop(0.6, 'rgba(47,84,51,0.30)');
      g.addColorStop(1, 'rgba(56,92,53,0)');
      ctx.fillStyle = g;
      ctx.fillRect(pxg - rr * 1.2, pzg - rr * 1.2, rr * 2.4, rr * 2.4);
      for (let i = 0; i < patch.amount; i++) {
        const ang = sr(0, TAU), rad = Math.pow(srand(), 0.58) * rr;
        const x = pxg + Math.cos(ang) * rad;
        const y = pzg + Math.sin(ang) * rad * 0.72;
        const hgt = sr(3, 13) * (unit / 46);
        const bend = sr(-7, 7);
        const green = 45 + Math.round(sr(0, 60));
        const alpha = sr(0.30, 0.72);
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.quadraticCurveTo(x + bend * 0.4, y - hgt * 0.55, x + bend, y - hgt);
        ctx.strokeStyle = `rgba(${23 + (green >> 2)},${green + 20},${32 + (green >> 2)},${alpha})`;
        ctx.lineWidth = sr(0.65, 1.9) * (unit / 46);
        ctx.stroke();
      }
      // a few olive algae mats
      for (let i = 0; i < 9; i++) {
        const a = sr(0, TAU), r = sr(0.1, 0.95) * rr;
        const x = pxg + Math.cos(a) * r, y = pzg + Math.sin(a) * r * 0.8;
        ctx.beginPath();
        ctx.ellipse(x, y, sr(2, 12) * unit / 46, sr(1, 5) * unit / 46, sr(0, TAU), 0, TAU);
        ctx.fillStyle = 'rgba(54,84,45,0.16)';
        ctx.fill();
      }
    });

    // coral rubble strewn across the reef flat
    data.rubble.forEach((r) => {
      const x = px(r.x), y = pz(r.z), s = r.r * unit;
      const col = r.tone < 0.3 ? 'rgba(151,121,99,.66)' : r.tone < 0.62 ? 'rgba(104,112,92,.58)' : 'rgba(203,162,132,.63)';
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.ellipse(x, y, s * sr(0.7, 1.6), s * sr(0.4, 0.9), r.rot, 0, TAU);
      ctx.fill();
      if (r.tone > 0.7) {
        ctx.strokeStyle = 'rgba(244,223,191,.38)';
        ctx.lineWidth = Math.max(0.5, s * 0.15);
        ctx.beginPath(); ctx.moveTo(x - s, y + s * 0.2); ctx.lineTo(x + s, y - s * 0.15); ctx.stroke();
      }
    });
    // small coral fragments, branching upward from the seabed
    for (let i = 0; i < 34; i++) {
      const p = stageWorld(sr(0.1, 0.9), sr(0.12, 0.8));
      if (shoreQ(p.x, p.z) < 1) continue;
      const x = px(p.x), y = pz(p.z), s = sr(2, 7) * unit / 46;
      ctx.strokeStyle = i % 3 ? 'rgba(178,132,105,.48)' : 'rgba(215,175,142,.45)';
      ctx.lineWidth = Math.max(0.7, s * 0.42);
      ctx.beginPath();
      ctx.moveTo(x, y + s);
      ctx.lineTo(x - s * 0.3, y - s * 0.2);
      ctx.lineTo(x - s * 1.2, y - s * 0.9);
      ctx.moveTo(x - s * 0.3, y - s * 0.1);
      ctx.lineTo(x + s * 0.7, y - s * 1.2);
      ctx.stroke();
    }

    // baked contact shadows beneath the 3-D reef pieces
    function contact(pxx, pzz, rx, rz, alpha) {
      const g = ctx.createRadialGradient(pxx, pzz, 0, pxx, pzz, Math.max(rx, rz));
      g.addColorStop(0, `rgba(35,53,46,${alpha})`);
      g.addColorStop(0.55, `rgba(35,53,46,${alpha * 0.54})`);
      g.addColorStop(1, 'rgba(35,53,46,0)');
      ctx.save();
      ctx.translate(pxx, pzz);
      ctx.scale(1, rz / Math.max(0.001, rx));
      ctx.translate(-pxx, -pzz);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(pxx, pzz, Math.max(rx, rz), 0, TAU); ctx.fill();
      ctx.restore();
    }
    data.rocks.forEach((r) => contact(px(r.x) + unit * 0.1, pz(r.z) + unit * 0.14, r.r * unit * 1.7, r.r * unit * 1.1, 0.26));
    data.corals.forEach((c) => contact(px(c.x) + unit * 0.1, pz(c.z) + unit * 0.13, c.r * unit * 1.55, c.r * unit, 0.23));
    data.urchins.forEach((u) => contact(px(u.x), pz(u.z), u.r * unit * 2.4, u.r * unit * 1.5, 0.18));

    // starfish, shells, urchins painted with enough detail to read from above
    function drawStar(x, y, s, rot, dry) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
      const colors = dry ? ['#a6775e', '#c28a6b'] : (srand() < 0.45 ? ['#b55848', '#e18965'] : ['#b57245', '#e4a16e']);
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 1.3);
      grad.addColorStop(0, colors[1]); grad.addColorStop(1, colors[0]);
      ctx.fillStyle = grad;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5;
        const rr = i % 2 === 0 ? s * 1.25 : s * 0.42;
        const xx = Math.cos(a) * rr, yy = Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,226,181,.55)';
      for (let i = 0; i < 16; i++) {
        const a = sr(0, TAU), rr = sr(0.15, 0.9) * s;
        ctx.beginPath(); ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, Math.max(0.55, s * 0.035), 0, TAU); ctx.fill();
      }
      ctx.restore();
    }
    data.stars.forEach((s) => drawStar(px(s.x), pz(s.z), s.r * unit, s.rot, s.dry));

    function drawShell(x, y, s, rot) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
      const grd = ctx.createLinearGradient(0, -s, 0, s * 0.5);
      grd.addColorStop(0, 'rgba(250,238,211,.93)');
      grd.addColorStop(1, 'rgba(196,160,126,.85)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(0, s * 0.25);
      ctx.quadraticCurveTo(-s * 1.15, -s * 0.8, 0, -s * 1.1);
      ctx.quadraticCurveTo(s * 1.15, -s * 0.8, 0, s * 0.25);
      ctx.fill();
      ctx.strokeStyle = 'rgba(142,105,84,.4)';
      ctx.lineWidth = Math.max(0.5, s * 0.07);
      for (let i = 1; i < 7; i++) {
        const f = i / 7;
        ctx.beginPath(); ctx.moveTo(0, s * 0.2);
        ctx.quadraticCurveTo(-s * 0.2 + s * 0.8 * f, -s * 0.6, -s * 0.9 + s * 1.8 * f, -s * 0.7);
        ctx.stroke();
      }
      ctx.restore();
    }
    data.shells.forEach((s) => drawShell(px(s.x), pz(s.z), s.r * unit, s.rot));

    function drawUrchin(x, y, s, rot) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
      ctx.strokeStyle = 'rgba(37,41,38,.66)';
      ctx.lineWidth = Math.max(0.55, s * 0.022);
      for (let i = 0; i < 34; i++) {
        const a = i / 34 * TAU + sr(-0.08, 0.08);
        ctx.beginPath(); ctx.moveTo(Math.cos(a) * s * 0.25, Math.sin(a) * s * 0.25);
        ctx.lineTo(Math.cos(a) * s * sr(0.8, 1.2), Math.sin(a) * s * sr(0.8, 1.2)); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(54,46,42,.9)';
      ctx.beginPath(); ctx.arc(0, 0, s * 0.3, 0, TAU); ctx.fill();
      ctx.restore();
    }
    data.urchins.forEach((u) => drawUrchin(px(u.x), pz(u.z), u.r * unit * 3.5, u.rot));

    // occasional larger shell beds, dimpled sand and fish-grazing halos
    for (let i = 0; i < 120; i++) {
      const p = stageWorld(sr(0.06, 0.94), sr(0.09, 0.85));
      if (shoreQ(p.x, p.z) < 0.8) continue;
      const x = px(p.x), y = pz(p.z);
      ctx.beginPath(); ctx.arc(x, y, sr(0.6, 3.8) * unit / 46, 0, TAU);
      ctx.fillStyle = sr(0, 1) < 0.5 ? 'rgba(96,101,71,.09)' : 'rgba(255,245,209,.09)';
      ctx.fill();
    }
    ctx.restore(); // water clip

    // ---- dry beach ---------------------------------------------------------
    ctx.save();
    landPath();
    ctx.clip();
    const landGrad = ctx.createRadialGradient(cx, cz, rpx * 0.2, cx, cz, rpx * 1.1);
    landGrad.addColorStop(0, 'rgba(246,231,192,.34)');
    landGrad.addColorStop(0.72, 'rgba(219,196,148,.22)');
    landGrad.addColorStop(1, 'rgba(172,146,108,.18)');
    ctx.fillStyle = landGrad;
    ctx.fillRect(0, 0, W, H);
    // wind-combed dry ripples
    for (let i = 0; i < 34; i++) {
      const y0 = cz + sr(-rpx * 1.05, rpx * 1.05);
      const len = sr(rpx * 0.18, rpx * 0.85);
      const x0 = cx + sr(-rpx, rpx * 0.9);
      ctx.beginPath();
      for (let k = 0; k <= 10; k++) {
        const xx = x0 + len * k / 10;
        const yy = y0 + Math.sin(k * 0.85 + i) * unit * 0.13;
        if (k === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
      }
      ctx.strokeStyle = i % 2 ? 'rgba(167,148,109,.1)' : 'rgba(255,249,222,.15)';
      ctx.lineWidth = sr(1, 2.2);
      ctx.stroke();
    }
    // dry shells and a star orange enough to spot
    data.shells.forEach((s) => { if (s.dry) drawShell(px(s.x), pz(s.z), s.r * unit, s.rot); });
    data.stars.forEach((s) => { if (s.dry) drawStar(px(s.x), pz(s.z), s.r * unit, s.rot, true); });
    // scattered dry seaweed strands at the tide line
    for (let i = 0; i < 20; i++) {
      const a = sr(0.05, Math.PI * 0.58);
      const rr = beach.r + sr(-1.1, 0.25);
      const x = px(beach.cx + Math.cos(a) * rr), y = pz(beach.cz + Math.sin(a) * rr);
      ctx.strokeStyle = i % 2 ? 'rgba(119,115,73,.22)' : 'rgba(69,81,57,.18)';
      ctx.lineWidth = sr(0.5, 1.3);
      for (let k = 0; k < 3; k++) {
        ctx.beginPath(); ctx.moveTo(x, y);
        ctx.quadraticCurveTo(x + sr(-8, 8), y + sr(-8, 6), x + sr(-12, 12), y + sr(-6, 12)); ctx.stroke();
      }
    }
    ctx.restore();

    // last warm light wash and a little fine grain over everything
    {
      const g = ctx.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, 'rgba(255,246,208,.12)');
      g.addColorStop(0.45, 'rgba(255,255,255,0)');
      g.addColorStop(1, 'rgba(47,91,86,.06)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    for (let i = 0; i < 20000; i++) {
      const x = sr(0, W), y = sr(0, H);
      ctx.fillStyle = srand() < 0.45 ? 'rgba(83,75,54,.11)' : 'rgba(255,249,220,.13)';
      ctx.fillRect(x, y, sr(0.5, 1.5), sr(0.5, 1.5));
    }

    return { canvas, W, H, unit, px, pz };
  }

  function buildTerrainBump(W, H) {
    const canvas = makeCanvas(W, H);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, W, H);
    const worldW = GROUND.maxX - GROUND.minX, worldH = GROUND.maxZ - GROUND.minZ;
    const cx = (beach.cx - GROUND.minX) / worldW * W;
    const cz = (beach.cz - GROUND.minZ) / worldH * H;
    const unit = Math.min(W / worldW, H / worldH);
    const rpx = beach.r * unit;
    // gentle ripples; not a normal map, but bump gives the low sun something to catch
    for (let ring = 0; ring < 26; ring++) {
      const off = 0.65 + ring * 0.94;
      for (let side = 0; side < 2; side++) {
        ctx.beginPath();
        for (let a = 0; a <= TAU + 0.02; a += 0.06) {
          const rr = beach.r + off + Math.sin(a * 4.4 + ring) * 0.14;
          const x = cx + Math.cos(a) * (rr * unit);
          const y = cz + Math.sin(a) * (rr * unit * (worldH / worldW));
          if (a === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = side ? 'rgba(70,70,70,.28)' : 'rgba(190,190,190,.26)';
        ctx.lineWidth = Math.max(1, unit * 0.055);
        ctx.stroke();
      }
    }
    // soft irregular grain
    const id = ctx.getImageData(0, 0, W, H);
    for (let i = 0; i < id.data.length; i += 4) {
      const n = (Math.random() - 0.5) * 12;
      id.data[i] += n; id.data[i + 1] += n; id.data[i + 2] += n;
    }
    ctx.putImageData(id, 0, 0);
    return canvas;
  }

  function disposeGroup(group) {
    if (!group) return;
    group.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach((m) => {
          ['map', 'bumpMap', 'normalMap', 'roughnessMap', 'alphaMap', 'emissiveMap'].forEach((key) => {
            if (m[key] && m[key].dispose) m[key].dispose();
          });
          m.dispose();
        });
      }
    });
    while (group.children.length) group.remove(group.children[0]);
  }

  function makeTerrainMaterial(map, bump) {
    const mat = new THREE.MeshStandardMaterial({
      map,
      bumpMap: bump,
      bumpScale: 0.07,
      color: 0xffffff,
      roughness: 0.9,
      metalness: 0.0,
      envMapIntensity: 0.55
    });
    mat.receiveShadow = true;
    terrainUniforms = {
      uTime: { value: 0 },
      uSwashReach: { value: 0.9 },
      uWetReach: { value: 2.3 },
      uShoreCenter: { value: new THREE.Vector2(beach.cx, beach.cz) },
      uShoreRadius: { value: beach.r },
      uRain: { value: 0 }
    };
    mat.onBeforeCompile = (shader) => {
      Object.assign(shader.uniforms, terrainUniforms);
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vOceanWorld;')
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nvOceanWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;');
      shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>', `
          #include <common>
          varying vec3 vOceanWorld;
          uniform float uTime, uSwashReach, uWetReach, uRain, uShoreRadius;
          uniform vec2 uShoreCenter;
          float ohash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
          float onoise(vec2 p){
            vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
            return mix(mix(ohash(i),ohash(i+vec2(1,0)),f.x), mix(ohash(i+vec2(0,1)),ohash(i+vec2(1,1)),f.x), f.y);
          }
          float ofbm(vec2 p){
            float s=0.0, a=0.5;
            for(int i=0;i<4;i++){ s+=a*onoise(p); p=p*2.07+13.1; a*=0.5; }
            return s;
          }
          float oshoreRadius(vec2 p){
            vec2 d = p-uShoreCenter;
            float a = atan(d.y,d.x);
            return uShoreRadius*(1.0+0.046*sin(3.0*a+1.15)+0.019*sin(7.0*a-0.65)+0.010*sin(11.0*a+2.2));
          }
          float oshoreQ(vec2 p){ vec2 d=p-uShoreCenter; return length(d)-oshoreRadius(p); }
        `)
        .replace('#include <map_fragment>', `
          #include <map_fragment>
          float oq = oshoreQ(vOceanWorld.xz);
          float oang = atan(vOceanWorld.z-uShoreCenter.y, vOceanWorld.x-uShoreCenter.x);
          float oreach = uSwashReach * (0.76 + 0.24*sin(oang*6.0 - uTime*0.34));
          float ofuzz = ofbm(vOceanWorld.xz*6.2+vec2(uTime*0.30,-uTime*0.22));
          float ofuzz2 = ofbm(vOceanWorld.xz*22.0+vec2(-uTime*0.52,uTime*0.39));
          float ofuzz3 = ofbm(vOceanWorld.xz*48.0+vec2(uTime*0.44,-uTime*0.31));
          float oedgeLine = -oreach + (ofuzz-.5)*0.62 + (ofuzz2-.5)*0.2;
          float owetBase = smoothstep(-max(uWetReach,0.75), -0.06, oq) * (1.0-smoothstep(0.01,0.11,oq));
          float ofilm = smoothstep(oedgeLine-0.34, oedgeLine+0.13, oq) * (1.0-smoothstep(-0.01,0.10,oq));
          float owet = max(owetBase*0.94, ofilm);
          float olace = smoothstep(0.34,0.68, ofuzz*0.45+ofuzz2*0.45+ofuzz3*0.26);
          float oband = 1.0 - smoothstep(0.04,0.78,abs(oq-oedgeLine));
          float ofoam = oband * (0.30 + 0.92*olace) * smoothstep(-0.02,0.12,-oedgeLine);
          ofoam += smoothstep(0.56,0.78,ofuzz2) * smoothstep(-max(uWetReach,0.75)*0.55,-0.03,oq) * (1.0-smoothstep(0.0,0.16,oq)) * 0.56;
          ofoam += pow(olace,3.0) * smoothstep(-0.03,0.08,oq+oreach) * (1.0-smoothstep(0.05,0.7,oq+oreach))*.34;
          ofoam *= 1.0-smoothstep(-0.025,0.1,oq);
          ofoam = clamp(ofoam,0.0,1.0);
          float owetDark = clamp(owet,0.0,1.0);
          diffuseColor.rgb *= mix(vec3(1.0),vec3(0.54,0.60,0.54),owetDark*0.9);
          diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.19,0.37,0.33), ofilm*0.24);
          diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.955,0.985,0.925), ofoam*0.97);
          diffuseColor.rgb += vec3(0.018,0.023,0.018)*owetDark;
        `)
        .replace('#include <roughnessmap_fragment>', `
          #include <roughnessmap_fragment>
          roughnessFactor = mix(roughnessFactor, 0.055, clamp(owet,0.0,1.0)*0.96);
          roughnessFactor = mix(roughnessFactor, 0.68, ofoam*0.85);
        `)
        .replace('#include <emissivemap_fragment>', `
          #include <emissivemap_fragment>
          totalEmissiveRadiance += vec3(0.06,0.068,0.054)*ofoam;
          totalEmissiveRadiance += vec3(0.015,0.018,0.012)*owet;
        `);
    };
    mat.customProgramCacheKey = () => 'ocean-terrain-v2';
    return mat;
  }

  function buildTerrain() {
    const worldW = GROUND.maxX - GROUND.minX;
    const worldH = GROUND.maxZ - GROUND.minZ;
    const segX = clamp(Math.round(worldW * 3.3), 100, 248);
    const segZ = clamp(Math.round(worldH * 3.3), 90, 248);
    const positions = new Float32Array((segX + 1) * (segZ + 1) * 3);
    const uvs = new Float32Array((segX + 1) * (segZ + 1) * 2);
    let p = 0, u = 0;
    for (let iz = 0; iz <= segZ; iz++) {
      const z = GROUND.minZ + (iz / segZ) * worldH;
      for (let ix = 0; ix <= segX; ix++) {
        const x = GROUND.minX + (ix / segX) * worldW;
        positions[p++] = x;
        positions[p++] = terrainHeight(x, z);
        positions[p++] = z;
        uvs[u++] = ix / segX;
        uvs[u++] = iz / segZ;
      }
    }
    const indices = [];
    for (let iz = 0; iz < segZ; iz++) {
      for (let ix = 0; ix < segX; ix++) {
        const a = iz * (segX + 1) + ix;
        const b = a + 1;
        const c = a + segX + 1;
        const d = c + 1;
        indices.push(a, c, b, b, c, d);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    geo.computeVertexNormals();

    const baked = buildTerrainCanvas();
    bakedCanvas = baked.canvas;
    const tex = new THREE.CanvasTexture(baked.canvas);
    tex.flipY = false;
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    tex.needsUpdate = true;
    bakedTexture = tex;

    const bumpCanvas = buildTerrainBump(baked.W, baked.H);
    const bump = new THREE.CanvasTexture(bumpCanvas);
    bump.flipY = false;
    bump.wrapS = bump.wrapT = THREE.ClampToEdgeWrapping;
    bump.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
    bump.needsUpdate = true;
    bakedBumpTexture = bump;

    const mat = makeTerrainMaterial(tex, bump);
    terrain = new THREE.Mesh(geo, mat);
    terrain.receiveShadow = true;
    terrain.castShadow = false;
    terrain.name = 'seabed';
    staticGroup.add(terrain);
  }

  // --------------------------------------------------------------- 3-D reef dressing
  function makeRockGeometry(seedOffset, flat) {
    const g = new THREE.IcosahedronGeometry(1, flat ? 1 : 2);
    const pos = g.attributes.position;
    const v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      const n = Math.sin(v.x * 3.1 + seedOffset) * Math.cos(v.y * 2.7 - seedOffset * 1.8) * Math.sin(v.z * 4.1 + seedOffset * 2.3);
      const r = 0.86 + n * 0.17 + Math.sin((v.x + v.y + v.z) * 7.2) * 0.035;
      v.multiplyScalar(r);
      if (flat) v.y *= 0.72;
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    g.computeVertexNormals();
    return g;
  }

  function makeCoralTexture() {
    const c = makeCanvas(512, 512); const g = c.getContext('2d');
    g.fillStyle = '#a85f45'; g.fillRect(0, 0, 512, 512);
    const nice = ['#d38a5d', '#bc6d4d', '#e0a071', '#8d4e3e', '#cf7956'];
    for (let i = 0; i < 70; i++) {
      g.strokeStyle = nice[Math.floor(Math.random() * nice.length)];
      g.globalAlpha = 0.28 + Math.random() * 0.3;
      g.lineWidth = 1 + Math.random() * 5;
      g.beginPath();
      for (let k = 0; k <= 30; k++) {
        const a = k * 0.24 + i;
        const r = 20 + i * 3.4 + Math.sin(a * 3.7 + i) * 24;
        const x = 256 + Math.cos(a) * r, y = 256 + Math.sin(a) * r;
        if (k === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke();
    }
    g.globalAlpha = 1;
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  function addReefDressing() {
    const data = reefData;
    const unit = Math.min(0.9, 1);
    const rockGeos = [makeRockGeometry(1.4, false), makeRockGeometry(4.2, false), makeRockGeometry(7.7, true)];
    const rockMats = [
      new THREE.MeshStandardMaterial({ color: 0x6f7f70, roughness: 0.93, metalness: 0.02, envMapIntensity: 0.3 }),
      new THREE.MeshStandardMaterial({ color: 0x857b67, roughness: 0.96, metalness: 0.01, envMapIntensity: 0.28 }),
      new THREE.MeshStandardMaterial({ color: 0x66736e, roughness: 0.9, metalness: 0.03, envMapIntensity: 0.3 })
    ];
    data.rocks.forEach((r, i) => {
      const geo = rockGeos[i % rockGeos.length];
      const mat = rockMats[i % rockMats.length];
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(r.x, terrainHeight(r.x, r.z) + r.r * 0.3, r.z);
      mesh.rotation.set(sr(-0.2, 0.2), r.rot, sr(-0.16, 0.16));
      mesh.scale.set(r.r, r.r * sr(0.55, 0.9), r.r * sr(0.8, 1.25));
      mesh.castShadow = true; mesh.receiveShadow = true;
      staticGroup.add(mesh);
    });

    const coralTex = makeCoralTexture();
    const coralGeo = new THREE.SphereGeometry(1, 22, 13, 0, TAU, 0, Math.PI / 2);
    const cp = coralGeo.attributes.position;
    for (let i = 0; i < cp.count; i++) {
      const x = cp.getX(i), y = cp.getY(i), z = cp.getZ(i);
      const n = 1 + Math.sin(x * 7.2 + z * 5.4) * 0.055 + Math.cos(z * 9.1 - x * 3.2) * 0.035;
      cp.setXYZ(i, x * n, y * 0.66 * n, z * n);
    }
    coralGeo.computeVertexNormals();
    const coralMats = [
      new THREE.MeshStandardMaterial({ map: coralTex, color: 0xffddba, roughness: 0.82, metalness: 0.0, envMapIntensity: 0.3 }),
      new THREE.MeshStandardMaterial({ map: coralTex, color: 0xd9c39c, roughness: 0.88, metalness: 0.0, envMapIntensity: 0.28 }),
      new THREE.MeshStandardMaterial({ color: 0xc18d69, roughness: 0.9, metalness: 0.0, envMapIntensity: 0.25 })
    ];
    const coralMeshes = [];
    data.corals.forEach((c, i) => {
      if (c.type === 1 || c.type === 2) {
        // branching coral: a small hand-built thicket of tapered fingers
        const g = new THREE.Group();
        const branchMat = new THREE.MeshStandardMaterial({
          color: i % 2 ? 0xd88362 : 0xcb9a6b,
          roughness: 0.78,
          metalness: 0.0,
          envMapIntensity: 0.25
        });
        const stemGeo = new THREE.CylinderGeometry(0.055, 0.11, 1, 5);
        const tips = 9 + (i % 4) * 3;
        for (let k = 0; k < tips; k++) {
          const stem = new THREE.Mesh(stemGeo, branchMat);
          const aa = sr(0, TAU), rr = sr(0.15, 0.82);
          const height = sr(0.4, 1.15);
          stem.position.set(Math.cos(aa) * rr, height * 0.5, Math.sin(aa) * rr);
          stem.scale.set(sr(0.6, 1.6), height, sr(0.6, 1.4));
          stem.rotation.set(sr(-0.35, 0.35), sr(0, TAU), sr(-0.35, 0.35));
          stem.castShadow = true;
          g.add(stem);
        }
        g.position.set(c.x, terrainHeight(c.x, c.z) - 0.05, c.z);
        g.scale.setScalar(c.r * 1.1);
        staticGroup.add(g);
      } else {
        const mesh = new THREE.Mesh(coralGeo, coralMats[i % coralMats.length]);
        mesh.position.set(c.x, terrainHeight(c.x, c.z) - 0.03, c.z);
        mesh.rotation.y = c.rot;
        mesh.scale.setScalar(c.r * sr(0.8, 1.25));
        mesh.castShadow = true; mesh.receiveShadow = true;
        staticGroup.add(mesh);
        coralMeshes.push(mesh);
      }
    });

    // starfish instancing; simple five-limb geometry
    const shape = new THREE.Shape();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const rr = i % 2 === 0 ? 1 : 0.37;
      if (i === 0) shape.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
      else shape.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    shape.closePath();
    const starGeo = new THREE.ExtrudeGeometry(shape, { depth: 0.11, bevelEnabled: true, bevelSegments: 1, steps: 1, bevelSize: 0.035, bevelThickness: 0.03 });
    starGeo.rotateX(-Math.PI / 2);
    const starMat = new THREE.MeshStandardMaterial({ color: 0xc96f52, roughness: 0.72, metalness: 0.0, envMapIntensity: 0.3 });
    const starMesh = new THREE.InstancedMesh(starGeo, starMat, Math.max(1, data.stars.length));
    starMesh.castShadow = true; starMesh.receiveShadow = true;
    starMesh.frustumCulled = false;
    const dummy = new THREE.Object3D();
    data.stars.forEach((s, i) => {
      dummy.position.set(s.x, terrainHeight(s.x, s.z) + 0.07, s.z);
      dummy.rotation.set(0, s.rot, 0);
      dummy.scale.setScalar(s.r);
      dummy.updateMatrix();
      starMesh.setMatrixAt(i, dummy.matrix);
      if (starMesh.setColorAt) starMesh.setColorAt(i, new THREE.Color(s.tone > 0.5 ? 0xd65f4f : 0xd99061));
    });
    if (starMesh.instanceColor) starMesh.instanceColor.needsUpdate = true;
    starMesh.count = data.stars.length;
    staticGroup.add(starMesh);

    // shells (actual little ridges in 3D)
    const shellGeo = new THREE.CircleGeometry(1, 11, Math.PI, Math.PI);
    const sp = shellGeo.attributes.position;
    for (let i = 0; i < sp.count; i++) {
      const x = sp.getX(i), y = sp.getY(i);
      sp.setZ(i, Math.pow(1 - Math.abs(x), 1.4) * 0.45 + Math.abs(y) * 0.12);
    }
    shellGeo.computeVertexNormals();
    shellGeo.rotateX(-Math.PI / 2);
    const shellMat = new THREE.MeshStandardMaterial({ color: 0xf0dbc2, roughness: 0.46, metalness: 0.03, side: THREE.DoubleSide, envMapIntensity: 0.5 });
    const shellMesh = new THREE.InstancedMesh(shellGeo, shellMat, Math.max(1, data.shells.length));
    shellMesh.castShadow = true; shellMesh.frustumCulled = false;
    data.shells.forEach((s, i) => {
      dummy.position.set(s.x, terrainHeight(s.x, s.z) + 0.12, s.z);
      dummy.rotation.set(s.dry ? -0.15 : 0, s.rot, 0);
      dummy.scale.setScalar(s.r * 1.2);
      dummy.updateMatrix(); shellMesh.setMatrixAt(i, dummy.matrix);
    });
    shellMesh.count = data.shells.length;
    staticGroup.add(shellMesh);

    // urchins: a dark bead wearing a crown of spines
    const spikeGeos = [];
    const spikePos = [], spikeNorm = [];
    for (let i = 0; i < 44; i++) {
      const a = sr(0, TAU), b = Math.acos(sr(-0.35, 1));
      const dir = new THREE.Vector3(Math.sin(b) * Math.cos(a), Math.cos(b), Math.sin(b) * Math.sin(a));
      const base = dir.clone().multiplyScalar(0.22);
      const tip = dir.clone().multiplyScalar(sr(0.65, 1.05));
      const side = new THREE.Vector3(-dir.z, 0, dir.x).normalize().multiplyScalar(sr(0.025, 0.055));
      const side2 = new THREE.Vector3().crossVectors(dir, side).normalize().multiplyScalar(sr(0.02, 0.05));
      spikePos.push(base.x + side.x, base.y + side.y, base.z + side.z);
      spikePos.push(base.x - side.x, base.y - side.y, base.z - side.z);
      spikePos.push(tip.x, tip.y, tip.z);
      const n = new THREE.Vector3().crossVectors(side, dir).normalize();
      for (let k = 0; k < 3; k++) spikeNorm.push(dir.x, dir.y, dir.z);
    }
    const spikeGeo = new THREE.BufferGeometry();
    spikeGeo.setAttribute('position', new THREE.Float32BufferAttribute(spikePos, 3));
    spikeGeo.setAttribute('normal', new THREE.Float32BufferAttribute(spikeNorm, 3));
    const spikeMat = new THREE.MeshStandardMaterial({ color: 0x252c2b, roughness: 0.57, metalness: 0.05, side: THREE.DoubleSide });
    const spikes = new THREE.InstancedMesh(spikeGeo, spikeMat, Math.max(1, data.urchins.length));
    const urchinBodyGeo = new THREE.IcosahedronGeometry(0.23, 1);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2a2525, roughness: 0.42, metalness: 0.15 });
    const bodies = new THREE.InstancedMesh(urchinBodyGeo, bodyMat, Math.max(1, data.urchins.length));
    data.urchins.forEach((u, i) => {
      dummy.position.set(u.x, terrainHeight(u.x, u.z) + 0.19, u.z);
      dummy.rotation.set(0, u.rot, 0); dummy.scale.setScalar(u.r / 0.28);
      dummy.updateMatrix(); spikes.setMatrixAt(i, dummy.matrix); bodies.setMatrixAt(i, dummy.matrix);
    });
    spikes.count = bodies.count = data.urchins.length;
    spikes.castShadow = true; bodies.castShadow = true;
    staticGroup.add(spikes); staticGroup.add(bodies);

    // swaying seagrass tufts
    buildSeagrass(data);
  }

  function buildSeagrass(data) {
    seed = 0x0CEA902;
    const tuftGeo = new THREE.BufferGeometry();
    const pos = [], col = [], norm = [];
    const bladeCount = 7;
    for (let b = 0; b < bladeCount; b++) {
      const a = (b / bladeCount) * TAU + sr(-0.3, 0.3);
      const h = sr(0.55, 1.28);
      const w = sr(0.025, 0.065);
      const lean = sr(0.06, 0.32);
      const bendA = sr(0, TAU);
      const base = new THREE.Vector3(Math.cos(a) * 0.1, 0, Math.sin(a) * 0.1);
      const mid = new THREE.Vector3(base.x + Math.cos(bendA) * lean * 0.35, h * 0.55, base.z + Math.sin(bendA) * lean * 0.35);
      const tip = new THREE.Vector3(base.x + Math.cos(bendA) * lean, h, base.z + Math.sin(bendA) * lean);
      const side = new THREE.Vector3(-Math.sin(a), 0, Math.cos(a)).multiplyScalar(w);
      const c1 = new THREE.Color().setHSL(sr(0.21, 0.3), sr(0.3, 0.56), sr(0.20, 0.36));
      const c2 = c1.clone().offsetHSL(sr(-0.02, 0.04), sr(0.02, 0.14), sr(0.02, 0.12));
      const verts = [
        [base.x - side.x, base.y, base.z - side.z],
        [base.x + side.x, base.y, base.z + side.z],
        [mid.x + side.x * 0.6, mid.y, mid.z + side.z * 0.6],
        [mid.x - side.x * 0.6, mid.y, mid.z - side.z * 0.6],
        [tip.x, tip.y, tip.z]
      ];
      const idx = [[0, 1, 2], [0, 2, 3], [3, 2, 4]];
      idx.forEach((face, fi) => {
        face.forEach((vi) => {
          const v = verts[vi];
          pos.push(v[0], v[1], v[2]);
          norm.push(0, 0.2, 1);
          const c = vi >= 3 ? c2 : c1;
          col.push(c.r, c.g, c.b);
        });
      });
    }
    tuftGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    tuftGeo.setAttribute('normal', new THREE.Float32BufferAttribute(norm, 3));
    tuftGeo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));

    const matrices = [];
    data.grass.forEach((patch) => {
      const n = Math.max(12, Math.round(patch.amount / 18));
      for (let i = 0; i < n; i++) {
        const a = sr(0, TAU), r = Math.sqrt(srand()) * patch.r;
        const x = patch.x + Math.cos(a) * r;
        const z = patch.z + Math.sin(a) * r * 0.82;
        if (insideView(x, z, 1.3)) matrices.push({ x, z, s: sr(0.65, 1.55), rot: sr(0, TAU) });
      }
    });
    if (!matrices.length) return;
    const mat = new THREE.MeshStandardMaterial({
      vertexColors: true, side: THREE.DoubleSide, roughness: 0.83, metalness: 0,
      envMapIntensity: 0.2
    });
    mat.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = { value: 0 };
      grassMaterial = mat;
      mat.userData.shader = shader;
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>\nuniform float uTime;')
        .replace('#include <begin_vertex>', `
          #include <begin_vertex>
          #ifdef USE_INSTANCING
            float instPhase = instanceMatrix[3].x * 0.63 + instanceMatrix[3].z * 0.91;
            float sway = sin(uTime*0.95 + instPhase + position.y*1.8);
            transformed.x += sway * 0.075 * pow(max(position.y,0.0),1.35);
            transformed.z += cos(uTime*0.71 + instPhase*1.3 + position.y) * 0.045 * pow(max(position.y,0.0),1.3);
          #endif
        `);
    };
    mat.customProgramCacheKey = () => 'ocean-grass-v1';
    grassMaterial = mat;
    const inst = new THREE.InstancedMesh(tuftGeo, mat, matrices.length);
    inst.frustumCulled = false;
    inst.receiveShadow = true;
    const dummy = new THREE.Object3D();
    matrices.forEach((m, i) => {
      dummy.position.set(m.x, terrainHeight(m.x, m.z) + 0.02, m.z);
      dummy.rotation.set(0, m.rot, 0);
      dummy.scale.setScalar(m.s);
      dummy.updateMatrix(); inst.setMatrixAt(i, dummy.matrix);
    });
    inst.count = matrices.length;
    staticGroup.add(inst);
  }

  // --------------------------------------------------------------- palm
  function makeBarkTexture() {
    const c = makeCanvas(128, 512); const g = c.getContext('2d');
    const grd = g.createLinearGradient(0, 0, 128, 0);
    grd.addColorStop(0, '#5a4936'); grd.addColorStop(0.5, '#8c7251'); grd.addColorStop(1, '#4b3b2e');
    g.fillStyle = grd; g.fillRect(0, 0, 128, 512);
    for (let y = 4; y < 512; y += 12 + Math.random() * 10) {
      g.strokeStyle = `rgba(40,30,23,${0.28 + Math.random() * 0.25})`;
      g.lineWidth = 1.2 + Math.random() * 2;
      g.beginPath();
      for (let x = 0; x <= 128; x += 8) g.lineTo(x, y + Math.sin(x * 0.1 + y) * 3);
      g.stroke();
      g.strokeStyle = 'rgba(219,188,142,.18)'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(0, y + 3); g.lineTo(128, y + 1 + Math.sin(y) * 2); g.stroke();
    }
    for (let i = 0; i < 320; i++) {
      g.fillStyle = `rgba(${60 + Math.random() * 40},${48 + Math.random() * 30},${35 + Math.random() * 20},${Math.random() * 0.18})`;
      g.fillRect(Math.random() * 128, Math.random() * 512, 1 + Math.random() * 4, 1 + Math.random() * 2);
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.encoding = THREE.sRGBEncoding;
    t.repeat.set(2, 1);
    return t;
  }

  function makeTrunkGeometry(curve, height) {
    const rings = 24, radial = 8;
    const pos = [], uv = [], idx = [];
    const up = new THREE.Vector3(0, 1, 0);
    const tang = new THREE.Vector3();
    for (let i = 0; i <= rings; i++) {
      const t = i / rings;
      const p = curve.getPointAt(t);
      curve.getTangentAt(t, tang);
      const side = new THREE.Vector3().crossVectors(tang, new THREE.Vector3(0, 0, 1)).normalize();
      if (side.lengthSq() < 0.01) side.set(1, 0, 0);
      const other = new THREE.Vector3().crossVectors(side, tang).normalize();
      const radius = lerp(0.26, 0.105, Math.pow(t, 0.72));
      for (let j = 0; j <= radial; j++) {
        const a = j / radial * TAU;
        const ox = side.x * Math.cos(a) * radius + other.x * Math.sin(a) * radius;
        const oy = side.y * Math.cos(a) * radius + other.y * Math.sin(a) * radius;
        const oz = side.z * Math.cos(a) * radius + other.z * Math.sin(a) * radius;
        pos.push(p.x + ox, p.y + oy, p.z + oz);
        uv.push(j / radial, t);
      }
    }
    for (let i = 0; i < rings; i++) {
      for (let j = 0; j < radial; j++) {
        const a = i * (radial + 1) + j;
        const b = a + radial + 1;
        idx.push(a, b, a + 1, a + 1, b, b + 1);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }

  function buildFrondGeometry(length, droop, spread, seedOffset) {
    const positions = [], colors = [], indices = [];
    const leafN = 17;
    const cBase = new THREE.Color().setHSL(sr(0.275, 0.325), 0.44, 0.17);
    const cTip = new THREE.Color().setHSL(sr(0.27, 0.33), 0.54, 0.30);
    function spine(t) {
      const x = t * length;
      const y = 0.42 * Math.sin(clamp(t, 0, 1) * Math.PI * 0.5) - droop * Math.pow(t, 2.2) * length * 0.35;
      const z = Math.sin(t * Math.PI * 0.8) * spread * 0.24;
      return new THREE.Vector3(x, y, z);
    }
    // central rachis as a slender ribbon
    for (let i = 0; i < leafN * 2; i++) {
      const side = i % 2 === 0 ? -1 : 1;
      const t = Math.floor(i / 2) / (leafN * 2 - 1);
      const a = spine(t);
      const b = spine(Math.min(1, t + 0.04));
      const w = (0.016 + 0.026 * Math.sin(t * Math.PI)) * side;
      positions.push(a.x, a.y, a.z, b.x, b.y, b.z, b.x, b.y + w, b.z);
      const localC = cBase.clone().lerp(cTip, t).offsetHSL(sr(-0.01, 0.02), 0, sr(-0.03, 0.03));
      colors.push(localC.r, localC.g, localC.b, localC.r, localC.g, localC.b, localC.r, localC.g, localC.b);
    }
    let cursor = 0;
    const addTri = (a, b, c, col) => {
      const base = positions.length / 3;
      positions.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
      for (let k = 0; k < 3; k++) colors.push(col.r, col.g, col.b);
      indices.push(base, base + 1, base + 2);
    };
    for (let i = 1; i < leafN; i++) {
      const t = i / leafN;
      const t0 = Math.max(0, t - 0.035), t1 = Math.min(1, t + 0.055);
      const p0 = spine(t0), p1 = spine(t1), pmid = spine((t0 + t1) * 0.5);
      const w = Math.sin(t * Math.PI) * 1.0 + 0.14;
      const sweep = 0.34;
      for (let side = -1; side <= 1; side += 2) {
        const lateral = new THREE.Vector3(0, 0, side * w * spread * 0.8);
        const forward = new THREE.Vector3(sweep * length * 0.035, 0, 0);
        const tip = pmid.clone().add(lateral).add(forward);
        tip.y -= 0.06 + t * 0.15 + Math.abs(side) * 0.02;
        const base1 = p0.clone().add(new THREE.Vector3(0, 0, side * 0.018));
        const base2 = p1.clone().add(new THREE.Vector3(0, 0, side * 0.018));
        const c = cBase.clone().lerp(cTip, t).offsetHSL(sr(-0.01, 0.035), sr(-0.03, 0.08), sr(-0.04, 0.05));
        addTri(base1, base2, tip, c);
      }
    }
    // a slim, bright leading leaflet pair at the tip
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    g.setIndex(indices);
    g.computeVertexNormals();
    return { geo: g, spine };
  }

  function buildPalm() {
    const root = new THREE.Vector3(beach.cx + beach.r * 0.24, 0, beach.cz + beach.r * 0.28);
    root.y = terrainHeight(root.x, root.z);
    const outward = new THREE.Vector3(root.x - beach.cx, 0, root.z - beach.cz).normalize();
    // lean into the picture, toward the sea
    const leanDir = outward.clone().multiplyScalar(0.55).add(new THREE.Vector3(0.88, 0, 0.56).normalize().multiplyScalar(0.45)).normalize();
    const H = 5.6;
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(outward.x * 0.3 + leanDir.x * 0.5, H * 0.28, outward.z * 0.3 + leanDir.z * 0.5),
      new THREE.Vector3(outward.x * 1.0 + leanDir.x * 1.35, H * 0.62, outward.z * 1.0 + leanDir.z * 1.35),
      new THREE.Vector3(outward.x * 2.0 + leanDir.x * 1.3, H, outward.z * 2.0 + leanDir.z * 1.2)
    ]);
    const group = new THREE.Group();
    group.position.copy(root);
    const trunkMat = new THREE.MeshStandardMaterial({
      map: makeBarkTexture(), color: 0xffffff, roughness: 0.9, metalness: 0.0, envMapIntensity: 0.28
    });
    const trunk = new THREE.Mesh(makeTrunkGeometry(curve, H), trunkMat);
    trunk.castShadow = true; trunk.receiveShadow = true;
    group.add(trunk);
    // roots
    const rootGeo = new THREE.ConeGeometry(0.17, 0.9, 5, 1, true);
    for (let i = 0; i < 6; i++) {
      const m = new THREE.Mesh(rootGeo, trunkMat);
      const a = i / 6 * TAU + 0.2;
      m.position.set(Math.cos(a) * 0.38, 0.15, Math.sin(a) * 0.38);
      m.rotation.set(Math.cos(a) * 0.9, -a, Math.sin(a) * 0.9);
      m.scale.set(1, 0.8, 1);
      m.castShadow = true;
      group.add(m);
    }
    const crown = new THREE.Group();
    const end = curve.getPointAt(1);
    crown.position.copy(end);
    group.add(crown);

    // coconuts
    const coconutMat = new THREE.MeshStandardMaterial({ color: 0x5b452e, roughness: 0.86, metalness: 0.02 });
    for (let i = 0; i < 3; i++) {
      const coconut = new THREE.Mesh(new THREE.SphereGeometry(sr(0.13, 0.18), 10, 8), coconutMat);
      coconut.position.set(sr(-0.3, 0.3), sr(-0.1, 0.1), sr(-0.3, 0.3));
      coconut.castShadow = true;
      crown.add(coconut);
    }

    const frondMat = new THREE.MeshStandardMaterial({
      vertexColors: true, side: THREE.DoubleSide, roughness: 0.83, metalness: 0.0,
      envMapIntensity: 0.22, color: 0xdfe0c4
    });
    palmFronds = [];
    const count = 8;
    for (let i = 0; i < count; i++) {
      const fg = new THREE.Group();
      const len = sr(2.9, 3.95);
      const droop = sr(0.75, 1.35);
      const spread = sr(0.72, 1.08);
      const built = buildFrondGeometry(len, droop, spread, i * 3.7);
      const frond = new THREE.Mesh(built.geo, frondMat);
      frond.castShadow = true; frond.receiveShadow = true;
      fg.add(frond);
      fg.rotation.y = (i / count) * TAU + sr(-0.16, 0.16);
      fg.rotation.x = sr(-0.06, 0.12);
      fg.rotation.z = sr(-0.13, 0.06);
      fg.userData.baseY = fg.rotation.y;
      fg.userData.baseX = fg.rotation.x;
      fg.userData.baseZ = fg.rotation.z;
      fg.userData.phase = sr(0, TAU);
      fg.userData.speed = sr(0.55, 0.95);
      crown.add(fg);
      palmFronds.push(fg);
    }
    // a couple of dry, hanging older fronds
    for (let i = 0; i < 2; i++) {
      const fg = new THREE.Group();
      const built = buildFrondGeometry(sr(2.6, 3.3), 1.35, 0.65, 44 + i);
      const frond = new THREE.Mesh(built.geo, new THREE.MeshStandardMaterial({
        vertexColors: true, side: THREE.DoubleSide, roughness: 0.92, metalness: 0, color: 0xa99365
      }));
      frond.castShadow = true;
      fg.add(frond); fg.rotation.y = 2.2 + i * 2.7; fg.rotation.z = 0.4 + i * 0.2;
      fg.userData.baseY = fg.rotation.y; fg.userData.baseX = 0; fg.userData.baseZ = fg.rotation.z;
      fg.userData.phase = i * 2; fg.userData.speed = 0.55;
      crown.add(fg); palmFronds.push(fg);
    }
    group.scale.setScalar(0.96);
    group.position.y = root.y;
    group.rotation.y = 0;
    staticGroup.add(group);
    palm = group;
    palmSway = group;
    palmCrown = crown;
  }
