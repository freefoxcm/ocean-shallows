<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a3944" />
<meta name="description" content="Ocean Shallows — a living top-down tropical reef: translucent water, a palm-shaded beach, manta rays and drifting jellyfish." />
<title>Ocean Shallows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#082b32;
    --ink-soft:#1d4a50;
    --cream:#f7f3e6;
    --seafoam:#dff6ea;
    --glass:rgba(245,255,250,.16);
    --glass-strong:rgba(241,255,250,.24);
    --glass-line:rgba(255,255,255,.42);
    --deep-glass:rgba(5,44,52,.42);
    --shadow:0 18px 60px rgba(0,31,37,.28);
    --serif:"Fraunces",Georgia,serif;
    --sans:"Nunito Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  html{background:#0b4b57;}
  body{
    overflow:hidden;
    background:
      radial-gradient(ellipse at 18% 5%,rgba(232,255,224,.20),transparent 36%),
      linear-gradient(165deg,#137789 0%,#0b5162 54%,#082f47 100%);
    color:var(--cream);
    font-family:var(--sans);
    -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    user-select:none;
  }
  #scene{
    position:fixed;inset:0;
    display:block;width:100%;height:100%;
    outline:none;touch-action:none;
    cursor:crosshair;
  }
  body.whirl-active #scene{cursor:grab;}
  body.whirl-dragging #scene{cursor:grabbing;}

  .ui{
    position:fixed;inset:0;z-index:5;
    pointer-events:none;
    transition:opacity .6s cubic-bezier(.2,.7,.2,1), visibility .6s;
  }
  .ui button{font:inherit;}
  .ui a{color:inherit;}
  .ui > *{pointer-events:auto;}

  .masthead{
    position:absolute;top:clamp(14px,2.4vw,28px);left:47%;
    transform:translateX(-50%);
    text-align:center;width:min(94vw,760px);
    text-shadow:0 2px 16px rgba(1,25,31,.38),0 1px 2px rgba(1,25,31,.4);
    animation:settle 1.4s .2s both cubic-bezier(.2,.75,.2,1);
  }
  .kicker{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-size:9.5px;font-weight:800;letter-spacing:.3em;text-transform:uppercase;
    color:rgba(242,255,244,.79);
  }
  .kicker .dot{
    width:5px;height:5px;border-radius:50%;background:#c2f5d9;
    box-shadow:0 0 0 3px rgba(194,245,217,.13),0 0 12px rgba(194,245,217,.7);
  }
  h1{
    margin:.2em 0 .04em;
    font-family:var(--serif);
    font-weight:320;
    font-size:clamp(34px,3.7vw,52px);
    line-height:.95;
    letter-spacing:-.035em;
    color:#f6faee;
    font-variation-settings:"opsz" 100,"SOFT" 40,"WONK" 1;
  }
  h1 em{
    font-style:italic;
    font-weight:350;
    color:#dff9e3;
    letter-spacing:-.03em;
  }
  .subtitle{
    margin:10px auto 0;
    max-width:390px;
    font-size:10.5px;font-weight:600;
    letter-spacing:.12em;text-transform:uppercase;
    color:rgba(239,255,244,.60);
  }

  .controls{
    position:absolute;top:clamp(14px,2.4vw,26px);right:clamp(12px,2.2vw,30px);
    display:grid;grid-template-columns:repeat(3,max-content);align-items:center;gap:6px;
    animation:fadeIn 1.3s .34s both;
  }
  .ctl{
    position:relative;
    display:inline-flex;align-items:center;gap:7px;
    height:34px;padding:0 12px 0 10px;
    border:1px solid rgba(225,255,245,.23);
    border-radius:999px;
    background:linear-gradient(180deg,rgba(6,41,49,.46),rgba(4,34,43,.3));
    -webkit-backdrop-filter:blur(18px) saturate(130%);
    backdrop-filter:blur(18px) saturate(130%);
    color:rgba(244,255,248,.88);
    box-shadow:0 8px 24px rgba(0,25,31,.16),inset 0 1px 0 rgba(255,255,255,.11);
    cursor:pointer;white-space:nowrap;
    font-size:11px;font-weight:700;letter-spacing:.01em;
    transition:background .26s,color .26s,border-color .26s,transform .26s,box-shadow .26s;
  }
  .ctl svg{width:14px;height:14px;flex:none;opacity:.9;stroke:currentColor;fill:none;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;}
  .ctl:hover{
    background:linear-gradient(180deg,rgba(13,69,76,.66),rgba(6,43,51,.52));
    border-color:rgba(230,255,246,.4);transform:translateY(-1px);
    box-shadow:0 11px 30px rgba(0,25,31,.22),inset 0 1px 0 rgba(255,255,255,.16);
  }
  .ctl:active{transform:translateY(0) scale(.985);}
  .ctl[aria-pressed="true"]{
    background:linear-gradient(180deg,rgba(235,255,242,.95),rgba(206,246,229,.87));
    border-color:rgba(255,255,255,.72);
    color:#0c4148;
    box-shadow:0 8px 26px rgba(1,31,37,.22),inset 0 1px 0 rgba(255,255,255,.8);
  }
  .ctl[aria-pressed="true"] svg{opacity:1;}
  .ctl .key{
    display:inline-flex;align-items:center;justify-content:center;
    width:14px;height:14px;margin-left:1px;
    border-radius:4px;
    background:rgba(255,255,255,.08);
    font-size:8px;font-weight:800;letter-spacing:0;
    opacity:.58;
  }
  .ctl[aria-pressed="true"] .key{background:rgba(8,65,70,.09);opacity:.5;}
  .ctl.spin svg{animation:spin 13s linear infinite;animation-play-state:paused;}
  .ctl.spin[aria-pressed="true"] svg{animation-play-state:running;}

  .dock{
    position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom));
    transform:translateX(-50%);
    width:min(1040px,calc(100vw - 36px));
    padding:13px 16px 12px;
    border-radius:22px;
    border:1px solid var(--glass-line);
    background:
      linear-gradient(125deg,rgba(250,255,250,.26),rgba(227,249,240,.12) 45%,rgba(212,244,237,.19));
    -webkit-backdrop-filter:blur(30px) saturate(155%);
    backdrop-filter:blur(30px) saturate(155%);
    box-shadow:
      0 28px 70px rgba(0,27,34,.32),
      0 2px 0 rgba(255,255,255,.09) inset,
      inset 0 1px 0 rgba(255,255,255,.5);
    animation:dockIn 1.3s .48s both cubic-bezier(.2,.78,.2,1);
    color:var(--ink);
  }
  .dock::before{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(ellipse at 50% -20%,rgba(255,255,255,.32),transparent 62%);
    mix-blend-mode:screen;opacity:.7;
  }
  .dock-head{
    display:flex;align-items:center;gap:12px;
    padding:0 4px 9px;position:relative;z-index:1;
  }
  .dock-title{
    font-family:var(--serif);font-size:12px;font-style:italic;font-weight:430;
    color:rgba(9,54,59,.75);letter-spacing:.01em;
  }
  .dock-title b{
    font-family:var(--sans);font-style:normal;font-size:8px;font-weight:800;
    letter-spacing:.2em;text-transform:uppercase;color:rgba(10,62,67,.49);
    margin-left:9px;vertical-align:1px;
  }
  .counter{
    margin-left:auto;
    font-size:10px;font-weight:700;letter-spacing:.035em;
    color:rgba(7,50,55,.72);
    white-space:nowrap;text-transform:none;
  }
  .counter .num{font-family:var(--serif);font-size:13px;font-weight:560;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums;}
  .cap{
    font-size:8.5px;font-weight:800;letter-spacing:.09em;
    color:rgba(7,50,55,.44);
    padding-left:11px;border-left:1px solid rgba(8,65,70,.18);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .cap b{font-weight:800;color:rgba(8,54,59,.7);}
  .cards{
    display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;
    position:relative;z-index:1;
  }
  .card{
    position:relative;display:flex;align-items:center;gap:10px;
    min-width:0;height:66px;padding:7px 9px 7px 7px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.35);
    background:linear-gradient(135deg,rgba(255,255,252,.35),rgba(218,248,237,.18));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.42),0 5px 15px rgba(4,55,60,.08);
    color:var(--ink);
    text-align:left;cursor:grab;touch-action:none;
    transition:transform .3s cubic-bezier(.2,.8,.2,1),background .3s,border-color .3s,box-shadow .3s,opacity .3s;
    overflow:hidden;
  }
  .card::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(circle at 10% 0%,rgba(255,255,255,.5),transparent 45%);
    opacity:.45;mix-blend-mode:screen;
  }
  .card:hover{
    transform:translateY(-3px);
    background:linear-gradient(135deg,rgba(255,255,250,.49),rgba(218,248,237,.26));
    border-color:rgba(255,255,255,.59);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.62),0 12px 26px rgba(4,55,60,.15);
  }
  .card:active{transform:translateY(-1px) scale(.992);cursor:grabbing;}
  .card.dragging{
    transform:translateY(-7px) scale(.97);
    opacity:.58;border-color:rgba(255,255,255,.7);
  }
  .card.dragging .thumb{box-shadow:0 12px 28px rgba(0,31,36,.32);}
  .thumb{
    position:relative;flex:none;width:50px;height:50px;border-radius:11px;overflow:hidden;
    background:
      radial-gradient(circle at 38% 26%,rgba(255,255,255,.25),transparent 35%),
      linear-gradient(155deg,var(--accent-1),var(--accent-2));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.33),0 4px 12px rgba(4,50,56,.16);
    transform:translateZ(0);
  }
  .thumb canvas{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s .12s;}
  .thumb canvas.ready{opacity:1;}
  .thumb::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(145deg,rgba(255,255,255,.22),transparent 40%,rgba(1,39,43,.17));
  }
  .card-copy{min-width:0;flex:1;position:relative;z-index:1;padding-right:2px;}
  .name{
    display:-webkit-box;font-family:var(--serif);font-size:13.5px;font-weight:440;line-height:1.02;
    letter-spacing:-.012em;color:rgba(5,44,49,.92);
    white-space:normal;overflow:hidden;text-overflow:ellipsis;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .note{
    display:block;margin-top:4px;
    font-size:7.5px;font-weight:800;line-height:1.1;letter-spacing:.12em;text-transform:uppercase;
    color:rgba(8,57,61,.47);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .card .plus{
    position:absolute;right:7px;top:7px;width:14px;height:14px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.24);color:rgba(7,55,60,.55);
    font-size:11px;font-weight:500;line-height:1;opacity:0;transform:scale(.7);
    transition:opacity .25s,transform .25s;
  }
  .card:hover .plus{opacity:1;transform:scale(1);}
  .card[data-species="manta"]{--accent-1:#1d5966;--accent-2:#082d38;}
  .card[data-species="eagle"]{--accent-1:#786345;--accent-2:#222e2e;}
  .card[data-species="stingray"]{--accent-1:#2b8d9b;--accent-2:#0c4c66;}
  .card[data-species="moon"]{--accent-1:#b88a9d;--accent-2:#3f5a71;}
  .card[data-species="nettle"]{--accent-1:#c68651;--accent-2:#5c4b44;}
  .card.full-disabled{opacity:.45;cursor:not-allowed;}
  .dock-foot{
    display:flex;align-items:center;gap:7px;
    height:0;overflow:hidden;
    font-size:8px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
    color:rgba(7,50,55,.4);
    transition:height .3s;
  }
  .dock-foot.show{height:17px;padding:2px 5px 0;}
  .dock-foot .right{margin-left:auto;letter-spacing:.08em;text-transform:none;font-weight:700;}

  .toast{
    position:absolute;left:50%;bottom:clamp(128px,19vh,180px);
    transform:translate(-50%,10px);
    padding:9px 16px;border-radius:999px;
    background:rgba(5,38,44,.65);
    border:1px solid rgba(255,255,255,.18);
    -webkit-backdrop-filter:blur(18px);
    backdrop-filter:blur(18px);
    color:rgba(247,255,247,.92);
    font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    box-shadow:0 16px 40px rgba(0,27,32,.22);
    opacity:0;pointer-events:none;
    transition:opacity .3s,transform .3s;
    white-space:nowrap;z-index:9;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  .restore{
    position:absolute;right:14px;bottom:14px;
    width:36px;height:36px;border-radius:50%;
    display:none;align-items:center;justify-content:center;
    background:rgba(5,42,48,.32);border:1px solid rgba(255,255,255,.18);
    color:rgba(240,255,245,.7);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    cursor:pointer;pointer-events:auto;transition:opacity .3s,background .3s;
    opacity:.35;
  }
  .restore:hover{opacity:.9;background:rgba(5,42,48,.6);}
  .restore svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;}
  .ui.hidden .masthead,
  .ui.hidden .controls,
  .ui.hidden .dock,
  .ui.hidden .toast{opacity:0;visibility:hidden;transform:translateY(6px);pointer-events:none;}
  .ui.hidden .restore{display:flex;}

  .loader{
    position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(ellipse at 50% 42%,rgba(69,170,164,.3),transparent 55%),
      linear-gradient(155deg,#0d5c68,#062d40 75%);
    color:#eef9ed;
    transition:opacity 1s .1s,visibility 1s;
  }
  .loader.gone{opacity:0;visibility:hidden;pointer-events:none;}
  .loader-inner{text-align:center;transform:translateY(-1vh);}
  .loader-mark{
    width:44px;height:44px;margin:0 auto 20px;position:relative;border-radius:50%;
    border:1px solid rgba(231,255,240,.35);
  }
  .loader-mark::before,.loader-mark::after{
    content:"";position:absolute;left:50%;top:50%;border-radius:50%;
    border:1px solid rgba(225,253,234,.42);transform:translate(-50%,-50%);
    animation:ripple 2.4s infinite cubic-bezier(.2,.6,.2,1);
  }
  .loader-mark::after{animation-delay:1.2s;}
  .loader h2{font-family:var(--serif);font-weight:330;font-size:29px;letter-spacing:-.02em;margin:0;}
  .loader h2 em{font-style:italic;color:#d6f5de;}
  .loader p{
    font-size:8px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;
    color:rgba(234,255,243,.48);margin:12px 0 0;
  }
  .loader .load-line{width:110px;height:1px;background:rgba(255,255,255,.14);margin:24px auto 0;overflow:hidden;}
  .loader .load-line i{display:block;width:35%;height:100%;background:linear-gradient(90deg,transparent,#d8f7e4,transparent);animation:loadline 1.5s infinite ease-in-out;}
  .error-card{
    max-width:420px;padding:26px 30px;border-radius:18px;background:rgba(6,38,44,.65);
    border:1px solid rgba(255,255,255,.18);font-size:13px;line-height:1.6;
  }

  @keyframes settle{from{opacity:0;transform:translate(-50%,-9px);}to{opacity:1;transform:translate(-50%,0);}}
  @keyframes dockIn{from{opacity:0;transform:translate(-50%,22px) scale(.985);}to{opacity:1;transform:translate(-50%,0) scale(1);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes ripple{0%{width:10px;height:10px;opacity:.9;}100%{width:58px;height:58px;opacity:0;}}
  @keyframes loadline{0%{transform:translateX(-120%);}100%{transform:translateX(340%);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

  @media (max-width: 1100px) and (min-width: 701px){
    .masthead{left:50%;}
    .controls{
      top:auto;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 112px);
      right:50%;transform:translateX(50%);
      display:flex;flex-wrap:wrap;justify-content:center;
      width:max-content;max-width:calc(100vw - 20px);gap:5px;
    }
    .ctl{height:30px;font-size:10px;padding:0 9px;}
    .ctl .key{display:none;}
  }
  @media (max-width: 960px){
    .masthead{top:16px;}
    .controls{top:auto;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 106px);right:50%;transform:translateX(50%);display:flex;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100vw - 20px);gap:5px;}
    .ctl{height:31px;padding:0 10px;font-size:10px;}
    .ctl .key{display:none;}
    .dock{width:calc(100vw - 20px);border-radius:18px;padding:10px 10px 9px;}
    .card{height:64px;padding:6px;border-radius:11px;gap:7px;}
    .thumb{width:45px;height:45px;border-radius:9px;}
    .name{font-size:11.5px;}
    .note{font-size:6.2px;letter-spacing:.08em;margin-top:3px;}
    .dock-title b{display:none;}
    .counter{font-size:8.5px;letter-spacing:.01em;}
    .counter .num{font-size:12px;}
    .cap{padding-left:8px;font-size:7.5px;}
    .toast{bottom:calc(max(16px,env(safe-area-inset-bottom)) + 100px);}
  }
  @media (max-width: 700px){
    .masthead{width:100%;top:13px;text-align:left;padding-left:18px;left:0;transform:none;animation:fadeIn .9s both;}
    .kicker{font-size:8px;letter-spacing:.25em;justify-content:flex-start;}
    h1{font-size:31px;line-height:1;margin-top:6px;}
    .subtitle{display:none;}
    .controls{top:73px;bottom:auto;left:10px;right:auto;transform:none;animation:fadeIn 1s both;justify-content:flex-start;gap:4px;max-width:calc(100vw - 20px);}
    .ctl{height:28px;padding:0 8px;font-size:9px;gap:5px;border-radius:9px;}
    .ctl svg{width:12px;height:12px;}
    .dock{bottom:max(8px,env(safe-area-inset-bottom));width:calc(100vw - 16px);padding:8px 8px 7px;}
    .dock-head{padding:0 2px 6px;}
    .dock-title{font-size:10px;}
    .cards{gap:4px;}
    .card{display:flex;flex-direction:column;height:82px;min-height:0;padding:4px;text-align:center;border-radius:10px;}
    .thumb{width:100%;height:37px;flex:none;border-radius:7px;margin:0 auto;}
    .card-copy{margin-top:3px;padding:0;flex:none;display:block;height:23px;}
    .name{font-size:9px;line-height:1.1;white-space:normal;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;height:21px;color:rgba(5,44,49,.9);}
    .note{display:none;}
    .card .plus{display:none;}
    .counter{font-size:7.5px;letter-spacing:0;}
    .counter .num{font-size:10.5px;}
    .cap{font-size:6.5px;padding-left:5px;}
    .toast{bottom:calc(max(8px,env(safe-area-inset-bottom)) + 100px);font-size:8px;padding:8px 12px;}
  }
  @media (max-height: 560px) and (orientation: landscape){
    .masthead{top:8px;left:18px;transform:none;text-align:left;width:auto;animation:fadeIn .8s both;}
    .kicker{font-size:7px;}
    h1{font-size:26px;}
    .subtitle{display:none;}
    .controls{top:8px;right:10px;left:auto;bottom:auto;transform:none;max-width:calc(100vw - 260px);justify-content:flex-end;animation:fadeIn .8s both;}
    .ctl{height:26px;font-size:8.5px;padding:0 8px;}
    .ctl .key{display:none;}
    .dock{bottom:6px;width:min(calc(100vw - 16px),900px);padding:7px 8px 6px;}
    .dock-head{display:none;}
    .card{height:48px;padding:5px;}
    .thumb{width:36px;height:36px;border-radius:7px;}
    .name{font-size:10px;}
    .note{display:none;}
    .toast{bottom:72px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="A top-down living tropical sea with a palm-shaded beach, rays and jellyfish"></canvas>

<div class="ui" id="ui">
  <header class="masthead">
    <div class="kicker"><span class="dot"></span>A living reef, seen from above</div>
    <h1>Ocean <em>Shallows</em></h1>
    <p class="subtitle">A pocket sea — warm, clear, and always moving.</p>
  </header>

  <nav class="controls" aria-label="Sea controls">
    <button class="ctl" data-action="rain" aria-pressed="false" title="Rain (R)">
      <svg viewBox="0 0 24 24"><path d="M6.5 14.3A4.3 4.3 0 0 1 7.1 5.8a5.6 5.6 0 0 1 10.7 1.6 3.6 3.6 0 0 1 .7 7.1"/><path d="M8.2 17.3l-1 2.4M12.2 17.3l-1 2.4M16.2 17.3l-1 2.4"/></svg>
      <span>Rain</span><span class="key">R</span>
    </button>

<div class="loader" id="loader">
  <div class="loader-inner">
    <div class="loader-mark"></div>
