  function makeBellGeometry(spec) {
    const segments = 64;
    const rings = 15;
    const positions = [], rimAttr = [], indices = [];
    const profile = [];
    for (let i = 0; i <= rings; i++) {
      const t = i / rings;
      const theta = t * Math.PI / 2;
      profile.push({ r: Math.pow(Math.sin(theta), 0.92) * spec.bellR, y: Math.pow(Math.cos(theta), 0.92) * spec.bellH, t });
    }
    // flared, slightly scalloped margin
    profile.push({ r: spec.bellR * 1.055, y: -spec.bellH * 0.055, t: 1 });
    profile.push({ r: spec.bellR * 0.965, y: -spec.bellH * 0.125, t: 1 });
    for (let i = 0; i < profile.length; i++) {
      const pr = profile[i];
      for (let j = 0; j <= segments; j++) {
        const a = j / segments * TAU;
        const scallop = 1 + 0.026 * Math.cos(a * 8 + 0.4) * Math.pow(pr.t, 5) + 0.012 * Math.cos(a * 16 + 1.7) * pr.t;
        positions.push(Math.cos(a) * pr.r * scallop, pr.y, Math.sin(a) * pr.r * scallop);
        rimAttr.push(pr.t);
      }
    }
    for (let i = 0; i < profile.length - 1; i++) {
      for (let j = 0; j < segments; j++) {
        const a = i * (segments + 1) + j;
        const b = a + segments + 1;
        indices.push(a, a + 1, b, a + 1, b + 1, b);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    g.setAttribute('aRim', new THREE.Float32BufferAttribute(rimAttr, 1));
    g.setIndex(indices);
    g.computeVertexNormals();
    return g;
  }

  const JELLY_BELL_VERT = `
    varying vec3 vNormalW;
    varying vec3 vViewDir;
    varying vec3 vLocal;
    varying float vRim;
    uniform float uTime, uPulse, uBellR;
    attribute float aRim;
    void main(){
      vec3 transformed = position;
      float rim = clamp(aRim,0.0,1.0);
      float wobble = sin(atan(position.z, position.x)*5.0 + uTime*2.3) * 0.012 * rim;
      transformed.xz *= 1.0 - uPulse*(0.035 + 0.17*rim);
      transformed.y *= 1.0 + uPulse*0.065;
      transformed.y -= rim*rim*uPulse*0.022;
      transformed.y += wobble*(1.0-uPulse*.4);
      transformed.x += sin(uTime*1.2 + rim*7.0)*0.018*rim;
      transformed.z += cos(uTime*.94 + rim*6.0)*0.014*rim;
      vLocal = transformed;
      vRim = rim;
      vNormalW = normalize(mat3(modelMatrix) * normal);
      vec4 world = modelMatrix * vec4(transformed,1.0);
      vViewDir = cameraPosition - world.xyz;
      gl_Position = projectionMatrix * viewMatrix * world;
    }
  `;

  const JELLY_BELL_FRAG = `
    precision highp float;
    varying vec3 vNormalW;
    varying vec3 vViewDir;
    varying vec3 vLocal;
    varying float vRim;
    uniform float uTime, uPulse, uKind, uSunStrength;
    uniform vec3 uTintA, uTintB;
    float hash21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float vnoise(vec2 p){
      vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
      return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x), mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x), f.y);
    }
    float lobeGlow(float v, float p){ return v*0.06 + p*0.03; }
    void main(){
      vec3 N = normalize(vNormalW);
      if(!gl_FrontFacing) N = -N;
      vec3 V = normalize(vViewDir);
      float fres = pow(1.0 - abs(dot(N,V)), 2.15);
      float ang = atan(vLocal.z, vLocal.x);
      float radial = length(vLocal.xz) / max(0.001, length(vLocal.xz) + .8);
      vec3 col;
      float alpha = 0.17 + fres*0.60 + uPulse*0.04;
      float rimGlow = smoothstep(.63,.98,vRim);
      if(uKind < 0.5){
        col = mix(uTintA, uTintB, smoothstep(.18,.64,abs(ang)/3.14159));
        col = mix(col, vec3(0.95,0.985,0.94), rimGlow*0.6);
        float canals = pow(0.5 + 0.5*sin(ang*16.0 + .25), 18.0) * smoothstep(.2,.95,vRim);
        col += vec3(.15,.24,.22)*canals*.5;
        alpha += canals*0.09;
        // soft internal body glow and four-lobed centre
        float lobed = pow(0.5 + 0.5*cos(ang*4.0), 4.0) * smoothstep(.45,.02,length(vLocal.xz)/.8);
        col = mix(col, vec3(.83,.95,.91), lobed*.45);
        alpha += lobeGlow(lobed, uPulse);
      } else {
        float stripes = smoothstep(.15,.83,sin(ang*12.0 + .4)*.5+.5);
        stripes = mix(stripes, smoothstep(.2,.75,sin(ang*7.0-1.2)*.5+.5), .35);
        col = mix(uTintA, uTintB, stripes*.72);
        col = mix(col, vec3(1.0,.87,.64), pow(fres,2.0)*.7);
        col = mix(col, vec3(.98,.92,.77), rimGlow*.55);
        float flecks = smoothstep(.58,.75,vnoise(vec2(ang*7.0, vRim*18.0)+uTime*.03));
        col = mix(col, vec3(.59,.2,.1), flecks*.35);
        alpha += stripes*.1 + rimGlow*.08;
      }
      vec3 H = normalize(normalize(vec3(-.4,.75,-.3))+V);
      float gloss = pow(max(dot(N,H),0.0), 30.0)*uSunStrength;
      col += vec3(1.0,.93,.75)*gloss*.28;
      col += vec3(.1,.13,.12)*fres*0.3;
      alpha = clamp(alpha,0.13,0.9)+gloss*.18;
      gl_FragColor = vec4(col,alpha);
    }
  `;

  function makeGonadGeometry(spec) {
  let meshes = [];
  const radius = spec.bellR * 0.52;
    const positions = [], normals = [];
    for (let i = 0; i < 4; i++) {
      const angle = i / 4 * TAU + Math.PI / 4;
      const torus = new THREE.TorusGeometry(spec.bellR * 0.13, spec.bellR * 0.038, 7, 17, Math.PI * 1.24);
      torus.rotateX(-Math.PI / 2);
      torus.rotateY(angle + Math.PI / 2);
      torus.translate(Math.cos(angle) * radius, spec.bellH * 0.38, Math.sin(angle) * radius);
      const p = torus.attributes.position, n = torus.attributes.normal;
      const idx = torus.index;
      for (let k = 0; idx && k < idx.count; k++) {
        const vi = idx.getX(k);
        positions.push(p.getX(vi), p.getY(vi), p.getZ(vi));
        normals.push(n.getX(vi), n.getY(vi), n.getZ(vi));
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
    return g;
  }

  function makeCanalGeometry(spec) {
    const pos = [];
    const segments = 8;
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * TAU + 0.12;
      let prev = new THREE.Vector3(0, spec.bellH * 0.2, 0);
      for (let j = 1; j <= 12; j++) {
        const t = j / 12;
        const rr = spec.bellR * 0.91 * t;
        const y = (spec.bellH * (Math.cos(t * Math.PI * .5) * .8)) + 0.015;
        const cur = new THREE.Vector3(Math.cos(a + Math.sin(t * 6) * 0.04) * rr, y, Math.sin(a + Math.sin(t * 6) * 0.04) * rr);
        pos.push(prev.x, prev.y, prev.z, cur.x, cur.y, cur.z);
        prev = cur;
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    return g;
  }

  function makeTentacleGeometry(spec) {
    const isNettle = spec.key === 'nettle';
    const ribbons = [];
    if (isNettle) {
      for (let i = 0; i < 10; i++) {
        const a = i / 10 * TAU + sr(-.07, .07);
        ribbons.push({
          angle: a, len: sr(2.7, 4.45), width: sr(.055, .095), kind: 0,
          seed: sr(0, 1), color: new THREE.Color().setHSL(sr(.075, .11), sr(.34, .56), sr(.68, .82))
        });
      }
      for (let i = 0; i < 4; i++) {
        const a = i / 4 * TAU + Math.PI / 4 + sr(-.1, .1);
        ribbons.push({
          angle: a, len: sr(2.2, 3.35), width: sr(.22, .34), kind: 1,
          seed: sr(0, 1), color: new THREE.Color().setHSL(sr(.1, .13), sr(.24, .38), sr(.80, .9))
        });
      }
    } else {
      for (let i = 0; i < 38; i++) {
        const a = i / 38 * TAU + sr(-.045, .045);
        ribbons.push({
          angle: a, len: sr(.62, 1.22), width: sr(.026, .052), kind: 0,
          seed: sr(0, 1), color: new THREE.Color().setHSL(sr(.87, .95), sr(.24, .4), sr(.78, .9))
        });
      }
    }
    const positions = [], aT = [], aSide = [], aSeed = [], aWidth = [], aLen = [], aKind = [], aColor = [];
    const indices = [];
    const segs = 14;
    ribbons.forEach((r) => {
      const vertStart = positions.length / 3;
      const rimX = Math.cos(r.angle) * spec.bellR * 0.93;
      const rimZ = Math.sin(r.angle) * spec.bellR * 0.93;
      for (let i = 0; i <= segs; i++) {
        const t = i / segs;
        for (let side = -1; side <= 1; side += 2) {
          positions.push(rimX, -spec.bellH * 0.085, rimZ);
          aT.push(t); aSide.push(side); aSeed.push(r.seed);
          aWidth.push(r.width); aLen.push(r.len); aKind.push(r.kind);
          aColor.push(r.color.r, r.color.g, r.color.b);
        }
      }
      for (let i = 0; i < segs; i++) {
        const a = vertStart + i * 2;
        indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
      }
    });
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    g.setAttribute('aT', new THREE.Float32BufferAttribute(aT, 1));
    g.setAttribute('aSide', new THREE.Float32BufferAttribute(aSide, 1));
    g.setAttribute('aSeed', new THREE.Float32BufferAttribute(aSeed, 1));
    g.setAttribute('aWidth', new THREE.Float32BufferAttribute(aWidth, 1));
    g.setAttribute('aLen', new THREE.Float32BufferAttribute(aLen, 1));
    g.setAttribute('aKind', new THREE.Float32BufferAttribute(aKind, 1));
    g.setAttribute('aColor', new THREE.Float32BufferAttribute(aColor, 3));
    g.setIndex(indices);
    return { geometry: g, ribbons };
  }

  const TENTACLE_VERT = `
    varying vec2 vUv;
    varying vec3 vColor;
    varying float vKind;
    varying float vSeed;
    varying float vT;
    uniform float uTime, uHeld, uStreamStrength;
    uniform vec2 uStream;
    attribute float aT, aSide, aSeed, aWidth, aLen, aKind;
    attribute vec3 aColor;
    void main(){
      float t = aT;
      vec2 radial = normalize(position.xz + vec2(0.0001));
      vec3 center = position;
      center.xz += radial * (0.06 + aWidth*1.3) * sin(t*3.14159*.62);
      center.xz += radial * aLen * t * (aKind > .5 ? 0.16 : 0.30) * (0.65 + clamp(uStreamStrength, 0.0, 1.0)*.55);
      center.y -= (aKind > .5 ? 0.82 : 1.0) * t * aLen;
      float trailing = clamp(uStreamStrength, 0.0, 1.0) * (1.0 - uHeld*0.94);
      center.xz += uStream * (t*t) * aLen * (aKind > .5 ? 0.5 : 0.44) * trailing;
      float sway = 1.0 - uHeld*0.76;
      center.x += sin(uTime*1.38 + aSeed*6.28 + t*3.7) * (0.026 + t*0.1) * sway;
      center.z += cos(uTime*1.12 + aSeed*4.7 + t*3.0) * (0.026 + t*0.09) * sway;
      center.y += sin(uTime*.9 + aSeed*9.0 + t*3.4) * 0.05 * t * (1.0-uHeld*.5);
      vec4 world = modelMatrix * vec4(center,1.0);
      vec3 camRight = normalize(vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]));
      float w = aWidth * (1.0 - t*.56);
      if(aKind > 0.5){ w *= (1.0 + 0.32*sin(t*27.0+aSeed*13.0)); }
      world.xyz += camRight * aSide * w * .5;
      gl_Position = projectionMatrix * viewMatrix * world;
      vUv = vec2(aSide*.5+.5, t);
      vColor = aColor;
      vKind = aKind;
      vSeed = aSeed;
      vT = t;
    }
  `;

  const TENTACLE_FRAG = `
    precision highp float;
    varying vec2 vUv;
    varying vec3 vColor;
    varying float vKind;
    varying float vSeed;
    varying float vT;
    void main(){
      float edge = smoothstep(0.0, 0.24, min(vUv.x, 1.0-vUv.x));
      float alpha = edge * 0.94;
      vec3 col = vColor;
      if(vKind > 0.5){
        float frill = 0.5 + 0.5*sin(vT*53.0 + vSeed*17.0) * sin(vT*21.0 - vSeed*8.0);
        alpha *= (0.36 + 0.34*frill) * (0.65 + 0.35*smoothstep(0.0,0.4,vT));
        col = mix(col, vec3(1.0,0.965,0.85), 0.34 + 0.24*frill);
        col += vec3(0.07,0.025,0.0)*smoothstep(0.3,1.0,vT);
      } else {
        alpha *= (0.72 + 0.28*(1.0-vT));
        float bands = 0.5+0.5*sin(vT*48.0 + vSeed*20.0);
        alpha *= 0.78 + 0.22*bands;
        col *= 0.94 + 0.1*bands;
      }
      if(alpha < 0.035) discard;
      gl_FragColor = vec4(col, alpha);
    }
  `;

  function makeBellMaterial(spec, jelly) {
    return new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 }, uPulse: { value: 0 }, uBellR: { value: spec.bellR },
        uKind: { value: spec.key === 'nettle' ? 1 : 0 },
        uTintA: { value: spec.tintA.clone() }, uTintB: { value: spec.tintB.clone() },
        uSunStrength: { value: 1.0 }
      },
      vertexShader: JELLY_BELL_VERT,
      fragmentShader: JELLY_BELL_FRAG,
      transparent: true,
      depthWrite: true,
      side: THREE.DoubleSide
    });
  }

  function makeTentacleMaterial(jelly) {
    return new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 }, uHeld: { value: 0 },
        uStream: { value: new THREE.Vector2(0, 0) }, uStreamStrength: { value: 0 }
      },
      vertexShader: TENTACLE_VERT,
      fragmentShader: TENTACLE_FRAG,
      transparent: true,
      depthWrite: true,
      side: THREE.DoubleSide
    });
  }

  function buildJellyMeshes(spec) {
    if (!jellyShared[spec.key]) {
      const bellGeo = makeBellGeometry(spec);
      const tent = makeTentacleGeometry(spec);
      const shared = { bellGeo, tentGeo: tent.geometry, ribbons: tent.ribbons };
      if (spec.key === 'moon') {
        shared.gonadGeo = makeGonadGeometry(spec);
        shared.canalGeo = makeCanalGeometry(spec);
        shared.gonadMat = new THREE.MeshBasicMaterial({ color: 0xf5a7c3, transparent: true, opacity: 0.88, depthWrite: false, depthTest: false, side: THREE.DoubleSide });
        shared.canalMat = new THREE.LineBasicMaterial({ color: 0xecfff8, transparent: true, opacity: 0.52, depthWrite: false, depthTest: false });
      }
      jellyShared[spec.key] = shared;
    }
    const sh = jellyShared[spec.key];
    const group = new THREE.Group();
    const bellMat = makeBellMaterial(spec);
    const bell = new THREE.Mesh(sh.bellGeo, bellMat);
    bell.renderOrder = 4;
    bell.frustumCulled = false;
    group.add(bell);
    let extras = null;
    if (spec.key === 'moon') {
      const gonads = new THREE.Mesh(sh.gonadGeo, sh.gonadMat);
      gonads.renderOrder = 7;
      gonads.frustumCulled = false;
      group.add(gonads);
      const canals = new THREE.LineSegments(sh.canalGeo, sh.canalMat);
      canals.renderOrder = 6;
      canals.frustumCulled = false;
      group.add(canals);
      extras = { gonads, canals };
    }
    const tentMat = makeTentacleMaterial();
    const tentMesh = new THREE.Mesh(sh.tentGeo, tentMat);
    tentMesh.renderOrder = 2;
    tentMesh.frustumCulled = false;
    group.add(tentMesh);
    const haloMat = new THREE.SpriteMaterial({
      map: getJellyGlowTexture(), color: spec.key === 'nettle' ? 0xf7be76 : 0xcbeee7,
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
      opacity: spec.key === 'nettle' ? .24 : .16
    });
    const halo = new THREE.Sprite(haloMat);
    halo.scale.set(spec.bellR * 4.0, spec.bellR * 4.0, 1);
    halo.position.y = spec.bellH * .25;
    halo.renderOrder = 1;
    group.add(halo);
    return { group, bell, bellMat, tentMesh, tentMat, extras, ribbons: sh.ribbons, halo, haloMat };
  }

  function makeJellyModel(kind) {
    const spec = JELLY_SPECS[kind];
    const meshes = buildJellyMeshes(spec);
    return { spec, ...meshes, uniforms: { bell: meshes.bellMat.uniforms, tent: meshes.tentMat.uniforms } };
  }

  class Jelly {
    constructor(kind, x, z, opts = {}) {
      this.kind = kind;
      this.spec = JELLY_SPECS[kind];
      const model = makeJellyModel(kind);
      this.model = model;
      this.group = model.group;
      this.bell = model.bell;
      this.bellMat = model.bellMat;
      this.tentMat = model.tentMat;
      this.extras = model.extras;
      this.pos = new THREE.Vector3(x, opts.y !== undefined ? opts.y : this.spec.baseDepth, z);
      this.vel = new THREE.Vector3();
      this.scale = opts.scale || rand(0.85, 1.18);
      this.pulse = 0;
      this.phase = rand(0, 1);
      this.basePhase = this.phase;
      this.mode = opts.held ? 'held' : (opts.mode || 'drift');
      this.modeTime = 0;
      this.age = 0;
      this.axis = new THREE.Vector3(0, 1, 0);
      this.heading = rand(0, TAU);
      this.headingTimer = rand(1, 4);
      this.homeDepth = opts.y !== undefined ? opts.y : this.spec.baseDepth + rand(-0.7, 0.7);
      this.heldTarget = new THREE.Vector3();
      this.dripTimer = rand(0.3, 1.0);
      this.wanderPhase = rand(0, TAU);
      this.lastY = this.pos.y;
      this.throwState = null;
      this.group.position.copy(this.pos);
      this.group.scale.setScalar(this.scale);
      scene.add(this.group);
      allJellies.push(this);
    }
    setOverlay(on) {
      const target = on ? overlayScene : scene;
      if (this.group.parent !== target) target.add(this.group);
    }
    update(dt, t) {
      this.age += dt; this.modeTime += dt;
      const spec = this.spec;
      const period = spec.period;
      let ph = ((t / period) + this.phase) % 1;
      const contract = ph < 0.23 ? smoothstep(0.0, 0.20, ph) : 1.0 - smoothstep(0.23, 0.94, ph);
      this.pulse = contract;
      const held = this.mode === 'held';
      const inAir = held || this.mode === 'thrown' || this.mode === 'falling';
      this.bellMat.uniforms.uTime.value = t;
      this.bellMat.uniforms.uPulse.value = contract;
      this.tentMat.uniforms.uTime.value = t;
      this.tentMat.uniforms.uHeld.value = inAir ? 1 : 0;

      if (held) {
        this.pos.lerp(this.heldTarget, 1 - Math.exp(-dt * 8));
        this.axis.lerp(new THREE.Vector3(0.05, 1, 0.02), 1 - Math.exp(-dt * 3));
        this.axis.normalize();
        this.vel.set(0, 0, 0);
        this.dripTimer -= dt;
        if (this.dripTimer < 0) {
          this.dripTimer = rand(0.12, 0.32);
          if (this.kind === 'nettle' && this.group.parent === overlayScene) {
            const a = rand(0, TAU);
            const len = rand(1.6, 2.5) * this.scale;
            const local = new THREE.Vector3(Math.cos(a) * spec.bellR * 0.8, -len, Math.sin(a) * spec.bellR * 0.8);
            local.applyQuaternion(this.group.quaternion);
            local.add(this.pos);
            if (local.y > 0.15) fx.drip && fx.drip(local.x, local.y + 0.1, local.z, 0.7);
          }
        }
      } else if (this.mode === 'thrown') {
        const th = this.throwState;
        th.t += dt / th.duration;
        const p = clamp(th.t, 0, 1), inv = 1 - p;
        this.pos.x = inv * inv * th.start.x + 2 * inv * p * th.mid.x + p * p * th.to.x;
        this.pos.z = inv * inv * th.start.z + 2 * inv * p * th.mid.z + p * p * th.to.z;
        this.pos.y = inv * inv * th.start.y + 2 * inv * p * th.mid.y + p * p * th.to.y;
        this.axis.set(0.1, 1, 0.1).normalize();
        if (this.lastY > 0 && this.pos.y <= 0) {
          fx.splash(this.pos.x, this.pos.z, 1.05, 0.55);
          fx.ripple(this.pos.x, this.pos.z, .8, .55);
          this.setOverlay(false);
        }
        this.lastY = this.pos.y;
        if (p >= 1) {
          this.mode = 'drift'; this.modeTime = 0;
          this.vel.set(rand(-.2, .2), -.15, rand(-.2, .2));
          this.homeDepth = this.pos.y < 0 ? this.pos.y : -2;
          this.setOverlay(false);
        }
      } else if (this.mode === 'falling') {
        this.vel.y -= 6.7 * dt;
        this.pos.addScaledVector(this.vel, dt);
        this.axis.set(0.07, 1, 0.02).normalize();
        const hitWater = this.lastY > 0 && this.pos.y <= 0;
        const ground = terrainHeight(this.pos.x, this.pos.z);
        if (hitWater) {
          fx.splash(this.pos.x, this.pos.z, 1.15, 0.62);
          fx.ripple(this.pos.x, this.pos.z, .8, .5);
          this.pos.y = -0.7;
          this.vel.set(0, 0, 0);
          this.mode = 'drift'; this.modeTime = 0; this.homeDepth = -2;
          this.setOverlay(false);
        } else if (ground > 0.03 && this.pos.y <= ground + spec.bellH * this.scale + .18) {
          this.pos.y = ground + spec.bellH * this.scale + .16;
          this.vel.set(0, 0, 0);
          this.mode = 'beached'; this.modeTime = 0;
          this.setOverlay(true);
          fx.silt(this.pos.x, this.pos.z, .65);
          if (fxAudio.splash) fxAudio.splash(.5, .25);
        }
        this.lastY = this.pos.y;
      } else if (this.mode === 'beached') {
        const ground = terrainHeight(this.pos.x, this.pos.z);
        this.pos.y = ground + spec.bellH * this.scale + .16;
        this.axis.set(0.05, 1, 0.02).normalize();
        this.vel.set(0, 0, 0);
        if (this.modeTime > 2.2) {
          const ang = Math.atan2(this.pos.x - beach.cx, this.pos.z - beach.cz);
          const rr = shoreRadiusAt(this.pos.x, this.pos.z) + 2.4;
          this.pos.x = beach.cx + Math.sin(ang) * rr;
          this.pos.z = beach.cz + Math.cos(ang) * rr;
          this.pos.y = -0.8;
          this.mode = 'drift'; this.modeTime = 0; this.homeDepth = -2.1;
          this.setOverlay(false);
          fx.splash(this.pos.x, this.pos.z, 1.0, .55);
        }
        this.vel.set(0, 0, 0);
      } else {
        // drifting with the current and occasional pulse-induced thrust
        this.headingTimer -= dt;
        if (this.headingTimer < 0) {
          this.headingTimer = rand(2.0, 5.5);
          this.heading = rand(0, TAU);
        }
        const curX = 0.16 * Math.sin(t * .08 + this.wanderPhase * 1.7 + this.pos.z * .06) + 0.09 * Math.sin(t * .143 + this.pos.x * .08);
        const curZ = 0.15 * Math.cos(t * .071 + this.wanderPhase + this.pos.x * .07) + 0.07 * Math.cos(t * .12 + this.pos.z * .1);
        const q = shoreQ(this.pos.x, this.pos.z);
        let ax = Math.sin(this.heading + Math.sin(t * .22 + this.wanderPhase) * .6);
        let az = Math.cos(this.heading + Math.sin(t * .22 + this.wanderPhase) * .6);
        if (q < 2.1) {
          const outward = Math.atan2(this.pos.x - beach.cx, this.pos.z - beach.cz);
          ax = Math.sin(outward); az = Math.cos(outward);
        }
        if (!insideView(this.pos.x, this.pos.z, 1.6)) {
          const inward = Math.atan2(-this.pos.x, -this.pos.z);
          ax = Math.sin(inward); az = Math.cos(inward);
        }
        // pulse thrust: a firm shove when the bell reaches its contracted apex
        const prevPh = ((t - dt) / period + this.phase) % 1;
        let kick = 0;
        if (prevPh < 0.23 && ph >= 0.23) kick = 0.48 + 0.2 * Math.sin(this.wanderPhase);
        const desiredAxis = new THREE.Vector3(ax * 0.44 + curX * 0.13, 1, az * 0.44 + curZ * 0.13).normalize();
        this.axis.lerp(desiredAxis, 1 - Math.exp(-dt * .7)).normalize();
        if (kick) {
          this.vel.x += this.axis.x * kick;
          this.vel.z += this.axis.z * kick;
          this.vel.y += this.axis.y * kick * 0.45;
        }
        // ocean current and gentle depth keeping
        this.vel.x += (curX + ax * 0.11) * dt;
        this.vel.z += (curZ + az * 0.11) * dt;
        this.vel.x *= Math.exp(-dt * 0.6);
        this.vel.z *= Math.exp(-dt * 0.6);
        this.vel.y *= Math.exp(-dt * 0.8);
        const depthForce = (this.homeDepth - this.pos.y) * 0.8;
        this.vel.y += depthForce * dt;
        if (whirl.strength > 0.02) {
          const dx = whirl.center.x - this.pos.x;
          const dz = whirl.center.z - this.pos.z;
          const dist = Math.hypot(dx, dz);
          if (dist < 14) {
            const pull = whirl.strength * (1 - dist / 14);
            this.vel.x += (dx / Math.max(.1, dist) * .8 - dz / Math.max(.1, dist) * 1.2) * pull * dt;
            this.vel.z += (dz / Math.max(.1, dist) * .8 + dx / Math.max(.1, dist) * 1.2) * pull * dt;
            this.vel.y += Math.sin(t * 1.2 + this.phase) * pull * .04;
          }
        }
        this.pos.x += this.vel.x * dt + curX * dt * 0.06;
        this.pos.z += this.vel.z * dt + curZ * dt * 0.06;
        this.pos.y += this.vel.y * dt;
        this.pos.y = clamp(this.pos.y, -6.5, -0.5);
        // keep a loose leash on the water column
        if (this.pos.y > -0.8) this.vel.y -= 0.5 * dt;
      }

      // orient the bell along its swimming axis
      if (!held && this.mode !== 'thrown') this.axis.y = Math.max(this.axis.y, 0.45);
      this.axis.normalize();
      const targetQuat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), this.axis);
      this.group.quaternion.slerp(targetQuat, 1 - Math.exp(-dt * 2.4));
      this.group.position.copy(this.pos);
      this.group.scale.setScalar(this.scale * (1 + this.pulse * 0.012));
      // stream direction, expressed in the bell's local space
      const localVel = new THREE.Vector3(this.vel.x, 0, this.vel.z).applyQuaternion(this.group.quaternion.clone().invert());
        const len = Math.hypot(localVel.x, localVel.z);
        this.tentMat.uniforms.uStreamStrength.value = clamp(
          lerp(
            clamp(this.tentMat.uniforms.uStreamStrength.value, 0, 1),
            inAir ? 0 : clamp(len * 1.7 + 0.35, .2, 1),
            1 - Math.exp(-Math.max(0, dt) * 2)
          ), 0, 1);
        if (len > 0.001 && !inAir) {
          this.tentMat.uniforms.uStream.value.set(-localVel.x / len, -localVel.z / len);
        }
    }
  }

  function spawnJelly(kind, x, z, opts = {}) {
    if (allRays.length + allJellies.length >= creatureCap) return null;
    const j = new Jelly(kind, x, z, opts);
    updateCreatureCounter();
    return j;
  }

  function jellySpawnInitial() {
    const spots = [
      ['moon', 0.59, 0.31, -2.0, 1.18],
      ['moon', 0.80, 0.48, -2.8, 1.32],
      ['moon', 0.47, 0.68, -3.4, 1.02],
      ['nettle', 0.67, 0.53, -3.0, 1.25],
      ['nettle', 0.38, 0.48, -2.6, 1.12]
    ];
    for (const [kind, u, v, y, sc] of spots) {
      const p = stageWorld(u, v);
      spawnJelly(kind, p.x, p.z, { y, scale: sc });
    }
    updateCreatureCounter();
  }

  function scareJelliesAt(x, z, radius = 5) {
    for (const j of allJellies) {
      const d = Math.hypot(j.pos.x - x, j.pos.z - z);
      if (d < radius) {
        const ang = Math.atan2(j.pos.x - x, j.pos.z - z);
        j.heading = ang;
        j.vel.x += Math.sin(ang) * 0.7;
        j.vel.z += Math.cos(ang) * 0.7;
        j.phase = (j.phase + 0.22) % 1;
      }
    }
  }

  // --------------------------------------------------------------- sea surface effects
  class OceanFX {
    constructor() {
      this.capacity = 420;
      this.particles = [];
      this.posArr = new Float32Array(this.capacity * 3);
      this.colArr = new Float32Array(this.capacity * 3);
      this.sizeArr = new Float32Array(this.capacity);
      this.alphaArr = new Float32Array(this.capacity);
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(this.posArr, 3).setUsage(THREE.DynamicDrawUsage));
      g.setAttribute('aColor', new THREE.BufferAttribute(this.colArr, 3).setUsage(THREE.DynamicDrawUsage));
      g.setAttribute('aSize', new THREE.BufferAttribute(this.sizeArr, 1).setUsage(THREE.DynamicDrawUsage));
      g.setAttribute('aAlpha', new THREE.BufferAttribute(this.alphaArr, 1).setUsage(THREE.DynamicDrawUsage));
      this.geometry = g;
      this.material = new THREE.ShaderMaterial({
        uniforms: { uPixelScale: { value: 30 } },
        vertexShader: `
          attribute vec3 aColor;
          attribute float aSize;
          attribute float aAlpha;
          varying vec3 vColor;
          varying float vAlpha;
          uniform float uPixelScale;
          void main(){
            vColor=aColor; vAlpha=aAlpha;
            vec4 mv = modelViewMatrix * vec4(position,1.0);
            gl_Position = projectionMatrix * mv;
            gl_PointSize = clamp(aSize * uPixelScale, 1.0, 64.0);
          }
        `,
        fragmentShader: `
          precision highp float;
          varying vec3 vColor;
          varying float vAlpha;
          void main(){
            vec2 p = gl_PointCoord*2.0-1.0;
            float r = length(p);
            if(r>1.0) discard;
            float a = smoothstep(1.0,.12,r);
            float core = smoothstep(.75,.0,r);
            vec3 c = vColor + core*0.12;
            gl_FragColor = vec4(c, a*vAlpha);
          }
        `,
        transparent: true,
        depthWrite: true,
        depthTest: true
      });
      this.points = new THREE.Points(g, this.material);
      this.points.frustumCulled = false;
      this.points.renderOrder = 8;
      scene.add(this.points);

      const rg = new THREE.PlaneGeometry(1, 1);
      rg.rotateX(-Math.PI / 2);
      this.maxRings = 90;
      this.ringGeo = rg;
      this.ringMat = new THREE.ShaderMaterial({
        uniforms: {},
        vertexShader: `
          varying vec2 vUv;
          varying float vAlpha;
          varying float vSeed;
          attribute float aAlpha;
          attribute float aSeed;
          void main(){
            vUv = uv; vAlpha = aAlpha; vSeed = aSeed;
            #ifdef USE_INSTANCING
              vec4 p = instanceMatrix * vec4(position, 1.0);
            #else
              vec4 p = vec4(position, 1.0);
            #endif
            gl_Position = projectionMatrix * modelViewMatrix * p;
          }
        `,
        fragmentShader: `
          precision highp float;
          varying vec2 vUv;
          varying float vAlpha;
          varying float vSeed;
          void main(){
            vec2 p = vUv*2.0-1.0;
            float r = length(p);
            float ang = atan(p.y,p.x);
            if(r>1.0) discard;
            float seg = .56 + .44*sin(ang*13.0+vSeed*31.0);
            float ringA = smoothstep(.055,.012,abs(r-.82)*(1.0+.1*seg)) * seg;
            float ringB = smoothstep(.042,.009,abs(r-.58)*1.14) * (.35+.65*seg);
            float ringC = smoothstep(.05,.013,abs(r-.36)) * (.18+.4*seg);
            float foam = (ringA*.9 + ringB*.7 + ringC*.4);
            foam *= (smoothstep(.32,.78, sin(ang*7.0 + vSeed*21.0 + r*8.0)*.5+.5) * .45 + .55);
            if(foam*vAlpha < .025) discard;
            gl_FragColor = vec4(vec3(.97,1.0,.95), foam*vAlpha*1.15);
          }
        `,
        transparent: true, depthWrite: true, depthTest: true, side: THREE.DoubleSide
      });
      this.ringAlpha = new THREE.InstancedBufferAttribute(new Float32Array(this.maxRings), 1);
      this.ringSeed = new THREE.InstancedBufferAttribute(new Float32Array(this.maxRings), 1);
      this.ringGeo.setAttribute('aAlpha', this.ringAlpha);
      this.ringGeo.setAttribute('aSeed', this.ringSeed);
      this.ringsMesh = new THREE.InstancedMesh(this.ringGeo, this.ringMat, this.maxRings);
      this.ringsMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      this.ringsMesh.frustumCulled = false;
      this.ringsMesh.count = 0;
      this.ringsMesh.renderOrder = 9;
      scene.add(this.ringsMesh);
      this.rings = [];
      this.ringDummy = new THREE.Object3D();
    }
    setPixelScale(px) { this.material.uniforms.uPixelScale.value = px; }
    addParticle(x, y, z, vx, vy, vz, life, size, color, gravity, drag, kind) {
      if (this.particles.length >= this.capacity) this.particles.shift();
      this.particles.push({
        x, y, z, vx, vy, vz, life, maxLife: life, size, color,
        gravity: gravity === undefined ? -5.2 : gravity,
        drag: drag === undefined ? 0.2 : drag, kind: kind || 0
      });
    }
    splash(x, z, scale = 1, force = 0.7) {
      const color = new THREE.Color(0.78, 0.96, 0.95);
      const count = Math.round(14 * scale);
      for (let i = 0; i < count; i++) {
        const a = rand(0, TAU), sp = rand(0.35, 2.2) * scale;
        this.addParticle(x + rand(-.18, .18) * scale, rand(.02, .14), z + rand(-.18, .18) * scale,
          Math.cos(a) * sp, rand(1.2, 3.8) * scale * force, Math.sin(a) * sp,
          rand(.45, 1.2), rand(.055, .16) * Math.min(1.5, scale), color, -7.2, .2, 1);
      }
      this.addRing(x, z, rand(1.0, 1.8) * scale, rand(.65, 1.0) * force);
      if (scale > 1.2) this.addRing(x, z, rand(2.0, 2.8) * scale, .42);
      addImpulseWorld(x, z, 0.027 * scale, 0.026 * force);
      scareRaysAt(x, z, 4.2 * scale, force);
      if (fxAudio.splash) fxAudio.splash(clamp(scale, .5, 2.2), force);
    }
    silt(x, z, scale = 1) {
      const gy = terrainHeight(x, z) + 0.16;
      for (let i = 0; i < 14; i++) {
        const a = rand(0, TAU), sp = rand(.15, .75) * scale;
        this.addParticle(x + rand(-.25, .25), gy + rand(0, .12), z + rand(-.25, .25),
          Math.cos(a) * sp, rand(.06, .5), Math.sin(a) * sp,
          rand(1.3, 3.2), rand(.20, .65) * scale,
          new THREE.Color(0.62, 0.57, 0.42), -0.12, .22, 2);
      }
    }
    drip(x, y, z, scale = 1) {
      this.addParticle(x, y, z, rand(-.025, .025), rand(-.2, -.05), rand(-.025, .025),
        rand(1.4, 2.5), rand(.026, .06) * scale, new THREE.Color(0.82, 0.95, 0.91), -9.8, .02, 3);
    }
    wake(x, z, scale, heading, key) {
      const color = new THREE.Color(0.78, 0.96, 0.91);
      for (let i = 0; i < 2; i++) {
        this.addParticle(x + rand(-.35, .35) * scale, 0.045, z + rand(-.35, .35) * scale,
          rand(-.2, .2), rand(.015, .12), rand(-.2, .2),
          rand(1.0, 2.2), rand(.12, .31) * scale, color, .02, .12, 4);
      }
      if (Math.random() < (key === 'stingray' ? .1 : .25)) this.addRing(x, z, rand(.4, .8) * scale, .2);
    }
    addRing(x, z, maxRadius, strength) {
      if (this.rings.length >= this.maxRings) this.rings.shift();
      this.rings.push({ x, z, age: 0, life: rand(1.2, 2.3), maxR: maxRadius, strength, seed: rand(0, 1) });
    }
    ripple(x, z, radius = 1, strength = 0.5) {
      addImpulseWorld(x, z, Math.max(0.008, radius * 0.032), strength * 0.034);
      if (strength > 0.3) this.addRing(x, z, radius * 1.1, strength * .7);
    }
    update(dt) {
      let n = 0;
      for (let i = this.particles.length - 1; i >= 0; i--) {
        const p = this.particles[i];
        p.life -= dt;
        if (p.life <= 0) { this.particles.splice(i, 1); continue; }
        const lastY = p.y;
        p.vy += p.gravity * dt;
        p.vx *= 1 - p.drag * dt;
        p.vz *= 1 - p.drag * dt;
        p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
        if (p.kind === 3 && lastY > 0.04 && p.y <= 0.04) {
          this.addRing(p.x, p.z, .55, .55);
          addImpulseWorld(p.x, p.z, .009, .004);
          if (fxAudio.plink) fxAudio.plink(rand(900, 1700), .028);
          p.life = 0;
          continue;
        }
        if (p.y < -0.22 && p.kind === 2) { p.vy *= .7; p.vx *= .8; p.vz *= .8; }
        const t = p.life / p.maxLife;
        this.posArr[n * 3] = p.x; this.posArr[n * 3 + 1] = p.y; this.posArr[n * 3 + 2] = p.z;
        this.colArr[n * 3] = p.color.r; this.colArr[n * 3 + 1] = p.color.g; this.colArr[n * 3 + 2] = p.color.b;
        this.sizeArr[n] = p.size * (p.kind === 2 ? (1.7 - t * 0.7) : (0.65 + 0.35 * t));
        this.alphaArr[n] = (p.kind === 2 ? .24 : .64) * smoothstep(0, .16, t) * smoothstep(0, .55, Math.min(t, 1)) * (p.kind === 2 ? 1 : t * .5 + .5);
        n++;
      }
      this.geometry.setDrawRange(0, n);
      this.geometry.attributes.position.needsUpdate = true;
      this.geometry.attributes.aColor.needsUpdate = true;
      this.geometry.attributes.aSize.needsUpdate = true;
      this.geometry.attributes.aAlpha.needsUpdate = true;

      let rn = 0;
      for (let i = this.rings.length - 1; i >= 0; i--) {
        const r = this.rings[i];
        r.age += dt;
        if (r.age >= r.life) { this.rings.splice(i, 1); continue; }
        const t = r.age / r.life;
        const scale = lerp(0.4, r.maxR, 1 - Math.pow(1 - t, 2.2));
        this.ringDummy.position.set(r.x, 0.045, r.z);
        this.ringDummy.rotation.set(0, r.seed * TAU, 0);
        this.ringDummy.scale.set(scale * 2, 1, scale * 2);
        this.ringDummy.updateMatrix();
        this.ringsMesh.setMatrixAt(rn, this.ringDummy.matrix);
        this.ringAlpha.array[rn] = (1 - t) * r.strength * .72;
        this.ringSeed.array[rn] = r.seed;
        rn++;
      }
      this.ringsMesh.count = rn;
      this.ringsMesh.instanceMatrix.needsUpdate = true;
      this.ringAlpha.needsUpdate = true;
      this.ringSeed.needsUpdate = true;
    }
  }

  const fxAudio = { plink: null, splash: null };
  fx = new OceanFX();
  fx.setAudioHooks = (hooks) => { Object.assign(fxAudio, hooks); };

  // Droplets that fall from a held jellyfish live in the overlay scene so that
  // they stay crisp against the water pass below.
  class OverlayDrips {
    constructor() {
      this.items = [];
      this.max = 48;
      this.pos = new Float32Array(this.max * 3);
      this.size = new Float32Array(this.max);
      this.alpha = new Float32Array(this.max);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
      geo.setAttribute('aSize', new THREE.BufferAttribute(this.size, 1).setUsage(THREE.DynamicDrawUsage));
      geo.setAttribute('aAlpha', new THREE.BufferAttribute(this.alpha, 1).setUsage(THREE.DynamicDrawUsage));
      this.geo = geo;
      this.mat = new THREE.ShaderMaterial({
        uniforms: { uPixelScale: { value: 32 } },
        vertexShader: `
          attribute float aSize; attribute float aAlpha;
          varying float vAlpha; uniform float uPixelScale;
          void main(){
            vAlpha = aAlpha;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
            gl_PointSize = clamp(aSize*uPixelScale, 1.0, 24.0);
          }
        `,
        fragmentShader: `
          precision highp float; varying float vAlpha;
          void main(){
            vec2 p = gl_PointCoord*2.0-1.0;
            float r=length(p);
            if(r>1.0) discard;
            float a = smoothstep(1.0,.12,r);
            gl_FragColor=vec4(vec3(.83,.98,.95), a*vAlpha);
          }
        `,
        transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false
      });
      this.points = new THREE.Points(geo, this.mat);
      this.points.frustumCulled = false;
      overlayScene.add(this.points);
    }
    setPixelScale(v) { this.mat.uniforms.uPixelScale.value = v; }
    spawn(x, y, z, scale) {
      if (this.items.length >= this.max) this.items.shift();
      this.items.push({ x: x + rand(-.05, .05), y: y + rand(-.05, .05), z: z + rand(-.05, .05), vy: rand(-.8, -.25), life: rand(1.2, 2.2), maxLife: 2.2, size: rand(.10, .21) * scale });
    }
    update(dt) {
      let n = 0;
      for (let i = this.items.length - 1; i >= 0; i--) {
        const p = this.items[i];
        p.vy -= 7.2 * dt; p.y += p.vy * dt; p.life -= dt;
        if (p.y <= 0.04) {
          fx.addRing(p.x, p.z, .55, .5);
          if (fxAudio.plink) fxAudio.plink(rand(1000, 1900), 0.02);
          this.items.splice(i, 1); continue;
        }
        if (p.life <= 0) { this.items.splice(i, 1); continue; }
        this.pos[n * 3] = p.x; this.pos[n * 3 + 1] = p.y; this.pos[n * 3 + 2] = p.z;
        this.size[n] = p.size;
        this.alpha[n] = clamp(p.life / .55, 0, 1) * .92;
        n++;
      }
      this.geo.setDrawRange(0, n);
      this.geo.attributes.position.needsUpdate = true;
      this.geo.attributes.aSize.needsUpdate = true;
      this.geo.attributes.aAlpha.needsUpdate = true;
    }
  }
  const overlayDrips = new OverlayDrips();
  fx.drip = (x, y, z, scale = 1) => overlayDrips.spawn(x, y, z, scale);

  let rainOn = false, calmMode = false, clearMode = false, whirlOn = false;
  let soundOn = false, uiHidden = false;
  let swashLevel = 0.8, prevSwashLevel = 0.8, wetReach = 2.4;
  const whirl = {
    center: new THREE.Vector3(0, 0, 0),
    strength: 0,
    target: 0,
    dragging: false
  };
  let controlsReady = false;
  let toastTimer = 0;
  let allJellies = [];

  function updateCreatureCounter() {
    const rayCount = allRays.length;
    const jellyCount = allJellies.length;
    const total = rayCount + jellyCount;
    const rayEl = document.getElementById('ray-count');
    const jellyEl = document.getElementById('jelly-count');
    const totalEl = document.getElementById('total-count');
    if (rayEl) rayEl.textContent = rayCount;
    if (jellyEl) jellyEl.textContent = jellyCount;
    if (totalEl) totalEl.textContent = total;
    const cards = document.getElementById('cards');
    if (cards) {
      const full = total >= creatureCap;
      cards.querySelectorAll('.card').forEach((c) => {
        c.classList.toggle('full-disabled', full);
        c.disabled = full;
        c.setAttribute('aria-disabled', full ? 'true' : 'false');
      });
    }
  }

  function updateSwashState(dt) {
    prevSwashLevel = swashLevel;
    const period = calmMode ? 10.8 : 7.6;
    let p = ((elapsed + 0.9) / period) % 1;
    const rise = smoothstep(0.0, 0.20, p);
    const fall = 1.0 - smoothstep(0.23, 0.93, p);
    const tongue = Math.min(rise, fall);
    const strength = calmMode ? 0.52 : 1.0;
    swashLevel = 0.3 + (1.38 + 0.34 * Math.sin(elapsed * 0.19)) * tongue * strength;
    wetReach = Math.max(swashLevel, wetReach - dt * (0.11 + 0.07 * (1.0 - tongue)));
    if (wetReach > 2.6) wetReach = 2.6;
  }

  function updateWhirlUniforms(u) {
    if (!whirlOn) {
      whirl.target = 0;
    }
    whirl.strength = lerp(whirl.strength, whirl.target, 0.06);
    if (u) u.uWhirl.value.set(whirl.center.x, whirl.center.z, whirl.strength);
  }
  whirl.center.copy(new THREE.Vector3(stageWorld(0.68, 0.5).x, 0, stageWorld(0.68, 0.5).z));

  // --------------------------------------------------------------- interactions + controls
  let cardGesture = null;
  let rainAccumulator = 0;
  const canvasPointer = { down: false, moved: false };

  function totalCreatures() { return allRays.length + allJellies.length; }

  function showToast(text, duration = 2300) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), duration);
  }

  function setControlState(action, on) {
    const el = document.querySelector('.ctl[data-action="' + action + '"]');
    if (el) el.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

  function toggleUI(force) {
    uiHidden = force === undefined ? !uiHidden : !!force;
    const ui = document.getElementById('ui');
    if (ui) ui.classList.toggle('hidden', uiHidden);
    const btn = document.querySelector('.ctl[data-action="hide"]');
    if (btn) btn.setAttribute('aria-pressed', uiHidden ? 'true' : 'false');
    if (uiHidden) showToast('Interface hidden  ·  press H to bring it back', 1700);
  }

  function setRain(on) {
    rainOn = !!on;
    setControlState('rain', rainOn);
    showToast(rainOn ? 'Rain over the shallows' : 'The rain clears', 1500);
  }
  function setWhirl(on) {
    whirlOn = !!on;
    whirl.target = whirlOn ? 1 : 0;
    setControlState('whirl', whirlOn);
    document.body.classList.toggle('whirl-active', whirlOn);
    if (whirlOn) {
      whirl.center.set(stageWorld(0.68, 0.5).x, 0, stageWorld(0.68, 0.5).z);
      showToast('Whirlpool  ·  drag anywhere on the water to move it', 2600);
    } else {
      whirl.dragging = false;
      document.body.classList.remove('whirl-dragging');
    }
  }
  function setCalm(on) {
    calmMode = !!on;
    setControlState('calm', calmMode);
    showToast(calmMode ? 'The sea settles to a hush' : 'The swell returns', 1500);
  }
  function setClear(on) {
    clearMode = !!on;
    setControlState('clear', clearMode);
    showToast(clearMode ? 'Clear sea  ·  the reef reveals itself' : 'The water keeps its colour', 1500);
  }

  function cardKeyFromEl(el) { return el.dataset.species; }
  function isRayKey(key) { return key === 'manta' || key === 'eagle' || key === 'stingray'; }

  function chooseThrowTarget(key) {
    const isJelly = !isRayKey(key);
    for (let i = 0; i < 36; i++) {
      const u = rand(0.28, 0.82);
      const v = rand(0.22, isJelly ? 0.54 : 0.58);
      const p = stageWorld(u, v);
      if (shoreQ(p.x, p.z) < 2.2) continue;
      if (!insideView(p.x, p.z, 1.3)) continue;
      return new THREE.Vector3(p.x, isJelly ? -1.9 : -1.35, p.z);
    }
    const p = stageWorld(0.52, 0.4);
    return new THREE.Vector3(p.x, isJelly ? -1.9 : -1.35, p.z);
  }

  function makeArc(start, to) {
    const mid = start.clone().add(to).multiplyScalar(0.5);
    mid.y = Math.max(start.y, 2.0) + 4.4 + start.distanceTo(to) * 0.18;
    return { start: start.clone(), mid, to: to.clone(), t: 0, duration: clamp(0.82 + start.distanceTo(to) * 0.028, 0.95, 1.4) };
  }

  function spawnCardCreature(key, x, z, opts = {}) {
    if (totalCreatures() >= creatureCap) {
      showToast('The shallows are full — ' + creatureCap + ' creatures afloat', 2400);
      return null;
    }
    let creature = null;
    if (isRayKey(key)) {
      const sys = raySystems[key];
      if (!sys) return null;
      creature = sys.add(x, z, opts);
      if (creature) {
        creature.mode = opts.mode || 'swim';
        creature.heldTarget = new THREE.Vector3(x, opts.holdHeight || 2.8, z);
        creature.phase = rand(0, TAU);
        updateCreatureCounter();
      } else {
        showToast('That school is full for now', 1800);
      }
    } else {
      creature = spawnJelly(key, x, z, opts);
      if (creature) {
        creature.heldTarget = new THREE.Vector3(x, opts.holdHeight || 4.1, z);
        creature.phase = rand(0, 1);
      }
    }
    return creature;
  }

  function holdHeightFor(key) { return isRayKey(key) ? 2.9 : 4.15; }

  function beginCardDrag(gesture) {
    const key = gesture.key;
    const rect = gesture.card.getBoundingClientRect();
    const holdH = holdHeightFor(key);
    const p = screenToWorld(gesture.lastX, gesture.lastY, holdH);
    const creature = spawnCardCreature(key, p.x, p.z, { y: holdH, holdHeight: holdH, mode: 'held' });
    if (!creature) { cardGesture = null; return; }
    gesture.dragging = true;
    gesture.creature = creature;
    gesture.holdH = holdH;
    gesture.card.classList.add('dragging');
    gesture.card.setAttribute('aria-grabbed', 'true');
    if (!isRayKey(key)) {
      creature.mode = 'held';
      creature.heldTarget.copy(p);
      creature.setOverlay(true);
    } else {
      creature.mode = 'held';
      creature.heldTarget.copy(p);
      creature.pos.copy(p);
    }
    updateHeldCreatureToPointer(gesture.lastX, gesture.lastY, gesture);
  }

  function updateHeldCreatureToPointer(clientX, clientY, gesture) {
    if (!gesture || !gesture.creature) return;
    const c = gesture.creature;
    const h = gesture.holdH;
    const p = screenToWorld(clientX, clientY, h);
    if (isRayKey(gesture.key)) {
      c.heldTarget.copy(p);
    } else {
      c.heldTarget.copy(p);
    }
    gesture.lastX = clientX; gesture.lastY = clientY;
  }

  function releaseHeldCreature(gesture) {
    if (!gesture || !gesture.creature) return;
    const c = gesture.creature;
    const key = gesture.key;
    // land exactly under the pointer in screen space before beginning the fall
    if (c.heldTarget) {
      c.pos.copy(c.heldTarget);
      if (c.group) c.group.position.copy(c.heldTarget);
    }
    if (isRayKey(key)) {
      c.mode = 'falling';
      c.velY = 0.2;
      c.excite = 1.2;
      c.lastY = c.pos.y;
    } else {
      c.mode = 'falling';
      c.vel.set(0, 0, 0);
      c.lastY = c.pos.y;
      c.setOverlay(true);
    }
    if (fxAudio.drop) fxAudio.drop();
  }

  function throwFromCard(card, key, clientX, clientY) {
    if (totalCreatures() >= creatureCap) {
      showToast('The shallows are full — ' + creatureCap + ' creatures afloat', 2400);
      return;
    }
    const rect = card.getBoundingClientRect();
    const holdH = holdHeightFor(key);
    const start = screenToWorld(rect.left + rect.width / 2, rect.top + rect.height / 2, holdH);
    const to = chooseThrowTarget(key);
    const c = spawnCardCreature(key, start.x, start.z, { y: holdH, holdHeight: holdH, mode: 'thrown', heading: rand(0, TAU) });
    if (!c) return;
    const arc = makeArc(start, to);
    if (isRayKey(key)) {
      c.mode = 'thrown';
      c.throwState = arc;
      c.pos.copy(arc.start);
      c.heading = Math.atan2(arc.to.x - arc.start.x, arc.to.z - arc.start.z);
      c.lastY = c.pos.y;
      c.speed = c.spec.speed * 1.2;
    } else {
      c.mode = 'thrown';
      c.throwState = arc;
      c.pos.copy(arc.start);
      c.lastY = c.pos.y;
      c.setOverlay(true);
      c.group.position.copy(c.pos);
    }
    card.classList.add('flung');
    setTimeout(() => card.classList.remove('flung'), 600);
    if (fxAudio.throw) fxAudio.throw();
  }

  function onCardPointerDown(e) {
    const card = e.currentTarget;
    if (e.button !== undefined && e.button !== 0) return;
    if (cardGesture) return;
    if (totalCreatures() >= creatureCap) {
      showToast('The shallows are full — ' + creatureCap + ' creatures afloat', 2400);
      return;
    }
    e.preventDefault();
    cardGesture = {
      card, key: cardKeyFromEl(card), pointerId: e.pointerId,
      startX: e.clientX, startY: e.clientY, lastX: e.clientX, lastY: e.clientY,
      dragging: false, creature: null, cancelled: false
    };
    card.classList.add('pressing');
    window.addEventListener('pointermove', onCardPointerMove, { passive: false });
    window.addEventListener('pointerup', onCardPointerUp);
    window.addEventListener('pointercancel', onCardPointerCancel);
  }

  function onCardPointerMove(e) {
    if (!cardGesture || e.pointerId !== cardGesture.pointerId) return;
    const dx = e.clientX - cardGesture.startX, dy = e.clientY - cardGesture.startY;
    const dist = Math.hypot(dx, dy);
    if (!cardGesture.dragging && dist > 7) {
      beginCardDrag(cardGesture);
    }
    if (cardGesture.dragging) {
      e.preventDefault();
      updateHeldCreatureToPointer(e.clientX, e.clientY, cardGesture);
    } else {
      cardGesture.lastX = e.clientX; cardGesture.lastY = e.clientY;
    }
  }

  function finishCardGesture(e, cancelled) {
    if (!cardGesture) return;
    const g = cardGesture;
    cardGesture = null;
    g.card.classList.remove('pressing');
    window.removeEventListener('pointermove', onCardPointerMove);
    window.removeEventListener('pointerup', onCardPointerUp);
    window.removeEventListener('pointercancel', onCardPointerCancel);
    if (g.dragging) {
      if (cancelled) {
        // let the creature fall wherever it is rather than losing it
        releaseHeldCreature(g);
      } else {
        updateHeldCreatureToPointer(e.clientX, e.clientY, g);
        // give the system one frame at the final target, then drop
        releaseHeldCreature(g);
      }
      g.card.classList.remove('dragging');
      g.card.setAttribute('aria-grabbed', 'false');
    } else {
      g.card.classList.remove('dragging');
      g.card.setAttribute('aria-grabbed', 'false');
      if (!cancelled) throwFromCard(g.card, g.key, e.clientX, e.clientY);
    }
  }

  function onCardPointerUp(e) {
    if (!cardGesture || e.pointerId !== cardGesture.pointerId) return;
    finishCardGesture(e, false);
  }
  function onCardPointerCancel(e) {
    if (!cardGesture || e.pointerId !== cardGesture.pointerId) return;
    finishCardGesture(e, true);
  }

  function handleControl(action) {
    if (action === 'rain') setRain(!rainOn);
    else if (action === 'whirl') setWhirl(!whirlOn);
    else if (action === 'calm') setCalm(!calmMode);
    else if (action === 'clear') setClear(!clearMode);
    else if (action === 'sound') setSound(!soundOn);
    else if (action === 'hide') toggleUI();
  }

  function wireControls() {
    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        handleControl(btn.dataset.action);
      });
    });
    document.querySelectorAll('.card').forEach((card) => {
      card.addEventListener('pointerdown', onCardPointerDown);
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          throwFromCard(card, cardKeyFromEl(card));
        }
      });
    });
    const restore = document.getElementById('restore');
    if (restore) restore.addEventListener('click', () => toggleUI(false));
    window.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key.toLowerCase();
      if (k === 'r') { e.preventDefault(); setRain(!rainOn); }
      else if (k === 'w') { e.preventDefault(); setWhirl(!whirlOn); }
      else if (k === 'c') { e.preventDefault(); setCalm(!calmMode); }
      else if (k === 'm') { e.preventDefault(); setSound(!soundOn); }
      else if (k === 'h') { e.preventDefault(); toggleUI(); }
    });
    controlsReady = true;
  }

  function canvasPointerDown(e) {
    if (e.button !== undefined && e.button !== 0) return;
    if (cardGesture) return;
    if (whirlOn) {
      const p = screenToWorld(e.clientX, e.clientY, 0);
      if (shoreQ(p.x, p.z) > 0.5) {
        whirl.center.set(p.x, 0, p.z);
        whirl.dragging = true;
        document.body.classList.add('whirl-dragging');
        e.preventDefault();
        canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
      }
      return;
    }
    const p = screenToWorld(e.clientX, e.clientY, 0);
    const q = shoreQ(p.x, p.z);
    if (q > 0.1) {
      fx.ripple(p.x, p.z, 0.8, 0.55);
      fx.splash(p.x, p.z, 0.35, 0.15);
      scareRaysAt(p.x, p.z, 5.2, 0.8);
      scareJelliesAt(p.x, p.z, 3.6);
    } else {
      fx.silt(p.x, p.z, 0.55);
      scareRaysAt(p.x, p.z, 4.5, 0.5);
    }
  }
  function canvasPointerMove(e) {
    if (!whirlOn || !whirl.dragging) return;
    const p = screenToWorld(e.clientX, e.clientY, 0);
    if (shoreQ(p.x, p.z) > 0.25) whirl.center.set(p.x, 0, p.z);
  }
  function canvasPointerUp(e) {
    if (whirl.dragging) {
      whirl.dragging = false;
      document.body.classList.remove('whirl-dragging');
      if (canvas.releasePointerCapture && e.pointerId !== undefined) {
        try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
      }
    }
  }

  function wireCanvas() {
    canvas.addEventListener('pointerdown', canvasPointerDown);
    canvas.addEventListener('pointermove', canvasPointerMove);
    canvas.addEventListener('pointerup', canvasPointerUp);
    canvas.addEventListener('pointercancel', canvasPointerUp);
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  // --------------------------------------------------------------- synthesized sound
  class OceanAudio {
    constructor() {
      this.enabled = false;
      this.ctx = null;
      this.lastUpdate = 0;
      this.ready = false;
    }
    init() {
      if (this.ready) {
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        return true;
      }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      const ctx = new AC();
      this.ctx = ctx;
      const master = ctx.createGain();
      master.gain.value = 0.0;
      master.connect(ctx.destination);
      this.master = master;

      const seconds = 4;
      const buffer = ctx.createBuffer(1, ctx.sampleRate * seconds, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      let brown = 0;
      for (let i = 0; i < data.length; i++) {
        const white = Math.random() * 2 - 1;
        brown = (brown + 0.02 * white) / 1.02;
        data[i] = brown * 3.2 + white * 0.23;
      }
      this.noiseBuffer = buffer;

      // broad, slow surf
      this.surfSrc = ctx.createBufferSource();
      this.surfSrc.buffer = buffer; this.surfSrc.loop = true;
      this.surfFilter = ctx.createBiquadFilter();
      this.surfFilter.type = 'lowpass'; this.surfFilter.frequency.value = 440; this.surfFilter.Q.value = 0.38;
      this.surfGain = ctx.createGain(); this.surfGain.gain.value = 0.0;
      this.surfSrc.connect(this.surfFilter); this.surfFilter.connect(this.surfGain); this.surfGain.connect(master);
      this.surfSrc.start();

      // hissing backwash and foam
      this.hissSrc = ctx.createBufferSource();
      this.hissSrc.buffer = buffer; this.hissSrc.loop = true;
      this.hissFilter = ctx.createBiquadFilter();
      this.hissFilter.type = 'bandpass'; this.hissFilter.frequency.value = 1250; this.hissFilter.Q.value = 0.55;
      this.hissGain = ctx.createGain(); this.hissGain.gain.value = 0.0;
      this.hissSrc.connect(this.hissFilter); this.hissFilter.connect(this.hissGain); this.hissGain.connect(master);
      this.hissSrc.start();

      // rain patter layer
      this.rainSrc = ctx.createBufferSource();
      this.rainSrc.buffer = buffer; this.rainSrc.loop = true;
      this.rainFilter = ctx.createBiquadFilter();
      this.rainFilter.type = 'highpass'; this.rainFilter.frequency.value = 2600;
      this.rainGain = ctx.createGain(); this.rainGain.gain.value = 0.0;
      this.rainSrc.connect(this.rainFilter); this.rainFilter.connect(this.rainGain); this.rainGain.connect(master);
      this.rainSrc.start();

      this.ready = true;
      fx.setAudioHooks({
        splash: (scale, force) => this.splash(scale, force),
        plink: (f, v) => this.plink(f, v),
        drop: () => this.drop(),
        throw: () => this.drop(0.5)
      });
      return true;
    }
    setEnabled(on) {
      this.enabled = !!on;
      if (this.enabled) {
        if (!this.init()) return false;
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const t = this.ctx.currentTime;
        this.master.gain.cancelScheduledValues(t);
        this.master.gain.setTargetAtTime(0.72, t, .18);
      } else if (this.ready) {
        const t = this.ctx.currentTime;
        this.master.gain.cancelScheduledValues(t);
        this.master.gain.setTargetAtTime(0.0, t, .12);
      }
      return true;
    }
    splash(scale = 1, force = .7) {
      if (!this.ready || !this.enabled) return;
      const ctx = this.ctx, now = ctx.currentTime;
      const src = ctx.createBufferSource(); src.buffer = this.noiseBuffer;
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = rand(650, 1500); f.Q.value = .7;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.12 * scale * clamp(force, .3, 1.2), now + .015);
      g.gain.exponentialRampToValueAtTime(0.0001, now + .48 + .2 * rand());
      src.connect(f); f.connect(g); g.connect(this.master);
      src.start(now); src.stop(now + .9);
      const osc = ctx.createOscillator(); const og = ctx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(rand(92, 145), now);
      osc.frequency.exponentialRampToValueAtTime(rand(42, 58), now + .22);
      og.gain.setValueAtTime(0.0001, now); og.gain.exponentialRampToValueAtTime(0.045 * scale, now + .012);
      og.gain.exponentialRampToValueAtTime(0.0001, now + .28);
      osc.connect(og); og.connect(this.master); osc.start(now); osc.stop(now + .32);
    }
    plink(freq = 1200, volume = .03) {
      if (!this.ready || !this.enabled) return;
      const ctx = this.ctx, now = ctx.currentTime;
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(freq, now);
      osc.frequency.exponentialRampToValueAtTime(freq * .62, now + .14);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(volume, now + .006);
      g.gain.exponentialRampToValueAtTime(0.0001, now + .22);
      osc.connect(g); g.connect(this.master); osc.start(now); osc.stop(now + .3);
    }
    drop(quiet = 1) {
      if (!this.ready || !this.enabled) return;
      const ctx = this.ctx, now = ctx.currentTime;
      const src = ctx.createBufferSource(); src.buffer = this.noiseBuffer;
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = rand(800, 1600); f.Q.value = 1.4;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(.026 * quiet, now + .012);
      g.gain.exponentialRampToValueAtTime(.0001, now + .2);
      src.connect(f); f.connect(g); g.connect(this.master); src.start(now); src.stop(now + .3);
    }
    update(swash, prevSwash, dt, raining) {
      if (!this.ready) return;
      const ctx = this.ctx;
      const now = ctx.currentTime;
      if (!this.enabled) {
        this.surfGain.gain.setTargetAtTime(0, now, .2);
        this.hissGain.gain.setTargetAtTime(0, now, .2);
        this.rainGain.gain.setTargetAtTime(0, now, .2);
        return;
      }
      if (now - this.lastUpdate < .055) return;
      this.lastUpdate = now;
      const rate = Math.abs(swash - prevSwash) / Math.max(.016, dt);
      const storm = raining ? 1 : 0;
      const surf = .035 + clamp(swash, 0, 2.2) * .027 + rate * .024 + storm * .022;
      this.surfGain.gain.setTargetAtTime(surf, now, .09);
      this.surfFilter.frequency.setTargetAtTime(330 + swash * 155 + storm * 130, now, .1);
      this.hissGain.gain.setTargetAtTime(.008 + rate * .037 + storm * .014, now, .07);
      this.hissFilter.frequency.setTargetAtTime(1000 + swash * 380 + storm * 500, now, .12);
      this.rainGain.gain.setTargetAtTime(storm * .012, now, .3);
    }
  }

  const audio = new OceanAudio();
  function setSound(on) {
    const result = audio.setEnabled(on);
    soundOn = !!(on && result);
    setControlState('sound', soundOn);
    showToast(soundOn ? 'Sound on  ·  surf, splashes and little plinks' : 'The sea falls quiet', 1600);
    return soundOn;
  }

  function makeThumbBackdropTexture() {
    const c = makeCanvas(512, 512), g = c.getContext('2d');
    const grd = g.createLinearGradient(0, 0, 0, 512);
    grd.addColorStop(0, '#b9eee2');
    grd.addColorStop(0.42, '#54b9b2');
    grd.addColorStop(1, '#0b3246');
    g.fillStyle = grd; g.fillRect(0, 0, 512, 512);
    const sun = g.createRadialGradient(102, 62, 4, 102, 62, 280);
    sun.addColorStop(0, 'rgba(255,252,220,.65)');
    sun.addColorStop(.25, 'rgba(255,246,200,.18)');
    sun.addColorStop(1, 'rgba(255,246,200,0)');
    g.fillStyle = sun; g.fillRect(0, 0, 512, 512);
    // caustic ribbons
    g.globalCompositeOperation = 'screen';
    for (let i = 0; i < 12; i++) {
      g.strokeStyle = 'rgba(230,255,231,' + (0.025 + Math.random() * 0.045) + ')';
      g.lineWidth = 4 + Math.random() * 22;
      g.beginPath();
      for (let k = 0; k < 38; k++) {
        const a = k * .18 + i;
        const x = 270 + Math.cos(a) * (65 + i * 24) + Math.sin(a * 2.7) * 90;
        const y = 300 + Math.sin(a) * (52 + i * 14) + Math.cos(a * 2.1) * 120;
        if (k === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke();
    }
    g.globalCompositeOperation = 'source-over';
    // dark vignette
    const v = g.createRadialGradient(256, 250, 30, 256, 250, 360);
    v.addColorStop(0, 'rgba(2,29,35,0)'); v.addColorStop(1, 'rgba(2,27,31,.5)');
    g.fillStyle = v; g.fillRect(0, 0, 512, 512);
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    return t;
  }

  function makeContactTexture() {
    const c = makeCanvas(128, 128), g = c.getContext('2d');
    const grd = g.createRadialGradient(64, 64, 2, 64, 64, 64);
    grd.addColorStop(0, 'rgba(0,25,25,.55)'); grd.addColorStop(.55, 'rgba(0,25,25,.2)'); grd.addColorStop(1, 'rgba(0,25,25,0)');
    g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
    const t = new THREE.CanvasTexture(c); return t;
  }

  let thumbnailsDone = false;
  function generateThumbnails() {
    if (thumbnailsDone) return;
    thumbnailsDone = true;
    const size = 512;
    const rt = new THREE.WebGLRenderTarget(size, size, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat, type: THREE.UnsignedByteType, depthBuffer: true, stencilBuffer: false
    });
    rt.texture.generateMipmaps = false;
    rt.texture.encoding = THREE.sRGBEncoding;
    const pixels = new Uint8Array(size * size * 4);
    const tmp = makeCanvas(size, size);
    const tctx = tmp.getContext('2d');
    const backdropMap = makeThumbBackdropTexture();
    const contactMap = makeContactTexture();
    const specs = ['manta', 'eagle', 'stingray', 'moon', 'nettle'];

    specs.forEach((key) => {
      const cardCanvas = document.getElementById('thumb-' + key);
      if (!cardCanvas) return;
      const s = new THREE.Scene();
      const cam = new THREE.PerspectiveCamera(33, 1, 0.1, 60);
      const isJelly = key === 'moon' || key === 'nettle';
      if (isJelly) {
        if (key === 'nettle') {
          cam.position.set(3.6, 4.3, 7.1);
          cam.lookAt(0, -0.55, 0);
        } else {
          cam.position.set(2.8, 3.4, 4.6);
          cam.lookAt(0, 0.05, 0);
        }
      } else {
        cam.position.set(0.45, 6.5, 2.8);
        cam.lookAt(0, 0, 0.12);
      }
      s.add(cam);
      const bgMat = new THREE.MeshBasicMaterial({ map: backdropMap, depthTest: false, depthWrite: false, toneMapped: false });
      const bg = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), bgMat);
      const dist = 12;
      bg.scale.set(2 * Math.tan(cam.fov * DEG / 2) * dist, 2 * Math.tan(cam.fov * DEG / 2) * dist, 1);
      bg.position.set(0, 0, -dist);
      bg.renderOrder = -100;
      cam.add(bg);

      s.add(new THREE.HemisphereLight(0xe8fff6, 0x0b303b, 0.58));
      const keyLight = new THREE.DirectionalLight(0xfff3d6, 1.05);
      keyLight.position.set(-4, 7, -5);
      s.add(keyLight);
      const rim = new THREE.DirectionalLight(0x8cebdf, 0.46);
      rim.position.set(4, 2, 5);
      s.add(rim);
      const warm = new THREE.PointLight(0xffd59c, 0.38, 30);
      warm.position.set(3, 2, 3);
      s.add(warm);

      const shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.MeshBasicMaterial({
        map: contactMap, transparent: true, depthWrite: false, opacity: .85
      }));
      shadowPlane.rotation.x = -Math.PI / 2;
      shadowPlane.position.set(0, isJelly ? -2.4 : -0.55, 0);
      s.add(shadowPlane);

      let object = null;
      if (!isJelly) {
        const sys = raySystems[key];
        const mesh = new THREE.InstancedMesh(sys.geometry, [sys.topMat, sys.bottomMat], 1);
        const dummy = new THREE.Object3D();
        const scale = key === 'manta' ? 0.8 : key === 'eagle' ? 0.84 : 0.94;
        dummy.position.set(0, 0, 0.1);
        dummy.rotation.set(-0.03, Math.PI + 0.16, 0.055);
        dummy.scale.setScalar(scale);
        dummy.updateMatrix();
        mesh.setMatrixAt(0, dummy.matrix);
        mesh.instanceMatrix.needsUpdate = true;
        sys.geometry.attributes.aPhase.array[0] = 0.6;
        sys.geometry.attributes.aPhase.needsUpdate = true;
        mesh.frustumCulled = false;
        s.add(mesh);
        object = mesh;
        cam.position.set(0.45, 6.5, 2.8);
        cam.lookAt(0, 0, 0.12);
      } else {
        const jm = makeJellyModel(key);
        const group = jm.group;
        group.position.set(0, key === 'nettle' ? 0.8 : 0.65, 0);
        group.scale.setScalar(key === 'nettle' ? 0.58 : 0.9);
        group.rotation.set(0.09, 0, 0);
        jm.bellMat.uniforms.uPulse.value = key === 'nettle' ? 0.18 : 0.1;
        jm.bellMat.uniforms.uTime.value = 1.8;
        jm.tentMat.uniforms.uTime.value = 1.8;
        s.add(group);
        object = group;
        if (key === 'nettle') {
          cam.position.set(3.6, 4.3, 7.1);
          cam.lookAt(0, -0.55, 0);
        } else {
          cam.position.set(2.8, 3.4, 4.6);
          cam.lookAt(0, 0.05, 0);
        }
      }
      cam.updateMatrixWorld();
      renderer.setRenderTarget(rt);
      renderer.setClearColor(0x0c3e49, 1);
      renderer.clear();
      renderer.render(s, cam);
      renderer.readRenderTargetPixels(rt, 0, 0, size, size, pixels);
      // WebGL rows are bottom-up; flip into the 2D canvas.
      const img = tctx.createImageData(size, size);
      for (let y = 0; y < size; y++) {
        const src = (size - 1 - y) * size * 4;
        const dst = y * size * 4;
        img.data.set(pixels.subarray(src, src + size * 4), dst);
      }
      tctx.putImageData(img, 0, 0);
      const ctx2 = cardCanvas.getContext('2d');
      ctx2.clearRect(0, 0, cardCanvas.width, cardCanvas.height);
      ctx2.drawImage(tmp, 0, 0, cardCanvas.width, cardCanvas.height);
      cardCanvas.classList.add('ready');
      // dispose temporary jelly materials only; shared geo stays for the live sea
      if (isJelly) {
        object.traverse((o) => {
          if (o.material && o.material !== jellyShared[key]?.gonadMat && o.material !== jellyShared[key]?.canalMat) o.material.dispose();
        });
      }
      bg.geometry.dispose(); bgMat.dispose(); shadowPlane.geometry.dispose(); shadowPlane.material.dispose();
    });
    renderer.setRenderTarget(null);
    renderer.setClearColor(0x072b38, 1);
    rt.dispose();
    backdropMap.dispose();
    contactMap.dispose();
  }

  function scheduleThumbnails() {
    setTimeout(() => {
      try { generateThumbnails(); } catch (err) { console.warn('Thumbnail render failed', err); }
    }, 220);
  }


  // --------------------------------------------------------------- resize / lifecycle
  let resizeTimer = 0;
  function handleResize() {
    updateCameraField(false);
    dpr = computeDPR();
    resizeRenderTargets();
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      rebuildWorld();
    }, 220);
  }

  function rebuildWorld() {
    if (!creaturesInitialized) return;
    buildStaticWorld();
    // nudge any creatures that ended up on the new beach or outside the frame
    for (const r of allRays) {
      if (!r) continue;
      if (!insideView(r.pos.x, r.pos.z, 0.8) || shoreQ(r.pos.x, r.pos.z) < 0.9) {
        const ang = Math.atan2(r.pos.x - beach.cx, r.pos.z - beach.cz);
        const rr = shoreRadiusAt(r.pos.x, r.pos.z) + 3.0;
        r.pos.x = beach.cx + Math.sin(ang) * rr;
        r.pos.z = beach.cz + Math.cos(ang) * rr;
      }
    }
    for (const j of allJellies) {
      if (!insideView(j.pos.x, j.pos.z, 0.8) || shoreQ(j.pos.x, j.pos.z) < 0.8) {
        const ang = Math.atan2(j.pos.x - beach.cx, j.pos.z - beach.cz);
        const rr = shoreRadiusAt(j.pos.x, j.pos.z) + 3.0;
        j.pos.x = beach.cx + Math.sin(ang) * rr;
        j.pos.z = beach.cz + Math.cos(ang) * rr;
      }
    }
    if (!insideView(whirl.center.x, whirl.center.z, 1)) {
      whirl.center.set(stageWorld(0.68, 0.5).x, 0, stageWorld(0.68, 0.5).z);
    }
  }

  function start() {
    if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) quality = 0.86;
    updateCameraField(false);
    initPipeline();
    updateCameraField(false);
    resizeRenderTargets();
    buildWorld();
    wireControls();
    wireCanvas();
    scheduleThumbnails();
    animate();
  }

  // The remaining systems are added below. They are function declarations so
  // hoisting keeps the top-level orchestration airy and readable.
  let lastTime = performance.now();
  let elapsed = 0;
  let creaturesInitialized = false;

  function buildWorld() {
    buildStaticWorld();
    if (!creaturesInitialized) {
      initRaySystems();
      raySpawnInitial();
      jellySpawnInitial();
      creaturesInitialized = true;
    }
    updateCreatureCounter();
    loader.classList.add('gone');
    setTimeout(() => { if (loader && loader.parentNode) loader.style.display = 'none'; }, 1400);
  }

  function animate(now) {
    requestAnimationFrame(animate);
    const t = now || performance.now();
    const dt = Math.max(0, Math.min(0.05, (t - lastTime) / 1000));
    lastTime = t;
    elapsed += dt;

    updateSwashState(dt);
    if (rainOn) {
      rainAccumulator += dt * 11.5;
      let guard = 0;
      while (rainAccumulator >= 1 && guard < 4) {
        rainAccumulator -= 1; guard++;
        const u = rand(0.03, 0.97), v = rand(0.03, 0.86);
        const p = stageWorld(u, v);
        if (shoreQ(p.x, p.z) < 0.75) continue;
        fx.ripple(p.x, p.z, rand(0.12, 0.30), 0.42);
        fx.addRing(p.x, p.z, rand(0.22, 0.52), 0.27);
        if (soundOn && Math.random() < 0.12) {
          audio.plink(rand(1200, 2300), 0.008);
        }
      }
    } else {
      rainAccumulator = 0;
    }
    if (audio && audio.ready) audio.update(swashLevel, prevSwashLevel, dt, rainOn);

    // simulation
    if (simRT_A) stepSimulation();

    // swaying palm; its live shadow follows the fronds
    if (palmSway) {
      const gust = (rainOn ? 1.35 : 1) * (calmMode ? 0.48 : 1);
      palmSway.rotation.z = Math.sin(elapsed * 0.41) * 0.012 * gust + Math.sin(elapsed * 0.17 + 0.7) * 0.006;
      palmSway.rotation.x = Math.sin(elapsed * 0.33 + 1.2) * 0.008 * gust;
      if (palmCrown) {
        palmCrown.rotation.z = Math.sin(elapsed * 0.52 + 0.8) * 0.022 * gust;
        palmCrown.rotation.x = Math.sin(elapsed * 0.44 + 2.1) * 0.016 * gust;
      }
      for (let i = 0; i < palmFronds.length; i++) {
        const f = palmFronds[i];
        const ph = f.userData.phase || 0;
        const sp = f.userData.speed || 0.7;
        f.rotation.y = f.userData.baseY + Math.sin(elapsed * sp + ph) * 0.018 * gust;
        f.rotation.x = f.userData.baseX + Math.sin(elapsed * sp * 1.21 + ph + 1.3) * 0.035 * gust;
        f.rotation.z = f.userData.baseZ + Math.sin(elapsed * sp * 0.83 + ph + 2.4) * 0.022 * gust;
      }
    }
    if (grassMaterial && grassMaterial.userData.shader) grassMaterial.userData.shader.uniforms.uTime.value = elapsed;

    if (raySystems.manta) {
      raySystems.manta.update(dt, elapsed);
      raySystems.eagle.update(dt, elapsed);
      raySystems.stingray.update(dt, elapsed);
    }
    for (let i = 0; i < allJellies.length; i++) allJellies[i].update(dt, elapsed);
    overlayDrips.update(dt);
    fx.update(dt);

    // water uniforms
    if (waterQuad) {
      const u = waterQuad.material.uniforms;
      camera.updateMatrixWorld();
      u.uTime.value = elapsed;
      u.uCamWorld.value.copy(camera.matrixWorld);
      u.uProjInv.value.copy(camera.projectionMatrixInverse);
      camera.getWorldDirection(u.uViewDir.value);
      u.uShoreCenter.value.set(beach.cx, beach.cz);
      u.uShoreRadius.value = beach.r;
      u.uAspect.value = view.cw / Math.max(1, view.ch);
      const cal = calmMode ? 1 : 0;
      u.uCalm.value = lerp(u.uCalm.value, cal, 1 - Math.exp(-dt * 1.4));
      u.uSwell.value = lerp(u.uSwell.value, calmMode ? 0.34 : 1, 1 - Math.exp(-dt * 1.3));
      u.uClear.value = lerp(u.uClear.value, clearMode ? 1 : 0, 1 - Math.exp(-dt * 2.0));
      u.uRain.value = lerp(u.uRain.value, rainOn ? 1 : 0, 1 - Math.exp(-dt * 1.5));
      u.uSwash.value = swashLevel;
      updateWhirlUniforms(u);
    }
    if (terrainUniforms) {
      terrainUniforms.uTime.value = elapsed;
      terrainUniforms.uSwashReach.value = swashLevel;
      terrainUniforms.uWetReach.value = wetReach;
      terrainUniforms.uShoreCenter.value.set(beach.cx, beach.cz);
      terrainUniforms.uShoreRadius.value = beach.r;
      terrainUniforms.uRain.value = rainOn ? 1 : 0;
    }

    // draw the opaque/transparent reef into an offscreen colour + depth buffer
    renderer.setRenderTarget(sceneRT);
    renderer.clear();
    renderer.render(scene, camera);

    // refract, tint, caustic and glitter the sea as a screen-space water pass
    renderer.setRenderTarget(postRT);
    renderer.clear();
    waterQuad.material.uniforms.tColor.value = sceneRT.texture;
    waterQuad.material.uniforms.tDepth.value = sceneRT.depthTexture;
    renderer.render(waterScene, waterCamera);

    // anti-alias and present
    renderer.setRenderTarget(null);
    renderer.clear();
    fxaaQuad.material.uniforms.uTime.value = elapsed;
    fxaaQuad.material.uniforms.uRain.value = waterQuad.material.uniforms.uRain.value;
    renderer.render(fxaaScene, fxaaCamera);

    // held / airborne jellyfish live above the water pass so their translucency
    // is not tinted by the screen-space sea
    if (allJellies.some((j) => j.group.parent === overlayScene) || overlayDrips.items.length) {
      renderer.autoClear = false;
      renderer.clearDepth();
      renderer.render(overlayScene, camera);
      renderer.autoClear = true;
    }
    if (fxaaQuad) fxaaQuad.material.uniforms.uTime.value = elapsed;

    // adaptive resolution: quietly shed pixels if the reef is asking too much
    perfFrames++;
    perfTime += dt;
    if (perfTime > 2.2 && elapsed > 4) {
      const fps = perfFrames / perfTime;
      if (fps < 43 && quality > 0.6 && elapsed - lastQualityChange > 4.5) {
        setQuality(quality - 0.12);
        lastQualityChange = elapsed;
      } else if (fps > 57 && quality < 1.0 && elapsed - lastQualityChange > 9) {
        setQuality(quality + 0.05);
        lastQualityChange = elapsed;
      }
      perfFrames = 0; perfTime = 0;
    }
  }
  let perfFrames = 0, perfTime = 0, lastQualityChange = 0;

  window.addEventListener('resize', handleResize, { passive: true });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {});
  }

  // kick things off once the CDN has painted
  try {
    start();
  } catch (err) {
    console.error(err);
    loader.innerHTML = '<div class="error-card"><strong>The reef could not be built.</strong><br>' + (err && err.message ? err.message : 'An unknown rendering error occurred.') + '</div>';
  }
})();
</script>
</body>
</html>
